  function desenharCarteira() {
    var cs = MR.dados.clientes.slice(), cont = { risco: 0, atencao: 0, ok: 0, sem: 0 };
    cs.forEach(function (c) { c.g = grupo(c); cont[c.g]++; });

        '<span class="mr-n" style="font-size:13px">' + esc(c.contabilidade) + ' · ' + din(c.vendas) + '</span><span class="mr-pill ' + ST_PILL[c.termometro.st] + '" style="font-size:12px">' + esc(c.termometro.st === 'ok' || c.termometro.st === 'atencao' || c.termometro.st === 'risco' ? 'Termômetro ' + c.termometro.pct + '%' : c.termometro.st === 'compras' ? 'Compras incompletas' : 'Poucos meses') + '</span></button>';
    };
    var html = topo('Carteira de clientes', esc(nomeMes(MR.mes)) + ' · ' + cs.length + ' clientes com dados no mês', sel) +
      '<section class="mr-g mr-st">' +
        [['risco', 'Risco', 'bad', 'Termômetro abaixo de 85% ou nota crítica'], ['atencao', 'Atenção', 'dn', 'Perto do limite ou pendências'], ['ok', 'Em dia', 'up', 'Sem alertas'], ['sem', 'Dados insuficientes', 'mu', 'Poucos meses ou compras faltando']].map(function (x) {
          return '<div class="mr-c"><div class="mr-rot">' + x[1] + '</div><div class="mr-v ' + x[2] + '">' + cont[x[0]] + '</div><div class="mr-n">' + x[3] + '</div></div>';
        }).join('') +
      '</section>' +
      (hoje.length ? '<section class="mr-c"><div class="mr-rot">Precisa de você hoje</div><div class="mr-hoje">' + hoje.map(function (c) {
        return '<button type="button" class="mr-cli" data-h="' + cs.indexOf(c) + '"><div style="min-width:0"><b>' + esc(rotC(c)) + '</b><div class="mr-n" style="font-size:13px">' + esc(c.contabilidade) + ' · ' + esc(motivo(c)) + '</div></div><span class="mr-nota ' + (c.g === 'risco' ? 'bad' : 'dn') + '">' + c.saude.nota + '</span></button>';
      }).join('') + '</div></section>' : '') +
      '<section class="mr-c"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><div class="mr-rot">Todos os clientes</div><div class="mr-filtro" role="group" aria-label="Filtrar">' +
        FILTROS.map(function (f) { return '<button type="button" class="mr-b" data-f="' + f[0] + '" aria-pressed="' + (MR.filtro === f[0]) + '">' + f[1] + '</button>'; }).join('') + '</div></div>' +
        (lista.length ? '<div class="mr-g mr-lista">' + lista.map(function (c) { return cartao(c, cs.indexOf(c)); }).join('') + '</div>' : '<div class="mr-n">Nenhum cliente neste filtro.</div>') +
      '</section>' +
      '<div class="mr-rod">Nota de 0 a 100: XML faltando, pendências na SEFAZ, falhas de numeração, Reforma Tributária e termômetro fiscal. Clique num cliente para abrir o Modo Reunião.</div>';
    var el = casca(html); ligarTopo();
    document.getElementById('mrMesC').onchange = function () { abrirCarteira(this.value, MR.contab); };
    el.querySelectorAll('[data-f]').forEach(function (b) { b.onclick = function () { MR.filtro = b.dataset.f; desenharCarteira(); }; });
    el.querySelectorAll('[data-i],[data-h]').forEach(function (b) {
      b.onclick = function () {
        var c = cs[+(b.dataset.i != null ? b.dataset.i : b.dataset.h)], mes = MR.mes;
        var u = DADOS.unidades.filter(function (x) { return x.contabilidade === c.contabilidade && x.cliente === c.cliente && (x.subpasta || '') === (c.subpasta || ''); })[0];
        if (u) abrirReuniao(u, u.meses.indexOf(mes) >= 0 ? mes : null);
      };
    });
  }
  window.abrirReuniao = abrirReuniao;
  window.abrirCarteira = abrirCarteira;
})();
</script>

<script>

  /* ---------------- minha senha (e troca obrigatória no primeiro acesso) ---------------- */

      (verif ? '<p class="nota">Conferência automática todo dia às 05:17 · última: ' + new Date(verif.verificado_em).toLocaleString('pt-BR') + '.</p>' : '') +
      '<div class="ferr">' + (ncms.length ? '<button class="btn sec" type="button" id="rtcCsv">Exportar (CSV)</button>' : '') + (emp && DADOS.unidades.length ? '<button class="btn" type="button" id="rtcAnalise">Abrir a Análise fiscal dos produtos</button>' : '') +

    if ($('rtcCsv')) $('rtcCsv').onclick = function () { csv([['ncm', 'NCM', 'm'], ['d', 'Descrição'], ['a', 'Antes', 'm'], ['b', 'Agora', 'm']], ncms.map(function (x) { return { ncm: x.ncm, d: x.d, a: (x.antes || []).join(' '), b: (x.depois || []).join(' ') }; }), 'mudancas IBS-CBS Receita ' + n.id + '.csv'); };
    var abrirAnalise = function (u) { d.close(); ATUAL = { aba: 'cad' }; abrir(u); };

      '<div class="kpis kpis4">' +
        kpi2('Notas emitidas conferidas', int(sai.conf), sai.erro ? int(sai.erro) + ' com divergência' : 'todas conferem', null, sai.erro ? 'bad' : (sai.conf ? 'ok' : 'muted')) +

    d.innerHTML = '<td colspan="10"><p class="nota" style="margin:0 0 6px">Chave ' + esc(n.chave) + ' · valor da nota R$ ' + brl(n.vNF) + (n.erros && n.erros.length < n.itensErro ? ' · mostrando ' + n.erros.length + ' de ' + n.itensErro + ' itens com divergência' : '') + '</p>' + msgRec +
      (it ? '<div class="tbl"><table class="cf-it"><thead><tr><th>Item</th><th class="n">Base na nota</th><th class="n">Base correta</th><th class="n">Base Receita</th><th class="n">CBS %</th><th class="n">IBS+CBS na nota</th><th class="n">Correto</th><th>Problema</th></tr></thead><tbody>' + it + '</tbody></table></div>'
        : '<p class="nota">O detalhe dos itens é guardado para as primeiras notas do mês; esta nota tem ' + int(n.itensErro) + ' item(ns) com divergência.</p>') + '</td>';
    tr.parentNode.insertBefore(d, tr.nextSibling);
  }
  function mensagem(f, notas) {
    var dele = notas.filter(function (n) { return n.origem === 'Compras' && n.partDoc === f.doc; });
    var tipos = {}; dele.forEach(function (n) { Object.keys(n.prob || {}).forEach(function (k) { tipos[k] = 1; }); });
    var u = ATUAL.u;
    var txt = 'Prezados, ' + f.nome + ',\n\n' +
      'Na conferência das notas fiscais que recebemos de vocês em ' + nomeMes(ATUAL.mes) + ', o grupo IBS/CBS (Reforma Tributária, NT 2025.002) veio diferente do cálculo oficial da Receita Federal:\n\n' +
      ORD.filter(function (k) { return tipos[k]; }).map(function (k) { return '• ' + PROB[k][0] + ': ' + PROB[k][1]; }).join('\n') + '\n\n' +
      'Notas: ' + (function () { var vis = {}, l = []; dele.forEach(function (n) { var k = 'nº ' + n.numero + ' de ' + dataBR(n.data); if (!vis[k]) { vis[k] = 1; l.push(k); } }); return l.slice(0, 15).join(', ') + (l.length > 15 ? ' e outras ' + (l.length - 15) : ''); })() + '.\n\n' +
      'Pedimos que verifiquem a configuração fiscal do emissor de vocês para as próximas notas. A partir de 2027 o crédito de CBS depende do valor destacado corretamente.\n\n' +
      'Atenciosamente,\n' + (u.cliente || '');
    $('cfMsg').innerHTML = '<div style="margin-top:12px"><textarea class="cf-msg" id="cfTxt" aria-label="Mensagem para o fornecedor">' + esc(txt) + '</textarea><div class="ferr" style="margin-top:8px"><button class="btn" type="button" id="cfCopiar">Copiar mensagem</button><span class="sub" id="cfOk"></span></div></div>';
    $('cfCopiar').onclick = function () { var t = $('cfTxt'); t.select(); try { navigator.clipboard.writeText(t.value).then(function () { $('cfOk').textContent = 'Copiada.'; }); } catch (e) { document.execCommand('copy'); $('cfOk').textContent = 'Copiada.'; } };
  }
})();
</script>
<!-- ================= APURAÇÃO FISCAL (estimativa: Simples Nacional e Lucro Presumido, comércio) ================= -->
<style>

<script>
(function () {
  var URL_AP = API_BANCO.replace(/\/farol$/, '/reuniao');
  var AP = null;   // cache { ck, mes, rbt, r }
  var NOME_R = { SN: 'Simples Nacional', MEI: 'MEI', PRESUMIDO: 'Lucro Presumido', REAL: 'Lucro Real', NORMAL: 'Regime normal (Presumido ou Real)' };
  function R$(v) { return 'R$ ' + brl(v); }
  function pc(v, d) { return (100 * v).toLocaleString('pt-BR', { minimumFractionDigits: d == null ? 2 : d, maximumFractionDigits: d == null ? 2 : d }) + '%'; }
  function linha(rot, v, sub, cls) { return '<tr' + (cls ? ' class="' + cls + '"' : '') + '><td>' + rot + (sub ? '<span class="s">' + sub + '</span>' : '') + '</td><td class="n">' + v + '</td></tr>'; }
  function chave() { var u = ATUAL.u; return 'farol_rbt12_' + chaveUnid(u.contabilidade, rotuloPainel(u)) + '_' + ATUAL.mes; }
  function rbtSalva() { try { var v = localStorage.getItem(chave()); return v ? Number(v) : null; } catch (e) { return null; } }
  function chamar(rbt) {
    var u = ATUAL.u;
    return fetch(URL_AP, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ acao: 'apuracao', token: TOKEN, contabilidade: u.contabilidade, cliente: u.cliente, subpasta: u.subpasta, mes: ATUAL.mes, rbt12: rbt }) })
      .then(function (r) { if (!r.ok) throw new Error('Servidor respondeu ' + r.status + '. Tente de novo.'); return r.json(); })
      .catch(function (e) { throw new Error(/Failed to fetch|NetworkError|Load failed/i.test(e.message) ? 'Sem conexão com o servidor. Confira a internet e tente de novo.' : e.message); })
      .then(function (j) { if (j.ok) return j.r; if (/SESSAO_EXPIRADA/.test(j.erro)) sair(true); throw new Error(j.erro); });
  }
  window.telaApuracao = function (c) {
    if (!USA_BANCO) { c.innerHTML = '<div class="card"><p class="nota">A apuração fiscal usa o banco de dados do portal. Abra o portal pelo link oficial, sem o "?banco=0" no final.</p></div>'; return; }
    var ck = chave(), rbt = rbtSalva();
    if (AP && AP.ck === ck && AP.rbt === rbt) { desenhar(c, AP.r); return; }
    c.innerHTML = '<div class="card"><p class="nota">Calculando a apuração de ' + esc(nomeMes(ATUAL.mes)) + '…</p></div>';
    chamar(rbt).then(function (r) { AP = { ck: ck, rbt: rbt, r: r }; if (ATUAL && ATUAL.aba === 'apur' && chave() === ck) desenhar($('conteudo'), r); })
      .catch(function (e) { if (ATUAL && ATUAL.aba === 'apur') c.innerHTML = '<div class="card"><p class="aviso bad">Não deu para calcular a apuração.</p><p class="nota">' + esc(e.message) + '</p><div class="ferr"><button class="btn sec" type="button" id="apTenta">Tentar de novo</button></div></div>'; if ($('apTenta')) $('apTenta').onclick = function () { telaApuracao(c); }; });
  };
  var AVISO = '<p class="nota" style="margin:0">Estimativa feita com os XML de venda e de compra que estão no portal, para empresa de <b>comércio</b>. Serve para conferir e conversar com o cliente; os valores oficiais saem da apuração da contabilidade (PGDAS-D, EFD, DCTFWeb).</p>';

  function desenhar(c, r) {
    var cab = '<div class="card"><p class="aviso' + (r.regime === 'NORMAL' ? ' warn' : '') + '" style="margin:0 0 6px"><b>' + esc(NOME_R[r.regime] || 'Regime não identificado') + '</b>' +
      (r.regime === 'NORMAL' ? ': o portal não conseguiu confirmar se é Presumido ou Real. A apuração abaixo considera Lucro Presumido; se não for, ajuste em Configurações › Regimes.' : '') + '</p>' + AVISO + '</div>';
    if (r.simples) c.innerHTML = cab + telaSimples(r, r.simples);
    else if (r.presumido) c.innerHTML = cab + telaPresumido(r, r.presumido);
    else if (r.real) c.innerHTML = cab + '<div class="apu-g">' + cartaoIcms(r.real.icms) + '<div class="card"><h2>PIS, COFINS, IRPJ e CSLL</h2><p class="nota">No Lucro Real o PIS e a COFINS são não cumulativos e o IRPJ e a CSLL dependem do lucro contábil, que não aparece nos XML. Por isso o portal mostra só o ICMS.</p></div></div>';
    else if (r.regime === 'MEI') c.innerHTML = cab + '<div class="card"><h2>MEI</h2><p class="nota">O MEI paga um valor fixo por mês no DAS-MEI, que não depende do faturamento. O que importa acompanhar é o limite anual de faturamento, mostrado no Painel.</p></div>';
    else c.innerHTML = cab + '<div class="card"><p class="nota">Não foi possível identificar o regime deste cliente. Informe o regime em Configurações › Regimes.</p></div>';
    ligar(c);
  }

  /* ---------- Simples Nacional ---------- */
  function telaSimples(r, s) {
    var fonte = {
      portal: 'Soma dos 12 meses anteriores com notas no portal.',
      informada: 'Valor informado por você (RBT12 do PGDAS-D).',
      estimada: 'O portal tem só ' + s.mesesPortal + ' dos 12 meses anteriores (soma de ' + R$(s.somaPortal) + '). Para não subestimar a faixa, a RBT12 foi estimada pela média desses meses × 12. Informe a RBT12 do PGDAS-D para o valor exato.',
      inicio: 'Não há meses anteriores no portal: a RBT12 foi estimada como a receita deste mês × 12. Informe a RBT12 do PGDAS-D para o valor exato.'
    }[s.rbtFonte];
    var corFonte = s.rbtFonte === 'portal' || s.rbtFonte === 'informada' ? '' : 'warn';
    var nomes = { irpj: 'IRPJ', csll: 'CSLL', cofins: 'COFINS', pis: 'PIS/Pasep', cpp: 'CPP (INSS patronal)', icms: 'ICMS' };
    return '<div class="kpis kpis4">' +
      kpi2('Faixa do Simples (Anexo I)', s.faixa + 'ª faixa', 'RBT12 de ' + R$(s.faixaDe) + ' até ' + R$(s.faixaAte)) +
      kpi2('Alíquota efetiva do mês', pc(s.efetiva), 'nominal ' + pc(s.nominal, 1) + (s.deduzir ? ' · dedução de ' + R$(s.deduzir) : '')) +
      kpi2('Receita bruta do mês', R$(s.receita), r.devolucoes ? 'já sem ' + R$(r.devolucoes) + ' de devoluções' : 'vendas com XML no portal') +
      kpi2('DAS estimado do mês', R$(s.das), 'vence dia 20 do mês seguinte', null, 'brand') + '</div>' +
      (s.excedeu ? '<div class="card"><p class="aviso bad">A receita dos últimos 12 meses passou de R$ 4,8 milhões, o limite do Simples Nacional. A empresa precisa ser desenquadrada: fale com o contador.</p></div>'
        : s.sublimite ? '<div class="card"><p class="aviso warn">A receita dos últimos 12 meses passou do sublimite de R$ 3,6 milhões: o ICMS deixa de ser pago no DAS e passa a ser apurado como no regime normal.</p></div>' : '') +
      '<div class="apu-g">' +
        '<section class="card"><h2>Como chegamos no DAS</h2><table class="apu">' +
          linha('Receita bruta do mês', R$(s.receita), 'vendas e exportações, menos devoluções; transferências não entram') +
          linha('× alíquota efetiva', pc(s.efetiva), '(RBT12 × ' + pc(s.nominal, 1) + ' − ' + R$(s.deduzir) + ') ÷ RBT12') +
          linha('= Valor antes das segregações', R$(s.receita * s.efetiva), '', 'sub') +
          (s.mono ? linha('− PIS e COFINS dos monofásicos', '− ' + R$(s.descMono), R$(s.mono) + ' em vendas com CST de PIS 04 (já tributados na indústria)') : '') +
          (s.st ? linha('− ICMS das vendas com substituição tributária', '− ' + R$(s.descSt), R$(s.st) + ' em vendas com CSOSN 500 ou CST 60 (ICMS já pago antes)') : '') +
          linha('DAS estimado', R$(s.das), '', 'tot') + '</table>' +
          (!s.mono && !s.st ? '<p class="nota">Nenhuma venda com monofásico (CST 04) ou com ICMS-ST neste mês: o DAS é a receita × a alíquota efetiva.</p>' : '<p class="nota">Essas receitas precisam ser informadas separadas no PGDAS-D, senão o cliente paga o imposto duas vezes.</p>') + '</section>' +
        '<section class="card"><h2>Receita dos últimos 12 meses (RBT12)</h2><div class="kpi kpi2" style="border:0;padding:0;box-shadow:none"><span class="v">' + R$(s.rbt12) + '</span></div>' +
          '<p class="aviso ' + corFonte + '" style="font-weight:500">' + esc(fonte) + '</p>' +
          '<div class="apu-rbt"><label>RBT12 do PGDAS-D<input id="apRbt" inputmode="decimal" placeholder="ex.: 1.250.000,00" value="' + (s.rbtFonte === 'informada' ? brl(s.rbt12) : '') + '"></label>' +
          '<button class="btn" type="button" id="apRbtOk">Recalcular</button>' + (s.rbtFonte === 'informada' ? '<button class="btn sec" type="button" id="apRbtLimpa">Usar o valor do portal</button>' : '') + '</div>' +
          '<p class="nota">O valor informado fica guardado neste computador para este cliente e este mês. A partir de janeiro de 2027 o portal já terá os 12 meses e a conta fica automática.</p></section>' +
        '<section class="card"><h2>Quanto vai para cada tributo</h2><table class="apu">' +
          Object.keys(nomes).filter(function (k) { return s.partes[k] > 0; }).map(function (k) { return linha(nomes[k], R$(s.partes[k])); }).join('') +
          linha('Total do DAS', R$(s.das), '', 'tot') + '</table><p class="nota">Repartição da ' + s.faixa + 'ª faixa do Anexo I da LC 123/2006.</p></section>' +
      '</div>';
  }

  /* ---------- Lucro Presumido ---------- */
  function cartaoIcms(i) {
    var semCompras = RESUMO && RESUMO.totais && RESUMO.totais.Compras && !RESUMO.totais.Compras.qtd;
    return '<section class="card"><h2>ICMS do mês</h2><table class="apu">' +
      linha('Débitos: ICMS destacado nas saídas', R$(i.debitos), 'NF-e e NFC-e emitidas') +
      linha('− Créditos: ICMS das entradas', '− ' + R$(i.creditos), 'notas de compra e devoluções recebidas') +
      (i.credorAnterior ? linha('− Saldo credor dos meses anteriores', '− ' + R$(i.credorAnterior), 'acumulado pelo portal desde ' + nomeMes(i.desde)) : '') +
      (i.aPagar ? linha('ICMS a pagar', R$(i.aPagar), '', 'tot') : linha('Sem ICMS a pagar', R$(0), 'saldo credor de ' + R$(i.credorProximo) + ' passa para o próximo mês', 'tot')) + '</table>' +
      (semCompras ? '<p class="aviso warn">Não há notas de compra no portal neste mês: os créditos podem estar faltando e o ICMS a pagar ficar maior do que o real.</p>' : '') +
      '<p class="nota">Os créditos somam todo o ICMS destacado nas compras: tire o que for de uso e consumo ou ativo, que não dá crédito. Não entram o ICMS-ST, a antecipação e o diferencial de alíquota pagos em guia própria. Confira o saldo credor com a EFD ICMS/IPI.</p></section>';
  }
  function telaPresumido(r, p) {
    var x = p.pc, i = p.icms, ir = p.ir, excl = !(window.localStorage && localStorage.getItem('farol_apu_sem_tema69') === '1');
    var base = excl ? x.base : x.baseSemExcl, pis = excl ? x.pis : x.pisSemExcl, cof = excl ? x.cofins : x.cofinsSemExcl;
    var mesesQ = ir.mesesTrimestre.map(function (m) { return MES[Number(m.slice(5, 7)) - 1]; }).join(', ');
    var vencTxt = MES[Number(ir.vencimento.slice(5, 7)) - 1] + ' de ' + ir.vencimento.slice(0, 4);
    return '<div class="kpis kpis4">' +
      kpi2('PIS (0,65%)', R$(pis), 'vence dia 25 do mês seguinte') +
      kpi2('COFINS (3%)', R$(cof), 'vence dia 25 do mês seguinte') +
      (i.aPagar ? kpi2('ICMS a pagar', R$(i.aPagar), 'débitos − créditos', null, 'bad') : kpi2('ICMS a pagar', R$(0), 'saldo credor de ' + R$(i.credorProximo), null, 'brand')) +
      kpi2('IRPJ + CSLL deste mês', R$(ir.irpjMes + ir.csllMes), 'parte do ' + ir.trimestre + 'º trimestre') + '</div>' +
      '<div class="apu-g">' +
        '<section class="card"><h2>PIS e COFINS (cumulativo)</h2>' +
          '<label class="apu-chk"><input type="checkbox" id="apT69"' + (excl ? ' checked' : '') + '> Excluir o ICMS da base (Tema 69 do STF)</label><table class="apu">' +
          linha('Vendas com PIS/COFINS tributado', R$(x.receitaTributada), 'itens com CST de PIS 01, 02 ou 03') +
          (x.devolucoes ? linha('− Devoluções de venda (parte tributada)', '− ' + R$(x.devolucoes)) : '') +
          (excl && x.icmsExcluido ? linha('− ICMS destacado nessas vendas', '− ' + R$(x.icmsExcluido), 'estimado na mesma proporção') : '') +
          linha('= Base de cálculo', R$(base), '', 'sub') +
          linha('PIS 0,65%', R$(pis)) + linha('COFINS 3%', R$(cof)) +
          linha('Total PIS + COFINS', R$(pis + cof), '', 'tot') + '</table>' +
          '<p class="nota">Destacado nas notas pelo sistema do cliente: PIS ' + R$(x.pisDest) + ' e COFINS ' + R$(x.cofinsDest) + '.</p>' +
          (x.parteNaoTrib > 0.6 ? '<p class="aviso warn" style="font-weight:500">' + pc(x.parteNaoTrib, 0) + ' das vendas (' + R$(x.receitaSemTributo) + ') saíram com CST de PIS de 04 a 09: monofásico, alíquota zero, isenta ou sem incidência. ' +
            (x.monofasico ? R$(x.monofasico) + ' são monofásicos (CST 04). ' : '') + 'Se algum produto estiver com o CST errado no cadastro, o PIS e a COFINS ficam menores que o devido.</p>' : '') + '</section>' +
        cartaoIcms(i) +
        '<section class="card"><h2>IRPJ e CSLL · ' + ir.trimestre + 'º trimestre</h2><table class="apu">' +
          linha('Receita do trimestre até agora', R$(ir.receitaTrimestre), mesesQ + (ir.mesesFaltando ? ' · faltam ' + ir.mesesFaltando + ' mês(es)' : ' · trimestre completo')) +
          linha('Base do IRPJ (presunção de 8%)', R$(ir.baseIrpj), ir.excedente ? 'inclui +10% na presunção sobre ' + R$(ir.excedente) + ' acima de R$ 1,25 mi (LC 224/2025)' : '') +
          linha('IRPJ 15%', R$(ir.irpjNormal)) +
          (ir.adicional ? linha('Adicional de IRPJ 10%', R$(ir.adicional), 'sobre a base que passa de R$ 20 mil por mês') : '') +
          linha('Base da CSLL (presunção de 12%)', R$(ir.baseCsll)) +
          linha('CSLL 9%', R$(ir.csllTrimestre)) +
          linha('IRPJ + CSLL do trimestre até agora', R$(ir.irpjTrimestre + ir.csllTrimestre), '', 'tot') +
          linha('Parte deste mês (' + esc(MES[Number(r.mes.slice(5, 7)) - 1]) + ')', R$(ir.irpjMes + ir.csllMes), 'IRPJ ' + R$(ir.irpjMes) + ' · CSLL ' + R$(ir.csllMes) + ', proporcional à receita do mês', 'sub') + '</table>' +
          '<p class="nota">Pagamento até o último dia útil de ' + vencTxt + ' (quota única) ou em 3 quotas.' + (ir.mesesFaltando ? ' O trimestre ainda não fechou: o valor cresce com os próximos meses.' : '') +
          ' Só entram as vendas com XML; receitas financeiras, aluguéis e serviços somam à base e não aparecem aqui.</p></section>' +
      '</div>';
  }

  function ligar(c) {
    var ok = $('apRbtOk'), limpa = $('apRbtLimpa'), t69 = $('apT69');
    if (ok) ok.onclick = function () {
      var v = Number(String($('apRbt').value).replace(/[^\d,]/g, '').replace(',', '.'));
      if (!(v > 0)) { $('apRbt').focus(); return; }
      try { localStorage.setItem(chave(), String(v)); } catch (e) {}
      AP = null; telaApuracao(c);
    };
    if ($('apRbt')) $('apRbt').onkeydown = function (ev) { if (ev.key === 'Enter') ok.click(); };
    if (limpa) limpa.onclick = function () { try { localStorage.removeItem(chave()); } catch (e) {} AP = null; telaApuracao(c); };
    if (t69) t69.onchange = function () { try { localStorage.setItem('farol_apu_sem_tema69', this.checked ? '0' : '1'); } catch (e) {} desenhar(c, AP.r); };
  }
})();
</script>
<script>
// ================================================================ COFRE CPUSIS (CSC, certificado digital e numeração das notas)
// Só perfis admin/cpusis. O servidor confere tudo de novo; revelar/baixar fica no registro de acessos.
(function () {
  var CF = null, CF_FILTRO = '';
  function ehCpusis() { return DADOS && (DADOS.perfil === 'admin' || DADOS.perfil === 'cpusis' || (!DADOS.perfil && DADOS.admin)); }
  function diasPara(iso) { return iso ? Math.floor((new Date(iso).getTime() - Date.now()) / 864e5) : null; }
  function situacaoCert(u) {
    if (!u.validade) return u.temSenha || u.temPfx ? { t: 'sem validade', c: 'warn' } : { t: 'não cadastrado', c: '' };
    var d = diasPara(u.validade);
    if (d < 0) return { t: 'vencido há ' + (-d) + (d === -1 ? ' dia' : ' dias'), c: 'bad' };
    if (d <= 30) return { t: 'vence em ' + d + (d === 1 ? ' dia' : ' dias'), c: 'warn' };
    return { t: 'válido', c: 'ok' };
  }
  function nums(u, modelo) {
    var l = u.numeros.filter(function (n) { return n.modelo === modelo; });
    if (!l.length) return '<span class="sub">' + (u.numerosAgente ? '—' : 'aguardando agente') + '</span>';
    return l.map(function (n) { return '<div class="cf-num"><b>' + int(n.numero) + '</b> <span class="sub">série ' + esc(n.serie) + (n.data ? ' · ' + dataBR(n.data) : '') + '</span></div>'; }).join('');
  }
  function oculto(id, campo, tem) {
    if (!tem) return '<span class="sub">—</span>';
    return '<span class="cf-seg" id="cf_' + campo + '_' + id + '">••••••••</span> <button class="lnk" type="button" data-rev="' + id + '" data-cpo="' + campo + '">revelar</button>';
  }
  window.telaCofre = function () {
    if (!ehCpusis()) return;
    marcarNav('cofre'); ATUAL = null; RESUMO = null;
    $('tela').innerHTML = carregando('Abrindo o cofre…');
    chamar('portalCofreLista', TOKEN).then(function (r) { CF = r; desenhar(); })
      .catch(function (e) { $('tela').innerHTML = '<div class="card erro">' + esc(e.message) + '</div>'; });
  };
  function aviso(t, erro) { var a = $('cfAviso'); if (!a) return; a.className = 'aviso' + (erro ? ' bad' : ''); a.textContent = t || ''; if (t) setTimeout(function () { if (a.textContent === t) a.textContent = ''; }, 8000); }
  function desenhar() {
    var U = CF.unidades;
    var comCert = U.filter(function (u) { return u.validade; });
    var vencidos = comCert.filter(function (u) { return diasPara(u.validade) < 0; }).length;
    var vencendo = comCert.filter(function (u) { var d = diasPara(u.validade); return d >= 0 && d <= 30; }).length;
    var nfce = U.filter(function (u) { return u.numeros.some(function (n) { return n.modelo === '65'; }); });
    var semCsc = nfce.filter(function (u) { return !u.temCsc; }).length;
    $('tela').innerHTML = '<div class="cab"><div><h1>Cofre CPUSIS</h1><p class="sub">Numeração das notas, CSC e certificado digital de cada cliente. Só a equipe da CPUSIS enxerga esta tela; ' +
      'tudo fica criptografado, e cada vez que alguém revela uma senha ou baixa um certificado fica anotado (quem, quando e de qual cliente).</p></div>' +
      '<button class="btn sec" type="button" id="cfAtual">Atualizar</button></div>' +
      (CF.ativo ? '' : '<div class="card erro"><b>O cofre ainda não foi ativado.</b> Falta cadastrar a chave COFRE_CHAVE nos segredos do Supabase. A numeração das notas já aparece; o CSC e o certificado só podem ser guardados depois disso.</div>') +
      '<div class="kpis kpis4">' + kpi2('Clientes / unidades', int(U.length), int(U.filter(function (u) { return u.numeros.length; }).length) + ' com numeração recebida', null) +
        kpi2('Certificados guardados', int(comCert.length), int(U.length - comCert.length) + ' sem certificado', null) +
        kpi2('Vencem em 30 dias', int(vencendo), vencidos ? int(vencidos) + ' já vencidos' : 'nenhum vencido', null, vencidos ? 'bad' : vencendo ? 'warn' : 'muted') +
        kpi2('Emitem NFC-e sem CSC', int(semCsc), 'de ' + int(nfce.length) + ' que emitem NFC-e', null, semCsc ? 'warn' : 'muted') + '</div>' +
      '<div class="ferr"><input type="search" id="cfBusca" placeholder="Buscar cliente, contabilidade ou CNPJ" style="min-width:300px">' +
      '<select id="cfFiltro"><option value="">Todos</option><option value="venc">Vencidos ou vencendo</option><option value="semcert">Sem certificado</option><option value="semcsc">Emitem NFC-e sem CSC</option></select></div>' +
      '<p id="cfAviso" class="aviso" role="status"></p><div class="tbl" id="cfTab"></div><dialog id="dlgCf" aria-labelledby="dlgCfTit"></dialog>';
    $('cfFiltro').value = CF_FILTRO;
    $('cfAtual').onclick = telaCofre;
    var tabela = function () {
      var b = norm($('cfBusca').value || ''); CF_FILTRO = $('cfFiltro').value;
      var L = U.filter(function (u) {
        if (b && norm([u.cliente, u.subpasta, u.contabilidade, u.cnpj, u.titular].join(' ')).indexOf(b) < 0) return false;
        if (CF_FILTRO === 'venc') return u.validade && diasPara(u.validade) <= 30;
        if (CF_FILTRO === 'semcert') return !u.validade;
        if (CF_FILTRO === 'semcsc') return !u.temCsc && u.numeros.some(function (n) { return n.modelo === '65'; });
        return true;
      });
      $('cfTab').innerHTML = '<table class="cf-tab"><thead><tr><th>Cliente</th><th>Última NF-e</th><th>Última NFC-e</th><th>CSC</th><th>Certificado digital</th><th>Senha</th><th></th></tr></thead><tbody>' +
        L.map(function (u) {
          var sc = situacaoCert(u);
          return '<tr><td><b>' + esc(u.cliente) + '</b>' + (u.subpasta ? ' <span class="pill info">' + esc(u.subpasta) + '</span>' : '') + '<div class="sub">' + esc(u.contabilidade) + (u.cnpj ? ' · ' + esc(fmtCnpj(u.cnpj)) : '') + '</div></td>' +
            '<td>' + nums(u, '55') + '</td><td>' + nums(u, '65') + '</td>' +
            '<td>' + (u.cscId ? '<div class="sub">id ' + esc(u.cscId) + '</div>' : '') + oculto(u.id, 'csc', u.temCsc) + '</td>' +
            '<td>' + (sc.c ? '<span class="pill ' + (sc.c === 'ok' ? '' : sc.c) + '">' + esc(sc.t) + '</span>' : '<span class="sub">' + sc.t + '</span>') +
              (u.validade ? '<div class="sub">até ' + new Date(u.validade).toLocaleDateString('pt-BR') + (u.titular ? ' · ' + esc(u.titular) : '') + '</div>' : '') +
              (u.temPfx ? '<button class="lnk" type="button" data-baixar="' + u.id + '">baixar .pfx</button>' : '') + '</td>' +
            '<td>' + oculto(u.id, 'senha', u.temSenha) + '</td>' +
            '<td><button class="lnk" type="button" data-ed="' + u.id + '">' + (u.temCsc || u.temPfx || u.temSenha ? 'editar' : 'cadastrar') + '</button>' + (u.obs ? ' <span class="ac-tag" title="' + esc(u.obs) + '">obs</span>' : '') + '</td></tr>';
        }).join('') + (L.length ? '' : '<tr><td colspan="7" class="sub">Nada encontrado.</td></tr>') + '</tbody></table>';
    };
    $('cfBusca').addEventListener('input', tabela); $('cfFiltro').addEventListener('change', tabela); tabela();
    $('cfTab').addEventListener('click', function (ev) {
      var x = ev.target.closest('button'); if (!x) return;
      if (x.dataset.ed) dlgCofre(achar(x.dataset.ed));
      else if (x.dataset.rev) revelar(x);
      else if (x.dataset.copiar) copiar(x);
      else if (x.dataset.baixar) baixarPfx(achar(x.dataset.baixar), x);
    });
  }
  function achar(id) { return CF.unidades.filter(function (u) { return String(u.id) === String(id); })[0]; }
  function fmtCnpj(c) { c = String(c).replace(/\D/g, ''); return c.length === 14 ? c.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5') : c; }
  function revelar(btn) {
    var id = btn.dataset.rev, cpo = btn.dataset.cpo, alvo = $('cf_' + cpo + '_' + id);
    btn.disabled = true; btn.textContent = 'abrindo…';
    chamar('portalCofreRevelar', TOKEN, Number(id), cpo).then(function (r) {
      alvo.textContent = r.valor; alvo.classList.add('aberto');
      btn.disabled = false; btn.textContent = 'copiar'; btn.removeAttribute('data-rev'); btn.dataset.copiar = r.valor;
      setTimeout(function () {   // esconde de novo em 30 s
        if (!document.body.contains(alvo)) return;
        alvo.textContent = '••••••••'; alvo.classList.remove('aberto');
        btn.textContent = 'revelar'; btn.dataset.rev = id; btn.removeAttribute('data-copiar');
      }, 30000);
    }).catch(function (e) { btn.disabled = false; btn.textContent = 'revelar'; aviso(e.message, true); });
  }
  function copiar(btn) {
    var v = btn.dataset.copiar || '';
    (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(function () { aviso('Copiado. Some da tela em 30 segundos.'); }).catch(function () { aviso('Não consegui copiar; selecione o texto e use Ctrl+C.', true); });
  }
  function baixarPfx(u, btn) {
    btn.disabled = true;
    chamar('portalCofreBaixar', TOKEN, u.id).then(function (r) {
      var bin = atob(r.base64), arr = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([arr], { type: 'application/x-pkcs12' })); a.download = r.arquivo;
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      btn.disabled = false; aviso('Certificado baixado. Lembre de apagar a cópia depois de instalar.');
    }).catch(function (e) { btn.disabled = false; aviso(e.message, true); });
  }
  function dlgCofre(u) {
    var d = $('dlgCf');
    d.innerHTML = '<form class="form" id="fCf" autocomplete="off"><h2 id="dlgCfTit">' + esc(u.cliente) + (u.subpasta ? ' / ' + esc(u.subpasta) : '') + '</h2><p class="sub" style="margin-top:-6px">' + esc(u.contabilidade) + (u.cnpj ? ' · CNPJ ' + esc(fmtCnpj(u.cnpj)) : '') + '</p>' +
      '<fieldset style="border:1px solid var(--line);border-radius:9px;padding:10px 12px"><legend class="sub">CSC da NFC-e</legend><div class="ferr" style="align-items:flex-end">' +
        '<label style="flex:1;min-width:120px">Id do CSC<input id="cfCscId" type="text" value="' + esc(u.cscId) + '" placeholder="ex.: 000001" maxlength="20"></label>' +
        '<label style="flex:3;min-width:240px">Código CSC ' + (u.temCsc ? '(em branco mantém o atual)' : '') + '<input id="cfCsc" type="password" autocomplete="new-password" maxlength="64"></label></div>' +
        (u.temCsc ? '<label class="ck"><input type="checkbox" id="cfApCsc"> Apagar o CSC guardado</label>' : '') + '</fieldset>' +
      '<fieldset style="border:1px solid var(--line);border-radius:9px;padding:10px 12px"><legend class="sub">Certificado digital A1</legend>' +
        (u.temPfx ? '<p class="nota" style="margin:0 0 6px">Guardado: ' + esc(u.arquivo || 'certificado.pfx') + (u.validade ? ' · válido até ' + new Date(u.validade).toLocaleDateString('pt-BR') : '') + (u.titular ? ' · ' + esc(u.titular) : '') + '</p>' : '') +
        '<label>' + (u.temPfx ? 'Trocar o arquivo (.pfx ou .p12)' : 'Arquivo do certificado (.pfx ou .p12)') + '<input id="cfPfx" type="file" accept=".pfx,.p12,application/x-pkcs12"></label>' +
        '<label>Senha do certificado ' + (u.temSenha ? '(em branco mantém a atual)' : '') + '<input id="cfSenha" type="password" autocomplete="new-password" maxlength="200"></label>' +
        '<p class="nota" style="margin:4px 0 0">Ao salvar, o portal abre o certificado com a senha: se a senha não abrir, nada é gravado. A validade e o titular são lidos do próprio certificado.</p>' +
        (u.temPfx || u.temSenha ? '<label class="ck"><input type="checkbox" id="cfApCert"> Apagar o certificado e a senha guardados</label>' : '') + '</fieldset>' +
      '<label>Observação interna<input id="cfObs" type="text" value="' + esc(u.obs) + '" maxlength="1000" placeholder="ex.: renovar com a contabilidade, certificado na AC Soluti"></label>' +
      (u.por ? '<p class="nota">Última alteração: ' + esc(u.por) + ' em ' + new Date(u.em).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) + '</p>' : '') +
      '<p class="erro" id="cfErro" role="alert"></p>' +
      '<div class="ferr"><button class="btn" type="submit" id="cfSalvar"' + (CF.ativo ? '' : ' disabled title="Falta ativar o cofre"') + '>Salvar</button><button class="btn sec" type="button" id="cfFechar">Fechar</button></div></form>';
    d.showModal();
    $('cfFechar').onclick = function () { d.close(); };
    $('fCf').onsubmit = function (ev) {
      ev.preventDefault();
      var err = $('cfErro'); err.textContent = '';
      var dados = { cscId: $('cfCscId').value.trim(), obs: $('cfObs').value };
      if ($('cfCsc').value.trim()) dados.csc = $('cfCsc').value.trim();
      if ($('cfSenha').value) dados.senha = $('cfSenha').value;
      if ($('cfApCsc') && $('cfApCsc').checked) dados.apagarCsc = true;
      if ($('cfApCert') && $('cfApCert').checked) dados.apagarCert = true;
      var f = $('cfPfx').files[0];
      var enviar = function () {
        $('cfSalvar').disabled = true; $('cfSalvar').textContent = 'Salvando…';
        chamar('portalCofreSalvar', TOKEN, u.id, dados).then(function (r) {
          d.close(); CF = null; telaCofre();
          setTimeout(function () { aviso('Salvo' + (r.validade ? ' · certificado válido até ' + new Date(r.validade).toLocaleDateString('pt-BR') : '') + '.'); }, 600);
        }).catch(function (e) { err.textContent = e.message; $('cfSalvar').disabled = false; $('cfSalvar').textContent = 'Salvar'; });
      };
      if (!f) return enviar();
      if (f.size > 64 * 1024) { err.textContent = 'Arquivo grande demais para um certificado A1.'; return; }
      if (!dados.senha && !u.temSenha) { err.textContent = 'Informe a senha do certificado.'; return; }
      var rd = new FileReader();
      rd.onload = function () { dados.pfx = String(rd.result).split(',')[1] || ''; dados.arquivo = f.name; enviar(); };
      rd.onerror = function () { err.textContent = 'Não consegui ler o arquivo.'; };
      rd.readAsDataURL(f);
    };
  }
  // aviso na Central: certificados vencidos ou vencendo
  window.avisoCofre = function () {
    if (!ehCpusis()) return;
    chamar('portalCofreAvisos', TOKEN).then(function (r) {
      if (!(r.vencidos || r.vencendo) || !$('cKpis') || $('cfCentral')) return;
      var t = [r.vencidos ? r.vencidos + (r.vencidos === 1 ? ' certificado vencido' : ' certificados vencidos') : '', r.vencendo ? r.vencendo + (r.vencendo === 1 ? ' vence' : ' vencem') + ' nos próximos 30 dias' : ''].filter(Boolean).join(' e ');
      $('cKpis').insertAdjacentHTML('beforebegin', '<div class="card" id="cfCentral" style="border-left:4px solid var(--' + (r.vencidos ? 'bad' : 'warn') + ');display:flex;gap:12px;align-items:center;justify-content:space-between"><span><b>Certificados digitais:</b> ' + esc(t) + '.</span><button class="btn sec" type="button" id="cfIr">Abrir o cofre</button></div>');
      $('cfIr').onclick = function () { CF_FILTRO = 'venc'; telaCofre(); };
    }).catch(function () {});
  };
})();
</script>
<script>if (typeof USA_BANCO !== 'undefined' && !USA_BANCO) document.body.insertAdjacentHTML('beforeend', '<div style="position:fixed;left:12px;bottom:12px;z-index:50;background:#8a5a00;color:#fff;font:600 12px/1 system-ui,sans-serif;padding:7px 10px;border-radius:8px;opacity:.9">Caminho antigo (reserva)</div>');</script>
</body>

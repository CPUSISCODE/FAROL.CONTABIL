#mr .mr-rod{font-size:12.5px;color:#6b7c92;margin-top:auto;padding-top:6px}
#mr .mr-st{grid-template-columns:repeat(4,minmax(0,1fr))}
#mr .mr-cli{all:unset;box-sizing:border-box;cursor:pointer;background:#111b2e;border:1px solid #1c2a42;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
#mr .mr-cli:hover{border-color:#2dd4bf}
#mr .mr-lista{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
#mr .mr-hoje{display:grid;gap:8px}
#mr .mr-hoje .mr-cli{flex-direction:row;align-items:center;justify-content:space-between;gap:14px}
#mr .mr-nota{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
#mr .mr-filtro{display:flex;gap:6px;flex-wrap:wrap}
#mr .mr-filtro .mr-b[aria-pressed="true"]{border-color:#2dd4bf;background:#0f2a26;color:#e6fff8}
#mr .mr-carr{display:flex;align-items:center;gap:12px;color:#93a4b8;padding:40px 0;justify-content:center}
#mr .mr-carr i{width:18px;height:18px;border-radius:50%;border:2px solid #2dd4bf;border-right-color:transparent;animation:mrg 1s linear infinite}
@keyframes mrg{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#mr .mr-carr i{animation:none}}
@media (max-width:1100px){#mr .mr-main{grid-template-columns:1fr}#mr .mr-k4,#mr .mr-4,#mr .mr-st{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){#mr .mr-3{grid-template-columns:1fr}}
@media (max-width:620px){#mr .mr-4{grid-template-columns:1fr}}
@media (max-width:520px){#mr .mr-k4,#mr .mr-st{grid-template-columns:1fr}}
@media (min-width:1900px){#mr{font-size:18px}#mr .mr-n,#mr ul.mr-it{font-size:16px}}
</style>
<script>
(function () {
  var URL_MR = API_BANCO.replace(/\/farol$/, '/reuniao');
  var MR = null;   // { u, mes, dados } ou { carteira:true, ... }
  var DIAS = ['', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
  var MESC = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  function mc(m) { return MESC[+m.slice(5, 7) - 1]; }
  function din(v) {   // R$ curto para telão
    v = Number(v || 0); var a = Math.abs(v);
    if (a >= 1e6) return 'R$ ' + (v / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + ' mi';
    if (a >= 1e4) return 'R$ ' + (v / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil';
    return 'R$ ' + brl(v);
  }
  function delta(a, b) {
    if (!b) return '';
    var p = 100 * (a - b) / Math.abs(b);
    return '<span class="mr-d ' + (p >= 0 ? 'up' : 'dn') + '">' + (p >= 0 ? '▲ ' : '▼ ') + Math.abs(p).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%</span>';
  }
  function api(corpo) {
    corpo.token = TOKEN;
    return fetch(URL_MR, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(corpo) })
      .then(function (r) { if (!r.ok) throw new Error('Servidor respondeu ' + r.status + '. Tente de novo.'); return r.json(); })
      .catch(function (e) { throw new Error(/Failed to fetch|NetworkError|Load failed/i.test(e.message) ? 'Sem conexão com o servidor. Confira a internet e tente de novo.' : e.message); })
      .then(function (j) { if (j.ok) return j.r; if (/SESSAO_EXPIRADA/.test(j.erro)) { fechar(); sair(true); } throw new Error(j.erro); });
  }
  function casca(html) {
    var el = document.getElementById('mr');
    if (!el) {
      el = document.createElement('div'); el.id = 'mr'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Modo Reunião');
      document.body.appendChild(el); document.documentElement.style.overflow = 'hidden';
      document.addEventListener('keydown', tecla);
    }
    el.innerHTML = '<div class="mr-in">' + html + '</div>';
    return el;
  }
  function tecla(ev) { if (ev.key === 'Escape' && !document.fullscreenElement) fechar(); }
  function fechar() {
    var el = document.getElementById('mr'); if (el) el.remove();
    document.documentElement.style.overflow = ''; document.removeEventListener('keydown', tecla);
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {});
    MR = null;
  }
  function telaCheia() {
    var el = document.getElementById('mr'); if (!el) return;
    if (document.fullscreenElement) document.exitFullscreen(); else if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
  }
  var ICO_CHEIA = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  function topo(titulo, sub, extra) {
    return '<header class="mr-top"><div class="mr-id"><div class="mr-selo">FC</div><div style="min-width:0"><h1>' + titulo + '</h1><div class="mr-sub">' + sub + '</div></div></div>' +
      '<div class="mr-acoes">' + (extra || '') + '<button type="button" class="mr-b" id="mrCheia" aria-label="Tela cheia" title="Tela cheia">' + ICO_CHEIA + '</button>' +
      '<button type="button" class="mr-b" id="mrFechar">Fechar ✕</button></div></header>';
  }
  function ligarTopo() { document.getElementById('mrFechar').onclick = fechar; document.getElementById('mrCheia').onclick = telaCheia; }

  /* ---------- termômetro ---------- */
  var ST_PILL = { ok: 'p-ok', atencao: 'p-at', risco: 'p-ri', poucos: 'p-in', compras: 'p-in' };
  function termoHtml(t, grande) {
    var pill = '<span class="mr-pill ' + ST_PILL[t.st] + '">' + esc(t.txt) + '</span>';
    var margem = Math.round(t.margem * 100);
    if (t.st === 'poucos' || t.st === 'compras') {
      return pill + '<div class="mr-n">' + (t.st === 'compras'
        ? 'As vendas aparecem muito acima das compras porque parte das notas de entrada ainda não chegou ao portal. Importe os XML de compra no sistema para o termômetro ficar confiável.'
        : 'O termômetro compara até 12 meses. Com menos de 6 meses de notas no portal, a conta ainda não é segura.') + '</div>' +
        '<div class="mr-n">Saídas: <b style="color:#e6edf5">' + din(t.saidas) + '</b> · Entradas: <b style="color:#e6edf5">' + din(t.entradas) + '</b></div>';
    }
    var pos = Math.max(0, Math.min(100, (t.pct - 50)));   // escala 50% a 150%
    return '<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap"><div class="mr-v">' + t.pct + '%</div>' + pill + '</div>' +
      '<div class="mr-ter" role="img" aria-label="Vendas em ' + t.pct + '% do mínimo esperado"><b style="left:calc(' + pos + '% - 2px)"></b></div>' +
      '<div class="mr-ter-esc"><span style="left:0">50%</span><span style="left:35%">85%</span><span style="left:50%">100% = mínimo</span><span style="left:100%">150%</span></div>' +
      '<div class="mr-n">Compras de revenda: <b style="color:#e6edf5">' + din(t.entradas) + '</b> · mínimo esperado (+' + margem + '%): <b style="color:#e6edf5">' + din(t.esperado) + '</b> · vendas: <b style="color:#e6edf5">' + din(t.saidas) + '</b>' +
      (t.diferenca < 0 ? ' · <span class="bad">faltam ' + din(-t.diferenca) + '</span>' : '') + '</div>' +
      (grande ? '<div class="mr-n" style="font-size:12.5px">Período: ' + t.meses + ' meses. Transferências entre matriz e filial entram nas duas pontas. Estimativa pelos XML do portal.</div>' : '');
  }

  /* ---------- gráfico 12 meses (barras vendas x compras) ---------- */
  function grafico(serie) {
    if (!serie.length) return '<div class="mr-n">Sem meses para mostrar.</div>';
    var W = 900, H = 300, pe = 60, pb = 30, pt = 14, max = 0;
    serie.forEach(function (s) { max = Math.max(max, s.vendas, s.compras); });
    if (!max) max = 1;
    var passo = Math.pow(10, Math.floor(Math.log10(max))), topoV = Math.ceil(max / passo) * passo;
    var gw = (W - pe) / serie.length, bw = Math.min(26, gw * 0.32), y = function (v) { return pt + (H - pt - pb) * (1 - v / topoV); };
    var o = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Vendas e compras nos últimos ' + serie.length + ' meses">';
    for (var i = 0; i <= 4; i++) { var v = topoV * i / 4, yy = y(v); o += '<line x1="' + pe + '" x2="' + W + '" y1="' + yy + '" y2="' + yy + '" stroke="#1c2a42"/><text x="' + (pe - 8) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="12" fill="#7d8ea3">' + esc(din(v).replace('R$ ', '')) + '</text>'; }
    serie.forEach(function (s, k) {
      var x = pe + gw * k + gw / 2;
      o += '<rect x="' + (x - bw - 2) + '" y="' + y(s.vendas) + '" width="' + bw + '" height="' + Math.max(0, H - pb - y(s.vendas)) + '" rx="4" fill="#2dd4bf"><title>' + mc(s.mes) + ': vendas ' + din(s.vendas) + '</title></rect>';
      o += '<rect x="' + (x + 2) + '" y="' + y(s.compras) + '" width="' + bw + '" height="' + Math.max(0, H - pb - y(s.compras)) + '" rx="4" fill="#64748b"><title>' + mc(s.mes) + ': compras ' + din(s.compras) + '</title></rect>';
      o += '<text x="' + x + '" y="' + (H - 9) + '" text-anchor="middle" font-size="12.5" fill="#93a4b8">' + mc(s.mes) + '</text>';
    });
    return o + '</svg>';
  }
  function anel(nota) {
    var r = 46, c = 2 * Math.PI * r, cor = nota >= 75 ? '#2dd4bf' : nota >= 55 ? '#fbbf24' : '#f87171';
    return '<svg viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Nota ' + nota + ' de 100" style="flex:none"><circle cx="60" cy="60" r="' + r + '" fill="none" stroke="#1a2740" stroke-width="12"/>' +
      '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="' + cor + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (c * nota / 100) + ' ' + c + '" transform="rotate(-90 60 60)"/>' +
      '<text x="60" y="68" text-anchor="middle" font-size="30" font-weight="600" fill="#e6edf5">' + nota + '</text></svg>';
  }
  function barras(obj, rotulos) {
    var ks = Object.keys(obj || {}), tot = 0, max = 0;
    ks.forEach(function (k) { tot += obj[k]; max = Math.max(max, obj[k]); });
    if (!tot) return '<div class="mr-n">Sem dados neste mês.</div>';
    if (rotulos) ks.sort(function (a, b) { return a - b; }); else ks.sort(function (a, b) { return obj[b] - obj[a]; });
    return ks.slice(0, 7).map(function (k) {
      return '<div class="mr-bar"><span>' + esc(rotulos ? rotulos[k] : k) + '</span><span class="t"><i style="width:' + (100 * obj[k] / max) + '%"></i></span><span class="mu" style="text-align:right">' + Math.round(100 * obj[k] / tot) + '%</span></div>';
    }).join('');
  }

  /* ---------- receita bruta acumulada dos últimos 12 meses ---------- */
  function linha(serie, campo, cor) {
    var n = serie.length, max = 0; serie.forEach(function (s) { max = Math.max(max, s.vendas, s.compras); });
    if (n < 2 || !max) return '';
    return '<polyline points="' + serie.map(function (s, i) { return (200 * i / (n - 1)).toFixed(1) + ',' + (33 - 30 * s[campo] / max).toFixed(1); }).join(' ') + '" fill="none" stroke="' + cor + '" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>';
  }
  function rbt12(serie, t) {
    var n = serie.length, ini = n ? serie[0].mes : '', fim = n ? serie[n - 1].mes : '';
    var per = n ? mc(ini) + '/' + ini.slice(2, 4) + ' a ' + mc(fim) + '/' + fim.slice(2, 4) : '';
    var ven = t.saidas, com = t.entradas, sv = 0; serie.forEach(function (s) { sv += s.vendas; });
    var sp = n > 1 ? '<svg viewBox="0 0 200 36" width="100%" height="26" preserveAspectRatio="none" aria-hidden="true">' + linha(serie, 'compras', '#64748b') + linha(serie, 'vendas', '#2dd4bf') + '</svg>' : '';
    var vl = function (rot, v, cor) { return '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><span class="mr-n"><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:' + cor + ';margin-right:7px"></i>' + rot + '</span><b style="font-size:clamp(20px,1.8vw,28px);font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums">' + din(v) + '</b></div>'; };
    var margem = Math.round(t.margem * 100), rel = '';
    if (com > 0) {
      var acima = 100 * (ven - com) / com, cls = { ok: 'up', atencao: 'dn', risco: 'bad' }[t.st] || 'mu';
      var ab = Math.floor(Math.abs(acima) * 10) / 10;
      rel = '<div class="mr-d ' + cls + '">Vendas ' + ab.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '% ' + (acima >= 0 ? 'acima' : 'abaixo') + ' das compras <span class="mu" style="font-weight:500">(mínimo ' + margem + '%)</span></div>' +
        (t.st === 'compras' ? '<div class="mr-n" style="font-size:12.5px">Notas de compra ainda incompletas no portal.</div>' : t.st === 'poucos' ? '<div class="mr-n" style="font-size:12.5px">Ainda há poucos meses para concluir.</div>' : '');
    } else rel = '<div class="mr-n">Sem notas de compra no portal neste período.</div>';
    return '<div class="mr-c"><div class="mr-rot">Vendas e compras · 12 meses</div>' + vl('Vendas', ven, '#2dd4bf') + vl('Compras', com, '#64748b') + sp + rel +
      '<div class="mr-n" style="font-size:12.5px">' + (per ? per : '') + (Math.abs(ven - sv) > 1 ? ' · com transferências' : '') +
      (n && n < 12 ? ' · <span style="color:#fbbf24">só ' + n + ' ' + (n === 1 ? 'mês' : 'meses') + ' no portal</span>' : '') + '</div></div>';
  }

  /* ---------- Modo Reunião (um cliente) ---------- */
  function abrirReuniao(u, mes) {
    MR = { u: u, mes: mes || u.meses[0] };
    casca(topo(esc(rotuloUnid(u)), esc(nomeMes(MR.mes)) + ' · ' + esc(u.contabilidade)) + '<div class="mr-carr"><i></i>Montando a apresentação…</div>'); ligarTopo();
    api({ acao: 'reuniao', contabilidade: u.contabilidade, cliente: u.cliente, subpasta: u.subpasta, mes: MR.mes })
      .then(function (d) { if (MR && MR.u === u) { MR.dados = d; desenharReuniao(); } })
      .catch(function (e) { casca(topo(esc(rotuloUnid(u)), '') + '<div class="mr-c"><b>Não deu para abrir o Modo Reunião.</b><span class="mr-n">' + esc(e.message) + '</span></div>'); ligarTopo(); });
  }
  function desenharReuniao() {
    var d = MR.dados, u = MR.u, a = d.atual || { vendas: 0, compras: 0, impostos: 0, qtd: 0, ticket: 0 }, an = d.anterior;
    var reg = { SN: 'Simples Nacional', MEI: 'MEI', NORMAL: 'Regime normal', REAL: 'Lucro Real', PRESUMIDO: 'Lucro Presumido' }[d.regime] || d.regime || '';
    var sel = '<label class="mr-sub" style="display:flex;align-items:center;gap:8px">Mês <select id="mrMes">' + u.meses.map(function (m) { return '<option value="' + m + '"' + (m === MR.mes ? ' selected' : '') + '>' + nomeMes(m) + '</option>'; }).join('') + '</select></label>';
    var cargaImp = a.vendas ? 100 * a.impostos / a.vendas : 0, cargaAnt = an && an.vendas ? 100 * an.impostos / an.vendas : null;
    var s = d.saude, t = d.termometro;
    var html = topo(esc(rotuloUnid(u)), esc(nomeMes(MR.mes)) + ' · ' + esc(u.contabilidade) + (reg ? ' · ' + esc(reg) : ''), sel) +
      '<section class="mr-g mr-k4" aria-label="Números do mês">' +
        '<div class="mr-c"><div class="mr-rot">Faturamento</div><div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap"><div class="mr-v">' + din(a.vendas) + '</div>' + (an ? delta(a.vendas, an.vendas) : '') + '</div><div class="mr-n">Vendas menos devoluções' + (an ? ' · mês anterior ' + din(an.vendas) : '') + '</div></div>' +
        '<div class="mr-c"><div class="mr-rot">Ticket médio</div><div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap"><div class="mr-v">' + din(a.ticket) + '</div></div><div class="mr-n">' + int(a.qtd) + ' notas e cupons no mês</div></div>' +
        '<div class="mr-c"><div class="mr-rot">Imposto destacado nas vendas</div><div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap"><div class="mr-v">' + cargaImp.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%</div>' +
          (cargaAnt != null ? '<span class="mr-d ' + (cargaImp <= cargaAnt ? 'up' : 'dn') + '">' + (cargaImp <= cargaAnt ? '▼ ' : '▲ ') + Math.abs(cargaImp - cargaAnt).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' p.p.</span>' : '') + '</div><div class="mr-n">' + din(a.impostos) + ' de ICMS, ST, PIS, COFINS e IPI nas notas</div></div>' +
        rbt12(d.serie, d.termometro) +
      '</section>' +
      '<section class="mr-g mr-main">' +
        '<div class="mr-c"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div class="mr-rot">Vendas x compras · ' + d.serie.length + ' meses</div><div class="mr-leg"><span><i style="background:#2dd4bf"></i>Vendas</span><span><i style="background:#64748b"></i>Compras</span></div></div>' + grafico(d.serie) + '</div>' +
        '<div class="mr-g" style="grid-template-rows:auto 1fr">' +
          '<div class="mr-c"><div class="mr-rot">Saúde fiscal</div><div style="display:flex;gap:18px;align-items:center">' + anel(s.nota) + '<div style="display:grid;gap:8px;min-width:0"><b style="font-size:18px">' + esc(s.rotulo) + '</b><ul class="mr-it">' + s.itens.map(function (i) { return '<li' + (i.ok ? '' : ' class="x"') + '>' + esc(i.txt) + '</li>'; }).join('') + '</ul></div></div></div>' +
          '<div class="mr-c"><div class="mr-rot">Termômetro fiscal · vendas x compras</div>' + termoHtml(t, true) + '</div>' +
        '</div>' +
      '</section>' +
      '<section class="mr-g mr-4">' +
        '<div class="mr-c"><div class="mr-rot">Compras de revenda</div><div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap"><div class="mr-v">' + din(a.compras) + '</div>' + (an ? delta(a.compras, an.compras).replace(/mr-d (up|dn)/, 'mr-d mu') : '') + '</div><div class="mr-n">Notas de entrada no portal</div></div>' +
        '<div class="mr-c"><div class="mr-rot">Como o cliente paga</div>' + barras(a.pagamentos) + '</div>' +
        '<div class="mr-c"><div class="mr-rot">Vendas por dia da semana</div>' + barras(a.semana, DIAS) + '</div>' +
        (d.simples ? '<div class="mr-c"><div class="mr-rot">Limite do ' + (d.regime === 'MEI' ? 'MEI' : 'Simples Nacional') + '</div><div class="mr-v">' + d.simples.pct + '%</div>' +
          '<div class="mr-bar" style="grid-template-columns:1fr"><span class="t"><i style="width:' + Math.min(100, d.simples.pct) + '%;background:' + (d.simples.pct >= 80 ? '#fbbf24' : '#2dd4bf') + '"></i></span></div>' +
          '<div class="mr-n">' + din(d.simples.receita) + ' em ' + d.simples.meses + ' meses de um limite de ' + din(d.simples.limite) + ' por ano.</div></div>'
        : d.bpo ? '<div class="mr-c"><div class="mr-rot">Saldo em conta (BPO)</div><div class="mr-v">' + din(d.bpo.saldo) + '</div><div class="mr-n">Conforme o último extrato importado.</div></div>'
        : '<div class="mr-c"><div class="mr-rot">Notas no mês</div><div class="mr-v">' + int(a.qtd) + '</div><div class="mr-n">NF-e e NFC-e autorizadas com XML no portal.</div></div>') +
      '</section>' +
      '<div class="mr-rod">Farol Contábil · números calculados a partir dos XML enviados ao portal. O termômetro é uma estimativa e não substitui a análise da contabilidade.</div>';
    casca(html); ligarTopo();
    document.getElementById('mrMes').onchange = function () { abrirReuniao(u, this.value); };
  }

  /* ---------- Visão da carteira ---------- */
  var FILTROS = [['todos', 'Todos'], ['risco', 'Risco'], ['atencao', 'Atenção'], ['ok', 'Em dia'], ['sem', 'Dados insuficientes']];
  function grupo(c) { var st = c.termometro.st; return st === 'risco' || c.saude.nota < 55 ? 'risco' : st === 'atencao' || c.saude.nota < 75 ? 'atencao' : (st === 'poucos' || st === 'compras') ? 'sem' : 'ok'; }
  function abrirCarteira(mes, contab) {
    MR = { carteira: true, mes: mes, contab: contab || '', filtro: 'todos' };
    casca(topo('Carteira de clientes', esc(nomeMes(mes))) + '<div class="mr-carr"><i></i>Calculando a carteira…</div>'); ligarTopo();
    api({ acao: 'carteira', mes: mes, contabilidade: contab || '' })
      .then(function (d) { if (MR && MR.carteira && MR.mes === mes) { MR.dados = d; desenharCarteira(); } })
      .catch(function (e) { casca(topo('Carteira de clientes', '') + '<div class="mr-c"><b>Não deu para abrir a carteira.</b><span class="mr-n">' + esc(e.message) + '</span></div>'); ligarTopo(); });
  }
  function rotC(c) { return c.cliente + (c.subpasta ? ' · ' + c.subpasta : ''); }
  function desenharCarteira() {
    var cs = MR.dados.clientes.slice(), cont = { risco: 0, atencao: 0, ok: 0, sem: 0 };

    var u = ATUAL.u;
    var txt = 'Prezados, ' + f.nome + ',\n\n' +
      'Na conferência das notas fiscais que recebemos de vocês em ' + nomeMes(ATUAL.mes) + ', o grupo IBS/CBS (Reforma Tributária, NT 2025.002) veio diferente do cálculo oficial da Receita Federal:\n\n' +
      ORD.filter(function (k) { return tipos[k]; }).map(function (k) { return '• ' + PROB[k][0] + ': ' + PROB[k][1]; }).join('\n') + '\n\n' +
      'Notas: ' + (function () { var vis = {}, l = []; dele.forEach(function (n) { var k = 'nº ' + n.numero + ' de ' + dataBR(n.data); if (!vis[k]) { vis[k] = 1; l.push(k); } }); return l.slice(0, 15).join(', ') + (l.length > 15 ? ' e outras ' + (l.length - 15) : ''); })() + '.\n\n' +
      'Pedimos que verifiquem a configuração fiscal do emissor de vocês para as próximas notas. A partir de 2027 o crédito de CBS depende do valor destacado corretamente.\n\n' +
      'Atenciosamente,\n' + (u.cliente || '');
    $('cfMsg').innerHTML = '<div style="margin-top:12px"><textarea class="cf-msg" id="cfTxt" aria-label="Mensagem para o fornecedor">' + esc(txt) + '</textarea><div class="ferr" style="margin-top:8px"><button class="btn" type="button" id="cfCopiar">Copiar mensagem</button><span class="sub" id="cfOk"></span></div></div>';
    $('cfCopiar').onclick = function () { var t = $('cfTxt'); t.select(); try { navigator.clipboard.writeText(t.value).then(function () { $('cfOk').textContent = 'Copiada.'; }); } catch (e) { document.execCommand('copy'); $('cfOk').textContent = 'Copiada.'; } };
  }
})();
</script>
<!-- ================= APURAÇÃO FISCAL (estimativa: Simples Nacional e Lucro Presumido, comércio) ================= -->
<style>
.apu{width:100%;min-width:0;border-collapse:collapse;font-size:14px;table-layout:fixed}
.apu td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:top;white-space:normal;overflow-wrap:anywhere}
.apu td:last-child{width:9.5em}
.apu td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.apu td .s{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.apu tr.tot td{border-bottom:0;border-top:2px solid var(--ink);font-weight:700;font-size:15px}
.apu tr.sub td{color:var(--muted)}
.apu-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px}
.apu-g>.card{min-width:0}
.apu-rbt{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:10px}
.apu-rbt label{display:grid;gap:4px;font-size:13px;font-weight:600}
.apu-rbt input{height:40px;padding:0 10px;border:1px solid var(--line);border-radius:8px;font:inherit;width:190px;max-width:100%}
.apu-chk{display:flex;gap:8px;align-items:center;font-size:13.5px;margin:6px 0 2px;cursor:pointer}
</style>
<script>
(function () {
  var URL_AP = API_BANCO.replace(/\/farol$/, '/reuniao');
  var AP = null;   // cache { ck, mes, rbt, r }
  var NOME_R = { SN: 'Simples Nacional', MEI: 'MEI', PRESUMIDO: 'Lucro Presumido', REAL: 'Lucro Real', NORMAL: 'Regime normal (Presumido ou Real)' };
  function R$(v) { return 'R$ ' + brl(v); }
  function pc(v, d) { return (100 * v).toLocaleString('pt-BR', { minimumFractionDigits: d == null ? 2 : d, maximumFractionDigits: d == null ? 2 : d }) + '%'; }
  function linha(rot, v, sub, cls) { return '<tr' + (cls ? ' class="' + cls + '"' : '') + '><td>' + rot + (sub ? '<span class="s">' + sub + '</span>' : '') + '</td><td class="n">' + v + '</td></tr>'; }
  function chave() { var u = ATUAL.u; return 'farol_rbt12_' + chaveUnid(u.contabilidade, rotuloPainel(u)) + '_' + ATUAL.mes; }
  function rbtSalva() { try { var v = localStorage.getItem(chave()); return v ? Number(v) : null; } catch (e) { return null; } }
  function chamar(rbt) {
    var u = ATUAL.u;
    return fetch(URL_AP, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ acao: 'apuracao', token: TOKEN, contabilidade: u.contabilidade, cliente: u.cliente, subpasta: u.subpasta, mes: ATUAL.mes, rbt12: rbt }) })
      .then(function (r) { if (!r.ok) throw new Error('Servidor respondeu ' + r.status + '. Tente de novo.'); return r.json(); })
      .catch(function (e) { throw new Error(/Failed to fetch|NetworkError|Load failed/i.test(e.message) ? 'Sem conexão com o servidor. Confira a internet e tente de novo.' : e.message); })
      .then(function (j) { if (j.ok) return j.r; if (/SESSAO_EXPIRADA/.test(j.erro)) sair(true); throw new Error(j.erro); });
  }
  window.telaApuracao = function (c) {
    if (!USA_BANCO) { c.innerHTML = '<div class="card"><p class="nota">A apuração fiscal usa o banco de dados do portal. Abra o portal pelo link oficial, sem o "?banco=0" no final.</p></div>'; return; }
    var ck = chave(), rbt = rbtSalva();
    if (AP && AP.ck === ck && AP.rbt === rbt) { desenhar(c, AP.r); return; }
    c.innerHTML = '<div class="card"><p class="nota">Calculando a apuração de ' + esc(nomeMes(ATUAL.mes)) + '…</p></div>';
    chamar(rbt).then(function (r) { AP = { ck: ck, rbt: rbt, r: r }; if (ATUAL && ATUAL.aba === 'apur' && chave() === ck) desenhar($('conteudo'), r); })
      .catch(function (e) { if (ATUAL && ATUAL.aba === 'apur') c.innerHTML = '<div class="card"><p class="aviso bad">Não deu para calcular a apuração.</p><p class="nota">' + esc(e.message) + '</p><div class="ferr"><button class="btn sec" type="button" id="apTenta">Tentar de novo</button></div></div>'; if ($('apTenta')) $('apTenta').onclick = function () { telaApuracao(c); }; });
  };
  var AVISO = '<p class="nota" style="margin:0">Estimativa feita com os XML de venda e de compra que estão no portal, para empresa de <b>comércio</b>. Serve para conferir e conversar com o cliente; os valores oficiais saem da apuração da contabilidade (PGDAS-D, EFD, DCTFWeb).</p>';

  function desenhar(c, r) {
    var cab = '<div class="card"><p class="aviso' + (r.regime === 'NORMAL' ? ' warn' : '') + '" style="margin:0 0 6px"><b>' + esc(NOME_R[r.regime] || 'Regime não identificado') + '</b>' +
      (r.regime === 'NORMAL' ? ': o portal não conseguiu confirmar se é Presumido ou Real. A apuração abaixo considera Lucro Presumido; se não for, ajuste em Configurações › Regimes.' : '') + '</p>' + AVISO + '</div>';
    if (r.simples) c.innerHTML = cab + telaSimples(r, r.simples);
    else if (r.presumido) c.innerHTML = cab + telaPresumido(r, r.presumido);
    else if (r.real) c.innerHTML = cab + '<div class="apu-g">' + cartaoIcms(r.real.icms) + '<div class="card"><h2>PIS, COFINS, IRPJ e CSLL</h2><p class="nota">No Lucro Real o PIS e a COFINS são não cumulativos e o IRPJ e a CSLL dependem do lucro contábil, que não aparece nos XML. Por isso o portal mostra só o ICMS.</p></div></div>';
    else if (r.regime === 'MEI') c.innerHTML = cab + '<div class="card"><h2>MEI</h2><p class="nota">O MEI paga um valor fixo por mês no DAS-MEI, que não depende do faturamento. O que importa acompanhar é o limite anual de faturamento, mostrado no Painel.</p></div>';
    else c.innerHTML = cab + '<div class="card"><p class="nota">Não foi possível identificar o regime deste cliente. Informe o regime em Configurações › Regimes.</p></div>';
    ligar(c);
  }

  /* ---------- Simples Nacional ---------- */
  function telaSimples(r, s) {
    var fonte = {
      portal: 'Soma dos 12 meses anteriores com notas no portal.',
      informada: 'Valor informado por você (RBT12 do PGDAS-D).',
      estimada: 'O portal tem só ' + s.mesesPortal + ' dos 12 meses anteriores (soma de ' + R$(s.somaPortal) + '). Para não subestimar a faixa, a RBT12 foi estimada pela média desses meses × 12. Informe a RBT12 do PGDAS-D para o valor exato.',
      inicio: 'Não há meses anteriores no portal: a RBT12 foi estimada como a receita deste mês × 12. Informe a RBT12 do PGDAS-D para o valor exato.'
    }[s.rbtFonte];
    var corFonte = s.rbtFonte === 'portal' || s.rbtFonte === 'informada' ? '' : 'warn';
    var nomes = { irpj: 'IRPJ', csll: 'CSLL', cofins: 'COFINS', pis: 'PIS/Pasep', cpp: 'CPP (INSS patronal)', icms: 'ICMS' };
    return '<div class="kpis kpis4">' +
      kpi2('Faixa do Simples (Anexo I)', s.faixa + 'ª faixa', 'RBT12 de ' + R$(s.faixaDe) + ' até ' + R$(s.faixaAte)) +
      kpi2('Alíquota efetiva do mês', pc(s.efetiva), 'nominal ' + pc(s.nominal, 1) + (s.deduzir ? ' · dedução de ' + R$(s.deduzir) : '')) +
      kpi2('Receita bruta do mês', R$(s.receita), r.devolucoes ? 'já sem ' + R$(r.devolucoes) + ' de devoluções' : 'vendas com XML no portal') +
      kpi2('DAS estimado do mês', R$(s.das), 'vence dia 20 do mês seguinte', null, 'brand') + '</div>' +
      (s.excedeu ? '<div class="card"><p class="aviso bad">A receita dos últimos 12 meses passou de R$ 4,8 milhões, o limite do Simples Nacional. A empresa precisa ser desenquadrada: fale com o contador.</p></div>'
        : s.sublimite ? '<div class="card"><p class="aviso warn">A receita dos últimos 12 meses passou do sublimite de R$ 3,6 milhões: o ICMS deixa de ser pago no DAS e passa a ser apurado como no regime normal.</p></div>' : '') +
      '<div class="apu-g">' +
        '<section class="card"><h2>Como chegamos no DAS</h2><table class="apu">' +
          linha('Receita bruta do mês', R$(s.receita), 'vendas e exportações, menos devoluções; transferências não entram') +
          linha('× alíquota efetiva', pc(s.efetiva), '(RBT12 × ' + pc(s.nominal, 1) + ' − ' + R$(s.deduzir) + ') ÷ RBT12') +
          linha('= Valor antes das segregações', R$(s.receita * s.efetiva), '', 'sub') +
          (s.mono ? linha('− PIS e COFINS dos monofásicos', '− ' + R$(s.descMono), R$(s.mono) + ' em vendas com CST de PIS 04 (já tributados na indústria)') : '') +
          (s.st ? linha('− ICMS das vendas com substituição tributária', '− ' + R$(s.descSt), R$(s.st) + ' em vendas com CSOSN 500 ou CST 60 (ICMS já pago antes)') : '') +
          linha('DAS estimado', R$(s.das), '', 'tot') + '</table>' +
          (!s.mono && !s.st ? '<p class="nota">Nenhuma venda com monofásico (CST 04) ou com ICMS-ST neste mês: o DAS é a receita × a alíquota efetiva.</p>' : '<p class="nota">Essas receitas precisam ser informadas separadas no PGDAS-D, senão o cliente paga o imposto duas vezes.</p>') + '</section>' +
        '<section class="card"><h2>Receita dos últimos 12 meses (RBT12)</h2><div class="kpi kpi2" style="border:0;padding:0;box-shadow:none"><span class="v">' + R$(s.rbt12) + '</span></div>' +
          '<p class="aviso ' + corFonte + '" style="font-weight:500">' + esc(fonte) + '</p>' +
          '<div class="apu-rbt"><label>RBT12 do PGDAS-D<input id="apRbt" inputmode="decimal" placeholder="ex.: 1.250.000,00" value="' + (s.rbtFonte === 'informada' ? brl(s.rbt12) : '') + '"></label>' +
          '<button class="btn" type="button" id="apRbtOk">Recalcular</button>' + (s.rbtFonte === 'informada' ? '<button class="btn sec" type="button" id="apRbtLimpa">Usar o valor do portal</button>' : '') + '</div>' +
          '<p class="nota">O valor informado fica guardado neste computador para este cliente e este mês. A partir de janeiro de 2027 o portal já terá os 12 meses e a conta fica automática.</p></section>' +
        '<section class="card"><h2>Quanto vai para cada tributo</h2><table class="apu">' +
          Object.keys(nomes).filter(function (k) { return s.partes[k] > 0; }).map(function (k) { return linha(nomes[k], R$(s.partes[k])); }).join('') +
          linha('Total do DAS', R$(s.das), '', 'tot') + '</table><p class="nota">Repartição da ' + s.faixa + 'ª faixa do Anexo I da LC 123/2006.</p></section>' +
      '</div>';
  }

  /* ---------- Lucro Presumido ---------- */
  function cartaoIcms(i) {
    var semCompras = RESUMO && RESUMO.totais && RESUMO.totais.Compras && !RESUMO.totais.Compras.qtd;
    return '<section class="card"><h2>ICMS do mês</h2><table class="apu">' +
      linha('Débitos: ICMS destacado nas saídas', R$(i.debitos), 'NF-e e NFC-e emitidas') +
      linha('− Créditos: ICMS das entradas', '− ' + R$(i.creditos), 'notas de compra e devoluções recebidas') +
      (i.credorAnterior ? linha('− Saldo credor dos meses anteriores', '− ' + R$(i.credorAnterior), 'acumulado pelo portal desde ' + nomeMes(i.desde)) : '') +
      (i.aPagar ? linha('ICMS a pagar', R$(i.aPagar), '', 'tot') : linha('Sem ICMS a pagar', R$(0), 'saldo credor de ' + R$(i.credorProximo) + ' passa para o próximo mês', 'tot')) + '</table>' +
      (semCompras ? '<p class="aviso warn">Não há notas de compra no portal neste mês: os créditos podem estar faltando e o ICMS a pagar ficar maior do que o real.</p>' : '') +
      '<p class="nota">Os créditos somam todo o ICMS destacado nas compras: tire o que for de uso e consumo ou ativo, que não dá crédito. Não entram o ICMS-ST, a antecipação e o diferencial de alíquota pagos em guia própria. Confira o saldo credor com a EFD ICMS/IPI.</p></section>';
  }
  function telaPresumido(r, p) {
    var x = p.pc, i = p.icms, ir = p.ir, excl = !(window.localStorage && localStorage.getItem('farol_apu_sem_tema69') === '1');
    var base = excl ? x.base : x.baseSemExcl, pis = excl ? x.pis : x.pisSemExcl, cof = excl ? x.cofins : x.cofinsSemExcl;
    var mesesQ = ir.mesesTrimestre.map(function (m) { return MES[Number(m.slice(5, 7)) - 1]; }).join(', ');
    var vencTxt = MES[Number(ir.vencimento.slice(5, 7)) - 1] + ' de ' + ir.vencimento.slice(0, 4);
    return '<div class="kpis kpis4">' +
      kpi2('PIS (0,65%)', R$(pis), 'vence dia 25 do mês seguinte') +
      kpi2('COFINS (3%)', R$(cof), 'vence dia 25 do mês seguinte') +
      (i.aPagar ? kpi2('ICMS a pagar', R$(i.aPagar), 'débitos − créditos', null, 'bad') : kpi2('ICMS a pagar', R$(0), 'saldo credor de ' + R$(i.credorProximo), null, 'brand')) +
      kpi2('IRPJ + CSLL deste mês', R$(ir.irpjMes + ir.csllMes), 'parte do ' + ir.trimestre + 'º trimestre') + '</div>' +
      '<div class="apu-g">' +
        '<section class="card"><h2>PIS e COFINS (cumulativo)</h2>' +
          '<label class="apu-chk"><input type="checkbox" id="apT69"' + (excl ? ' checked' : '') + '> Excluir o ICMS da base (Tema 69 do STF)</label><table class="apu">' +
          linha('Vendas com PIS/COFINS tributado', R$(x.receitaTributada), 'itens com CST de PIS 01, 02 ou 03') +
          (x.devolucoes ? linha('− Devoluções de venda (parte tributada)', '− ' + R$(x.devolucoes)) : '') +
          (excl && x.icmsExcluido ? linha('− ICMS destacado nessas vendas', '− ' + R$(x.icmsExcluido), 'estimado na mesma proporção') : '') +
          linha('= Base de cálculo', R$(base), '', 'sub') +
          linha('PIS 0,65%', R$(pis)) + linha('COFINS 3%', R$(cof)) +
          linha('Total PIS + COFINS', R$(pis + cof), '', 'tot') + '</table>' +
          '<p class="nota">Destacado nas notas pelo sistema do cliente: PIS ' + R$(x.pisDest) + ' e COFINS ' + R$(x.cofinsDest) + '.</p>' +
          (x.parteNaoTrib > 0.6 ? '<p class="aviso warn" style="font-weight:500">' + pc(x.parteNaoTrib, 0) + ' das vendas (' + R$(x.receitaSemTributo) + ') saíram com CST de PIS de 04 a 09: monofásico, alíquota zero, isenta ou sem incidência. ' +
            (x.monofasico ? R$(x.monofasico) + ' são monofásicos (CST 04). ' : '') + 'Se algum produto estiver com o CST errado no cadastro, o PIS e a COFINS ficam menores que o devido.</p>' : '') + '</section>' +
        cartaoIcms(i) +
        '<section class="card"><h2>IRPJ e CSLL · ' + ir.trimestre + 'º trimestre</h2><table class="apu">' +
          linha('Receita do trimestre até agora', R$(ir.receitaTrimestre), mesesQ + (ir.mesesFaltando ? ' · faltam ' + ir.mesesFaltando + ' mês(es)' : ' · trimestre completo')) +
          linha('Base do IRPJ (presunção de 8%)', R$(ir.baseIrpj), ir.excedente ? 'inclui +10% na presunção sobre ' + R$(ir.excedente) + ' acima de R$ 1,25 mi (LC 224/2025)' : '') +
          linha('IRPJ 15%', R$(ir.irpjNormal)) +
          (ir.adicional ? linha('Adicional de IRPJ 10%', R$(ir.adicional), 'sobre a base que passa de R$ 20 mil por mês') : '') +
          linha('Base da CSLL (presunção de 12%)', R$(ir.baseCsll)) +
          linha('CSLL 9%', R$(ir.csllTrimestre)) +
          linha('IRPJ + CSLL do trimestre até agora', R$(ir.irpjTrimestre + ir.csllTrimestre), '', 'tot') +
          linha('Parte deste mês (' + esc(MES[Number(r.mes.slice(5, 7)) - 1]) + ')', R$(ir.irpjMes + ir.csllMes), 'IRPJ ' + R$(ir.irpjMes) + ' · CSLL ' + R$(ir.csllMes) + ', proporcional à receita do mês', 'sub') + '</table>' +
          '<p class="nota">Pagamento até o último dia útil de ' + vencTxt + ' (quota única) ou em 3 quotas.' + (ir.mesesFaltando ? ' O trimestre ainda não fechou: o valor cresce com os próximos meses.' : '') +
          ' Só entram as vendas com XML; receitas financeiras, aluguéis e serviços somam à base e não aparecem aqui.</p></section>' +
      '</div>';
  }

  function ligar(c) {
    var ok = $('apRbtOk'), limpa = $('apRbtLimpa'), t69 = $('apT69');
    if (ok) ok.onclick = function () {
      var v = Number(String($('apRbt').value).replace(/[^\d,]/g, '').replace(',', '.'));
      if (!(v > 0)) { $('apRbt').focus(); return; }
      try { localStorage.setItem(chave(), String(v)); } catch (e) {}
      AP = null; telaApuracao(c);
    };
    if ($('apRbt')) $('apRbt').onkeydown = function (ev) { if (ev.key === 'Enter') ok.click(); };
    if (limpa) limpa.onclick = function () { try { localStorage.removeItem(chave()); } catch (e) {} AP = null; telaApuracao(c); };
    if (t69) t69.onchange = function () { try { localStorage.setItem('farol_apu_sem_tema69', this.checked ? '0' : '1'); } catch (e) {} desenhar(c, AP.r); };
  }
})();
</script>
<script>if (typeof USA_BANCO !== 'undefined' && !USA_BANCO) document.body.insertAdjacentHTML('beforeend', '<div style="position:fixed;left:12px;bottom:12px;z-index:50;background:#8a5a00;color:#fff;font:600 12px/1 system-ui,sans-serif;padding:7px 10px;border-radius:8px;opacity:.9">Caminho antigo (reserva)</div>');</script>
</body>
</html>

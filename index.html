<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://cidvuirvojpsmukfxpll.supabase.co https://script.google.com https://script.googleusercontent.com; frame-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<title>Farol Contábil</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Layout: barra superior fixa com navegação; Painel geral (todas as empresas: envio, regimes, totais); Clientes (lista + download em lote); cliente/mês com indicadores, abas de análise, busca de XML e download do ZIP */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --ink:#15211c; --muted:#5a6a62; --line:#dbe2de; --soft:#eef3f0;
  --brand:#0f6b55; --brand-ink:#ffffff; --brand-soft:#e1efe9; --warn:#8a5a00; --warn-soft:#fff2d4; --bad:#b3261e; --bad-soft:#fbe8e6; --info:#1f4f86; --info-soft:#e5eef9;
  --sn:#0f6b55; --sn-soft:#e1efe9; --pre:#1f4f86; --pre-soft:#e5eef9; --real:#6a3fa0; --real-soft:#efe8f8; --mei:#8a5a00; --mei-soft:#fff2d4;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif; --mono:Consolas,"Cascadia Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1513; --panel:#171f1c; --ink:#e3ebe7; --muted:#97a69f; --line:#2a3530; --soft:#1d2723;
  --brand:#4cc29c; --brand-ink:#0b1512; --brand-soft:#1b3129; --warn:#f2c35a; --warn-soft:#382d12; --bad:#ff8a80; --bad-soft:#3a1f1c; --info:#8db8ee; --info-soft:#1c2a3b;
  --sn:#4cc29c; --sn-soft:#1b3129; --pre:#8db8ee; --pre-soft:#1c2a3b; --real:#c4a6f0; --real-soft:#2a2238; --mei:#f2c35a; --mei-soft:#382d12; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans)}
button,input,select{font:inherit;color:inherit}
.btn{border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);border-radius:7px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--brand)}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,.tab:focus-visible,th:focus-visible,.cli:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
input[type=text],input[type=password],input[type=search],input[type=date],select{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-width:0}
.hidden{display:none!important}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.caixa{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 24px;display:grid;gap:14px}
.marca{display:flex;align-items:center;gap:10px}
.selo{width:38px;height:38px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;letter-spacing:.02em;overflow:hidden;flex:none}
.selo.img{background:transparent}.selo img{width:100%;height:100%;object-fit:contain}
/* impressão / PDF: sempre com a logo da CPUSIS */
#impTopo,#impRodape{display:none}
#impTopo{align-items:center;gap:18px;padding:0 0 10px;margin:0 0 14px;border-bottom:2px solid #0b2545}
#impTopo img{height:70px;width:auto}
#impTopo b{display:block;font-size:17px;color:#0b2545}
#impTopo span{display:block;font-size:11.5px;color:#444}
@media print{
  @page{size:A4;margin:11mm 10mm 14mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{background:#fff!important}
  header,.nav,#login,.abas,.acoes,.btn,.cad-f,.barra,dialog,#rodape{display:none!important}
  #impTopo{display:flex!important}
  #impRodape{display:block!important;position:fixed;left:0;right:0;bottom:0;font-size:9.5px;color:#555;border-top:1px solid #ccc;padding-top:3px;text-align:center}
  main,#tela{max-width:none!important;padding:0!important;margin:0!important}
  .card,.kpi,section{box-shadow:none!important}
  .kpi{break-inside:avoid}
  .tbl{overflow:visible!important;max-height:none!important}
  table{font-size:9.5px;width:100%!important;min-width:0!important}
  th,td{padding:3px 4px!important}
  .kpis{grid-template-columns:repeat(4,1fr)!important}
  td.w{white-space:normal!important;max-width:none!important}
  tr{break-inside:avoid}
}
.rodape{max-width:min(1880px,100%);margin:0 auto;padding:0 16px 28px;color:var(--muted);font-size:12.5px}
.marca b{display:block;font-size:17px}.marca span{color:var(--muted);font-size:12.5px}
.caixa label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.erro{color:var(--bad);font-size:13px}
.erro:empty,.caixa .nota:empty{display:none}
.caixa p{margin:0}

/* app */
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.topo{max-width:min(1880px,100%);margin:0 auto;padding:10px clamp(12px,2vw,32px);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topo .marca{margin-right:auto}
.quem{color:var(--muted);font-size:13px}
main{max-width:min(1880px,100%);margin:0 auto;padding:18px clamp(12px,2vw,32px) 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
main>*{min-width:0}
.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.filtros label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
h1{font-size:20px;margin:0;text-wrap:balance}
h2{font-size:15px;margin:0}
.sub{color:var(--muted);margin:2px 0 0;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.vazio{color:var(--muted);padding:20px;text-align:center}

/* lista de clientes */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-weight:600;font-size:12px;cursor:pointer;user-select:none}
thead th.ord::after{content:" ▾";font-size:10px}
thead th.ord.asc::after{content:" ▴"}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.m{font-family:var(--mono);font-size:12px}
td.w{white-space:normal;min-width:220px}
tfoot td{font-weight:700;background:var(--soft)}
tbody tr:hover td{background:var(--soft)}
.cli{cursor:pointer}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--brand-soft);color:var(--brand)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--info-soft);color:var(--info)}

/* detalhe */
.cab{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:start}
.acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.kpi .r{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.abas{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{white-space:nowrap}
.sub{overflow-wrap:anywhere}
.tab{border:0;background:transparent;padding:9px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;cursor:pointer}
.tab[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand)}
.ferr{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 11px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink)}
.nota{color:var(--muted);font-size:12.5px;max-width:95ch}
.lote{display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:64px;z-index:4;border-color:var(--brand)}
.lote-l{display:flex;gap:8px;align-items:baseline;margin-right:auto}
.lnk{border:0;background:none;color:var(--brand);cursor:pointer;text-decoration:underline;padding:0}
th.ck,td.ck{width:34px;text-align:center}
td.ck input,th.ck input{width:16px;height:16px;cursor:pointer;accent-color:var(--brand)}
#conteudo{display:grid;gap:12px;min-width:0}
#conteudo>*{min-width:0}
.barra{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;width:160px}
.barra i{display:block;height:100%;background:var(--brand);width:0}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.grade2{grid-template-columns:1fr}}
.carregando{display:flex;gap:10px;align-items:center;color:var(--muted)}
.giro{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:g 0.8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
/* navegação */
.nav{display:flex;gap:2px;flex-wrap:wrap;min-width:0;max-width:100%}
.nav button{border:0;background:transparent;padding:8px 12px;border-radius:7px;font-weight:600;color:var(--muted);cursor:pointer}
.nav button[aria-current=page]{background:var(--brand-soft);color:var(--brand)}
.nav button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
/* painel geral */
h3{font-size:13.5px;margin:14px 0 6px}
section.card{display:grid;gap:10px}
section.card>*,#pMesSec>*,section>.kpis{min-width:0}
#pMesSec{display:grid;gap:16px;min-width:0}
.kpis.k6{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g-ok{border-left:4px solid var(--brand)}.g-atencao{border-left:4px solid var(--warn)}.g-parado,.g-erro{border-left:4px solid var(--bad)}.g-manual,.g-nunca{border-left:4px solid var(--info)}
.nota.ok{color:var(--brand);font-weight:600}
.regs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.reg{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:3px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);border-top:4px solid var(--c,var(--muted));background:var(--panel)}
.reg:hover{background:var(--soft)}.reg:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.reg[aria-pressed=true]{background:var(--cs,var(--soft));box-shadow:inset 0 0 0 1px var(--c,var(--muted))}
.reg .r{font-weight:700;color:var(--c,var(--muted))}.reg .v{font-size:20px;font-weight:700}.reg .v small{font-size:12.5px;font-weight:600;color:var(--muted)}.reg .d{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.r-SN{--c:var(--sn);--cs:var(--sn-soft)}.r-PRESUMIDO{--c:var(--pre);--cs:var(--pre-soft)}.r-REAL{--c:var(--real);--cs:var(--real-soft)}.r-MEI{--c:var(--mei);--cs:var(--mei-soft)}.r-NORMAL,.r-X{--c:var(--muted);--cs:var(--soft)}
.pill.r-SN,.pill.r-PRESUMIDO,.pill.r-REAL,.pill.r-MEI,.pill.r-NORMAL,.pill.r-X{background:var(--cs);color:var(--c)}
.pilha{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--soft);gap:2px}
.pilha i{display:block;background:var(--c)}
.alertas{margin:0;padding-left:18px;display:grid;gap:6px}
tr.cli td{cursor:pointer}
/* busca de XML */
#xFiltros input[type=search]{min-width:0}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);width:min(1100px,calc(100vw - 32px));max-height:calc(100vh - 48px);padding:18px;display:none}
dialog[open]{display:grid;gap:12px;align-content:start;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 18px;overflow-wrap:anywhere}
.kpis.mini{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}.kpis.mini .v{font-size:15px}
pre.xml{white-space:pre-wrap;word-break:break-all;font:12px/1.4 var(--mono);background:var(--soft);padding:10px;border-radius:8px;max-height:360px;overflow:auto}
.sub.m{font-family:var(--mono);font-size:11.5px}
/* configurações */
.form{display:grid;gap:10px;align-content:start}
.form label{display:grid;gap:3px;font-size:12.5px;color:var(--muted)}
.form label.ck,.cks label.ck{display:flex;gap:7px;align-items:center;font-size:13.5px;color:var(--ink)}
.cks{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:end}
.cks label{display:grid;gap:3px;font-size:12.5px;color:var(--muted)}
fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:8px;margin:0}
legend{font-size:12.5px;color:var(--muted);padding:0 4px}
#uLista{max-height:220px;overflow:auto}
input[type=checkbox]{accent-color:var(--brand);width:16px;height:16px}
.aviso{margin:0;font-size:13px;font-weight:600;color:var(--brand)}.aviso:empty{display:none}.aviso.bad{color:var(--bad)}.aviso.warn{color:var(--warn)}.aviso.info{color:var(--info)}
.btn.perigo{border-color:var(--bad);color:var(--bad);margin-left:auto}
details{border-bottom:1px solid var(--line);padding:8px 0}details summary{cursor:pointer;padding:4px 0}details .tbl{margin-top:8px}
#dlgUsu{width:min(560px,calc(100vw - 32px))}
/* dia a dia */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .sem{font-size:11.5px;color:var(--muted);text-align:center;font-weight:600}
.dia{border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:6px 8px;min-height:64px;display:grid;align-content:start;gap:1px;font-size:11.5px;color:var(--muted);overflow:hidden}
.dia b{font-size:14px;color:var(--ink)}
.dia.ok{border-left-color:var(--brand);background:var(--brand-soft)}.dia.ok span:first-of-type{color:var(--ink)}
.dia.vazio{border-left-color:var(--warn);background:var(--warn-soft)}
.dia.falta{border-left-color:var(--bad);background:var(--bad-soft)}.dia .f{color:var(--bad);font-weight:700}
.dia.dom{opacity:.7}.dia.fut{opacity:.4}
.dia .c{font-size:11px}
.legenda{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin:0}
.legenda i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:-6px;vertical-align:-1px}
.legenda i.l-ok{background:var(--brand)}.legenda i.l-vazio{background:var(--warn)}.legenda i.l-falta{background:var(--bad)}.legenda i.l-dom{background:var(--line)}
.legenda i.b1,.grafico .b1{background:var(--brand);fill:var(--brand)}.legenda i.b2,.grafico .b2{background:var(--info);fill:var(--info)}
.grafico{width:100%;height:auto;max-height:220px}.grafico text{fill:var(--muted);font-size:10px}
@media (max-width:640px){.dia{min-height:48px;padding:4px;font-size:10px}.dia span{display:none}.dia .f{display:block}}
#cfgCorpo{display:grid;gap:16px;min-width:0}#cfgCorpo>*{min-width:0}
/* central de operação e painel do contador */
:root{--ok:#1a7f5a;--ok-soft:#e3f4ec}
@media (prefers-color-scheme:dark){:root{--ok:#4cc29c;--ok-soft:#1b3129}}
#tela>.cab h1{font-size:22px;letter-spacing:-.01em}
.kpis4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi2{position:relative;padding:16px 18px;border-radius:12px;gap:4px}
.kpi2 .v{font-size:27px;letter-spacing:-.02em}.kpi2 .r{font-weight:600;padding-right:70px}
.kpi2 .tag{position:absolute;top:14px;right:14px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px}
.tag.up{background:var(--ok-soft);color:var(--ok)}.tag.dn{background:var(--bad-soft);color:var(--bad)}.tag.wn{background:var(--warn-soft);color:var(--warn)}
.g2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:grid;gap:16px;min-width:0}
section.card,.col>.card{border-radius:12px;padding:18px 20px;gap:14px}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}.ch>span{color:var(--muted);font-size:12.5px}
.leg{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}.d-ok{background:var(--ok)}.d-wn{background:#e3a008}.d-bad{background:var(--bad)}
.sema{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;max-height:430px;overflow:auto;padding:2px}
.scli{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:9px;padding:9px 11px;display:grid;gap:2px;background:var(--panel);min-width:0}
.scli b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scli span{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scli.n1{border-left-color:#e3a008;background:var(--warn-soft)}.scli.n1 b{color:var(--warn)}
.scli.n2{border-left-color:var(--bad);background:var(--bad-soft)}.scli.n2 b{color:var(--bad)}
.scli:hover{box-shadow:0 1px 4px rgba(0,0,0,.08)}.scli:focus-visible{outline:2px solid var(--brand)}
.tbl.sem{border:0;border-radius:0}.tbl.sem th{background:transparent;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.prazo{font-weight:700;font-size:12px;white-space:normal;min-width:110px}
td.b{font-weight:700;white-space:normal}
#pCorpo{display:grid;gap:16px;min-width:0}#pCorpo>*{min-width:0}
.vers{display:grid;gap:10px}.vers .l{display:grid;grid-template-columns:60px 1fr 30px;gap:10px;align-items:center}
.barra2{height:9px;border-radius:5px;background:var(--soft);overflow:hidden;position:relative}.barra2 i{display:block;height:100%;border-radius:5px}
.barra2.lin{overflow:visible;height:11px}.barra2.lin::after{content:"";position:absolute;left:75%;top:-3px;bottom:-3px;border-left:2px dashed var(--muted);opacity:.6}
.uso{list-style:none;margin:0;padding:0}.uso li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.uso li:last-child{border:0}
.lim{display:grid;gap:6px}
.lim .l{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,190px) 1fr auto;gap:14px;align-items:center;font-size:13px;padding:5px 6px;border-radius:7px}
.lim .l:hover{background:var(--soft)}.lim .l b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lim .v{white-space:nowrap}
.eco{display:grid;gap:2px}.eco .v{font-size:28px;font-weight:700;color:var(--ok);letter-spacing:-.02em}.eco .v::before{content:"R$ "}
.alertas{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.alertas li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.alertas li:hover{background:var(--soft)}.alertas b{display:block;font-size:13px}.alertas li>div>span{color:var(--muted);font-size:12.5px}
.ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800}
.ic.bad{background:var(--bad-soft);color:var(--bad)}.ic.warn{background:var(--warn-soft);color:var(--warn)}.ic.info{background:var(--info-soft);color:var(--info)}
.fech{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.fech div{border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;display:grid}.fech .v{font-size:24px;font-weight:700}
.fl{list-style:none;margin:0;padding:0;max-height:230px;overflow:auto}.fl li{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}.fl li:hover{background:var(--soft)}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:10px}.minis div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px}.minis .r{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.minis b{font-size:17px}
@media (max-width:1000px){.kpis4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.kpis4{grid-template-columns:minmax(0,1fr)}.lim .l{grid-template-columns:1fr;gap:4px}.fech{gap:6px}}
@media (prefers-reduced-motion:reduce){.giro{animation:none}}
#sCorpo{display:grid;gap:16px;min-width:0}#sCorpo>*{min-width:0}
.srvt td{vertical-align:top}.srvt .sub{display:block;font-size:11.5px}
.chave{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chave input{width:16px;height:16px;accent-color:var(--brand)}
.evl{list-style:none;margin:0;padding:0}.evl li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.evl li:last-child{border:0}
.evl .q{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}.evl .x{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
@media (max-width:700px){.evl li{grid-template-columns:1fr}}
.tot td{border-top:1px solid var(--line)}
#fcAba td .sub,#fCorpo td .sub{display:block;font-size:11.5px}
#fCorpo,#fcAba{display:grid;gap:14px;min-width:0}#fcAba{margin-top:14px}#fcAba>*{min-width:0}
#dlgFin label{display:grid;gap:4px;font-size:13px}
#rfSec .minis.rf4{grid-template-columns:repeat(4,minmax(0,1fr))}@media (max-width:760px){#rfSec .minis.rf4{grid-template-columns:repeat(2,minmax(0,1fr))}}
ul.lst{margin:6px 0 10px;padding-left:20px;display:grid;gap:4px}
.cf-tab td{vertical-align:top}.cf-num{white-space:nowrap;font-variant-numeric:tabular-nums}.cf-num b{font-size:14px}.cf-seg{font-family:ui-monospace,Consolas,monospace;letter-spacing:.5px}.cf-seg.aberto{background:var(--warn-bg,#fff4d6);padding:1px 5px;border-radius:5px;user-select:all}
</style>

/* ---------------- aparência (aba "Aparência" da planilha) ---------------- */
function aplicarAparencia(A) {
  A = A || {}; APARENCIA_ATUAL = A;
  var rgb = function (h) { var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  var tinta = function (h) { var c = rgb(h).map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) > 0.45 ? '#0b1512' : '#ffffff'; };

function carregarPainel() {
  var mes = PST.mes, todos = mesesTodos();

  if ($('pCorpo') && !(IND[mes] && !IND[mes].faltam)) $('pCorpo').innerHTML = carregando('Calculando os indicadores de ' + nomeMes(mes) + '… (na primeira vez do mês demora um pouco)');
  // 1º o mês escolhido (aparece logo), depois os outros 11 numa chamada só
  carregarInd(mes, function (r) { if ($('pCorpo') && PST.mes === mes) $('pCorpo').innerHTML = carregando('Calculando os indicadores de ' + nomeMes(mes) + '… ' + r.itens.length + ' de ' + r.total + ' clientes'); })
    .then(function () { if (PST.mes === mes && $('pCorpo')) desenharPainel(); return carregarLote(ordem.slice(1)); })
    .then(function () { if (PST.mes === mes && $('pCorpo')) desenharPainel(); })
    .catch(function (e) { if ($('pCorpo')) $('pCorpo').innerHTML = '<div class="card erro">' + esc(e.message) + '</div>'; });

function desenharPainel() {

    }).join('') + '</div><p class="nota">Linha tracejada: R$ 3,6 mi (sublimite do ICMS e ISS). ' + (parcial ? 'Ainda há menos de 12 meses no portal: o valor é a soma dos meses disponíveis (' + mesesRbt.map(function (m) { return m.slice(5, 7) + '/' + m.slice(2, 4); }).join(', ') + ').' : '') + '</p>'

  html += '<section class="card"><div class="ch"><h2>Receitas a segregar no DAS</h2><span>' + nomeMes(mes) + '</span></div>' +

    (seg.length ? '<div class="tbl sem"><table><thead><tr><th>Cliente</th><th class="n">Monofásico</th><th class="n">ICMS ST</th></tr></thead><tbody>' +

/* ---------------- reforma tributária: IBS/CBS nos XML (NT 2025.002) ----------------
   Regime normal (CRT 3): obrigatório desde 03/08/2026. Simples/MEI (CRT 1, 2 e 4): a partir de 04/01/2027.
   Em 2026 as alíquotas de teste são CBS 0,9% e IBS 0,1%. */
var RF_NORMAL = '2026-08', RF_SIMPLES = '2027-01';
function rfObrigacao(regime, mes) {
  if (regime === 'SN' || regime === 'MEI') return { desde: '04/01/2027', obrig: mes >= RF_SIMPLES };
  if (regime) return { desde: '03/08/2026', obrig: mes >= RF_NORMAL };
  return { desde: '?', obrig: false };
}
// situação de um cliente no mês (x = indicador do painel)
function rfSituacao(x, mes) {
  var ob = rfObrigacao(x.regime, mes), rf = x.rf || { det: false, docs: x.docs || 0 };
  var s = { ob: ob, det: !!rf.det, docs: rf.docs || 0, docsCom: rf.docsCom || 0, pct: null, vIBS: rf.vIBS || x.ibs || 0, vCBS: rf.vCBS || x.cbs || 0 };
  if (!s.docs) { s.id = 'semnotas'; s.txt = 'Sem notas emitidas'; s.cls = 'info'; s.ordem = 0; return s; }
  if (rf.det) {
    s.pct = 100 * s.docsCom / s.docs;
    if (s.docsCom >= s.docs) { s.id = 'ok'; s.txt = 'Preenchendo'; s.cls = ''; s.ordem = 1; }
    else if (s.docsCom > 0) { s.id = 'parcial'; s.txt = 'Parcial · ' + Math.floor(s.pct) + '%'; s.cls = 'warn'; s.ordem = ob.obrig ? 4 : 2; }
    else { s.id = 'nao'; s.ordem = ob.obrig ? 5 : 2; }
  } else {
    if (s.vIBS + s.vCBS > 0) { s.id = 'destaca'; s.txt = 'Destaca IBS/CBS'; s.cls = ''; s.ordem = 1; }
    else { s.id = 'nao'; s.ordem = ob.obrig ? 5 : 2; }
  }
  if (s.id === 'nao') { s.txt = ob.obrig ? 'Não preenche' : 'Ainda não preenche'; s.cls = ob.obrig ? 'bad' : 'info'; }
  return s;
}
function rfSecaoPainel(lista, mes) {
  var linhas = lista.map(function (x) {
    var s = rfSituacao(x, mes);
    return { x: x, s: s, rotulo: x.rotulo, contabilidade: x.contabilidade, regimeNome: x.regimeNome || '—', desde: s.ob.desde, docs: s.docs, docsCom: s.det ? s.docsCom : null,
      pctTxt: s.pct == null ? (s.det ? '' : 'sem detalhe') : Math.floor(s.pct) + '%', vIBS: s.vIBS, vCBS: s.vCBS, situacao: s.txt, cf: (x.rf || {}).cf || null,
      conferencia: (function (cf) { if (!cf) return ''; var e = (cf.saiErro || 0) + (cf.entErro || 0); return e ? e + ' nota(s) com erro' : ((cf.saiConf || 0) + (cf.entConf || 0) ? 'Confere' : ''); })((x.rf || {}).cf) };
  }).sort(function (a, b) { return b.s.ordem - a.s.ordem || b.docs - a.docs; });
  var obrig = linhas.filter(function (l) { return l.s.ob.obrig && l.s.id !== 'semnotas'; });
  var obrigFalta = obrig.filter(function (l) { return l.s.id === 'nao' || l.s.id === 'parcial'; });
  var sn = linhas.filter(function (l) { return !l.s.ob.obrig && l.s.ob.desde === '04/01/2027' && l.s.id !== 'semnotas'; });
  var snPronto = sn.filter(function (l) { return l.s.id === 'ok' || l.s.id === 'destaca'; });
  var semDet = linhas.filter(function (l) { return !l.s.det && l.s.id !== 'semnotas'; }).length;
  var cfTem = linhas.some(function (l) { return l.cf; }), cfErro = 0, cfCli = 0;
  linhas.forEach(function (l) { if (l.cf) { var e = (l.cf.saiErro || 0) + (l.cf.entErro || 0); cfErro += e; if (e) cfCli++; } });
  var html = '<section class="card" id="rfSec"><div class="ch"><h2>Reforma tributária · IBS e CBS nos XML</h2><div class="ferr"><span>' + nomeMes(mes) + ' · NT 2025.002</span><button class="btn sec" type="button" id="rfCsv">Exportar para Excel (CSV)</button></div></div>' +
    '<div class="minis rf4"><div><span class="r">Regime normal preenchendo</span><b' + (obrigFalta.length ? ' style="color:var(--bad)"' : '') + '>' + (obrig.length - obrigFalta.length) + ' de ' + obrig.length + '</b></div>' +
    '<div><span class="r">Regime normal sem preencher</span><b' + (obrigFalta.length ? ' style="color:var(--bad)"' : '') + '>' + obrigFalta.length + '</b></div>' +
    '<div><span class="r">Simples/MEI já preparados para 2027</span><b>' + snPronto.length + ' de ' + sn.length + '</b></div>' +
    '<div><span class="r">Notas com IBS/CBS calculado errado</span><b' + (cfErro ? ' style="color:var(--bad)"' : '') + '>' + (cfTem ? int(cfErro) + ' em ' + cfCli + ' cliente(s)' : 'aguardando') + '</b></div></div>' +
    '<div class="tbl"><table><thead><tr><th>Cliente</th><th>Regime</th><th>Obrigatório desde</th><th class="n">Notas emitidas</th><th class="n">Com IBS/CBS</th><th class="n">IBS</th><th class="n">CBS</th><th>Situação</th><th>Conferência dos valores</th></tr></thead><tbody>' +
    linhas.map(function (l, i) {
      return '<tr class="cli" data-rf="' + i + '"><td class="b">' + esc(l.rotulo) + '</td><td>' + esc(l.regimeNome) + '</td><td>' + esc(l.desde) + '</td><td class="n">' + int(l.docs) + '</td>' +
        '<td class="n">' + (l.docsCom == null ? '<span class="sub">' + l.pctTxt + '</span>' : int(l.docsCom) + ' <span class="sub">' + l.pctTxt + '</span>') + '</td>' +
        '<td class="n">' + brl(l.vIBS) + '</td><td class="n">' + brl(l.vCBS) + '</td><td><span class="pill ' + l.s.cls + '">' + esc(l.situacao) + '</span></td>' +
        '<td>' + (l.conferencia ? '<span class="pill ' + (l.conferencia === 'Confere' ? '' : 'bad') + '" data-cf="' + i + '">' + esc(l.conferencia) + '</span>' : '<span class="sub">—</span>') + '</td></tr>';
    }).join('') + '</tbody></table></div>' +

function desenharConfig() {
  if (CFG_ABA === 'logins') CFG_ABA = 'estrutura';
  var abas = [['estrutura', 'Contabilidades e clientes'], ['regimes', 'Regimes'], ['unificar', 'Clientes duplicados']];
  $('tela').innerHTML = '<div class="cab"><div><h1>Configurações</h1><p class="sub">Só o administrador vê esta área. Os logins e permissões ficam no menu <b>Acessos</b>.</p></div></div>' +
    '<div class="abas" role="tablist">' + abas.map(function (a) { return '<button class="tab" role="tab" type="button" data-c="' + a[0] + '" aria-selected="' + (a[0] === CFG_ABA) + '">' + a[1] + '</button>'; }).join('') + '</div>' +
    '<p id="cfgAviso" class="aviso" role="status"></p><div id="cfgCorpo"></div><dialog id="dlgUsu" aria-labelledby="dlgUsuTit"></dialog>';
  document.querySelector('.abas').addEventListener('click', function (ev) { var b = ev.target.closest('.tab'); if (b) { CFG_ABA = b.dataset.c; desenharConfig(); } });
  if (CFG_ABA === 'logins') cfgLogins(); else if (CFG_ABA === 'estrutura') cfgEstrutura(); else if (CFG_ABA === 'unificar') cfgUnificar(); else cfgRegimes();
}

/* ---- clientes duplicados: "CLIENTE" (meses soltos) + "CLIENTE / MATRIZ" viram um só ---- */
var UNIF = null;
function cfgUnificar() {
  $('cfgCorpo').innerHTML = carregando('Procurando clientes repetidos no Drive…');
  chamar('portalUnificar', TOKEN, null).then(function (r) { UNIF = r; desenharUnificar(); })
    .catch(function (e) { $('cfgCorpo').innerHTML = '<div class="card erro">' + esc(e.message) + '</div>'; });
}
function desenharUnificar(feitos) {
  var c = UNIF.casos || [];
  var html = '<div class="card"><p class="sub">Mesmo cliente aparecendo duas vezes: uma com os meses soltos (em geral os XML enviados à mão) e outra numa subpasta (em geral <b>MATRIZ</b>, a do agente). ' +
    'Ao unificar, os meses que faltam na subpasta são completados com os da parte solta, e só a subpasta continua aparecendo. Se os dois lados tiverem o mesmo arquivo, fica o maior; o outro vai para <code>_PORTAL_DADOS/_unificados</code> (nada é apagado). ' +
    'Envios futuros sem subpasta desse cliente vão sozinhos para a subpasta escolhida.</p></div>';
  if (feitos && feitos.length) html += '<div class="card"><b>Unificados agora:</b><ul>' + feitos.map(function (f) { return '<li>' + esc(f.contabilidade + ' · ' + f.cliente) + ' → <b>' + esc(f.destino) + '</b> (' + f.movidos + ' item(ns) movido(s)' + (f.conflitos ? ', ' + f.conflitos + ' repetido(s) guardado(s) em _unificados' : '') + ')</li>'; }).join('') + '</ul></div>';
  if (!c.length) { $('cfgCorpo').innerHTML = html + '<div class="card vazio">Nenhum cliente duplicado encontrado.</div>'; return; }
  html += '<div class="tbl"><table><thead><tr><th></th><th>Contabilidade</th><th>Cliente</th><th>Meses soltos (resumos)</th><th>Pastas de XML soltas</th><th>Fica em</th></tr></thead><tbody>' +
    c.map(function (x, i) {
      var sel = x.subpastas.length === 1 ? '<b>' + esc(x.cliente + ' / ' + x.subpastas[0]) + '</b>' :
        '<select data-d="' + i + '"><option value="">escolha…</option>' + x.subpastas.map(function (s) { return '<option>' + esc(s) + '</option>'; }).join('') + '</select>';
      return '<tr><td><input type="checkbox" data-i="' + i + '"' + (x.ambiguo ? '' : ' checked') + ' aria-label="unificar ' + esc(x.cliente) + '"></td><td>' + esc(x.contabilidade) + '</td><td class="m">' + esc(x.cliente) + '</td>' +
        '<td class="w">' + (x.jsons.length ? esc(x.jsons.join(', ')) : '—') + '</td><td class="w">' + (x.xml.length ? esc(x.xml.join(', ')) : '—') + '</td><td>' + sel + '</td></tr>';
    }).join('') + '</tbody></table></div>' +
    '<div class="ferr"><button class="btn" type="button" id="bUnif">Unificar os marcados</button><span class="sub">Quando há mais de uma subpasta (ex.: MATRIZ e FILIAL), escolha para qual vão os meses soltos.</span></div>';
  $('cfgCorpo').innerHTML = html;
  $('bUnif').addEventListener('click', function () {
    var esc_ = [], falta = '';
    document.querySelectorAll('#cfgCorpo input[data-i]').forEach(function (cb) {
      if (!cb.checked) return; var x = c[Number(cb.dataset.i)], d = x.subpastas.length === 1 ? x.subpastas[0] : (document.querySelector('#cfgCorpo select[data-d="' + cb.dataset.i + '"]') || {}).value;
      if (!d) { falta = x.cliente; return; }
      esc_.push({ contabilidade: x.contabilidade, cliente: x.cliente, destino: d });
    });
    if (falta) { avisoCfg('Escolha a subpasta de ' + falta + '.', true); return; }
    if (!esc_.length) { avisoCfg('Marque pelo menos um cliente.', true); return; }
    if (!confirm('Unificar ' + esc_.length + ' cliente(s)? Os arquivos serão movidos no Drive.')) return;
    $('bUnif').disabled = true; $('bUnif').textContent = 'Unificando… (pode levar 1 a 2 minutos)';
    chamar('portalUnificar', TOKEN, esc_).then(function (r) {
      UNIF = r; desenharUnificar(r.feitos); avisoCfg('Pronto: ' + r.feitos.length + ' cliente(s) unificado(s).', false);
      try { sessionStorage.removeItem('portal_dados'); } catch (e) {}
      chamar('portalDados', TOKEN).then(function (d) { DADOS = d; }).catch(function () {});
    }).catch(function (e) { $('bUnif').disabled = false; $('bUnif').textContent = 'Unificar os marcados'; avisoCfg(e.message, true); });
  });
}

/* ---------------- dia a dia (calendário do mês) ---------------- */
var SEMANA = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
function diasDoResumo() {
  var mes = ATUAL.mes, l = (RESUMO.porDia || []).filter(function (d) { return d.dia.slice(0, 7) === mes; });
  return { dias: l, fora: (RESUMO.porDia || []).filter(function (d) { return d.dia.slice(0, 7) !== mes; }), sistema: !!RESUMO.comSistema, fonte: 'resumo' };
}
function diasDosXml() {   // monta a partir dos XML do mês já carregados na busca
  var m = {}, fora = 0;
  BUSCA.docs.forEach(function (d) {
    if (d.mes !== ATUAL.mes || ['nfe', 'nfce', 'compra'].indexOf(d.tipo) < 0 || !d.data) return;
    if (d.data.slice(0, 7) !== ATUAL.mes) { fora++; return; }
    var x = m[d.data] = m[d.data] || { dia: d.data, nfe: 0, nfce: 0, compras: 0, canc: 0, vNfe: 0, vNfce: 0, vCompras: 0 };
    if (d.sit === 'Cancelada') x.canc++;
    if (d.tipo === 'nfce') { x.nfce++; x.vNfce += d.valor; } else if (d.tipo === 'compra') { x.compras++; x.vCompras += d.valor; } else { x.nfe++; x.vNfe += d.valor; }
  });
  return { dias: Object.keys(m).sort().map(function (k) { return m[k]; }), fora: fora ? [{ compras: fora }] : [], sistema: false, fonte: 'xml' };
}

function telaDias(c) {
  if (RESUMO.porDia) { desenharDias(c, diasDoResumo()); return; }
  var u = ATUAL.u, ck = chaveUnid(u.contabilidade, rotuloPainel(u));
  if (BUSCA && BUSCA.ck === ck && BUSCA.meses[ATUAL.mes] && BUSCA.meses[ATUAL.mes].carregado) { desenharDias(c, diasDosXml()); return; }
  c.innerHTML = '<div class="card"><h2>Dia a dia</h2><p class="nota">Este resumo foi gerado por uma versão anterior do programa, que ainda não guardava a contagem por dia. ' +
    'Ela passa a vir pronta depois da próxima sincronização. Enquanto isso, dá para montar agora a partir dos XML do mês.</p>' +
    '<div class="ferr"><button class="btn" type="button" id="dMontar">Montar pelos XML do mês</button><div class="barra hidden" id="dBarra"><i></i></div><span class="sub" id="dInfo"></span></div></div>';
  $('dMontar').addEventListener('click', function () {
    if (!BUSCA || BUSCA.ck !== ck) BUSCA = { ck: ck, meses: {}, docs: [], porChave: {}, sel: {}, ord: 'data', asc: false, cnpj: RESUMO && RESUMO.cnpj };
    $('dMontar').disabled = true;
    var info = function (t, p) { if (!$('dInfo')) return; $('dInfo').textContent = t; var b = $('dBarra'); if (p == null) b.classList.add('hidden'); else { b.classList.remove('hidden'); b.firstChild.style.width = (100 * p) + '%'; } };
    carregarMesBusca(u, ATUAL.mes, info).then(function () { if (ATUAL && ATUAL.aba === 'dias' && $('conteudo')) desenharDias($('conteudo'), diasDosXml()); })
      .catch(function (e) { info(e.message, null); if ($('dMontar')) $('dMontar').disabled = false; });
  });
}

function desenharDias(c, D) {
  var mes = ATUAL.mes, ano = +mes.slice(0, 4), m = +mes.slice(5, 7), nDias = new Date(ano, m, 0).getDate();
  var hoje = new Date(), hojeTxt = hoje.getFullYear() + '-' + ('0' + (hoje.getMonth() + 1)).slice(-2) + '-' + ('0' + hoje.getDate()).slice(-2);
  var por = {}; D.dias.forEach(function (d) { por[d.dia] = d; });
  var cel = [], diasCom = 0, diasSem = [], faltamTot = 0, diasFalta = [], maxDocs = 1, serie = [];
  for (var i = 1; i <= nDias; i++) {
    var dia = mes + '-' + ('0' + i).slice(-2), d = por[dia] || { nfe: 0, nfce: 0, compras: 0, canc: 0 };
    var emit = d.nfe + d.nfce, futuro = dia > hojeTxt, dow = new Date(ano, m - 1, i).getDay();
    var falta = Math.max(0, (d.sisNfe || 0) - (d.sisNfeXml || 0)) + Math.max(0, (d.sisNfce || 0) - (d.sisNfceXml || 0));
    if (emit) diasCom++; else if (!futuro) diasSem.push(i);
    if (falta) { faltamTot += falta; diasFalta.push(i); }
    maxDocs = Math.max(maxDocs, emit);
    serie.push({ i: i, nfe: d.nfe, nfce: d.nfce, futuro: futuro });
    var cls = futuro ? 'fut' : (falta ? 'falta' : (emit ? 'ok' : (dow === 0 ? 'dom' : 'vazio')));
    var tip = dataBR(dia) + ' · NF-e ' + d.nfe + (d.vNfe ? ' (R$ ' + brl(d.vNfe) + ')' : '') + ' · NFC-e ' + d.nfce + (d.vNfce ? ' (R$ ' + brl(d.vNfce) + ')' : '') + ' · compras ' + d.compras +
      (D.sistema ? ' · no sistema: ' + (d.sisNfe || 0) + ' NF-e / ' + (d.sisNfce || 0) + ' NFC-e' : '');

function lerOfx(txt) {
  var tag = function (b, n) { var m = b.match(new RegExp('<' + n + '>\\s*([^<\\r\\n]*)', 'i')); return m ? m[1].trim() : ''; };
  var dt = function (s) { var m = String(s).match(/^(\d{4})(\d{2})(\d{2})/); return m ? m[1] + '-' + m[2] + '-' + m[3] : ''; };
  var num = function (s) { s = String(s).trim(); if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); return Number(s); };
  var blocos = txt.split(/<STMTRS>|<CCSTMTRS>/i).slice(1);
  if (!blocos.length) throw new Error('Não parece um arquivo OFX (sem extrato dentro).');
  return blocos.map(function (b) {
    var trans = b.split(/<STMTTRN>/i).slice(1).map(function (x) {
      x = x.split(/<\/STMTTRN>|<\/BANKTRANLIST>/i)[0];
      var nome = tag(x, 'NAME'), memo = tag(x, 'MEMO');
      return { fitid: tag(x, 'FITID'), data: dt(tag(x, 'DTPOSTED')), valor: num(tag(x, 'TRNAMT')), desc: (nome && memo && memo.toUpperCase().indexOf(nome.toUpperCase()) < 0 ? nome + ' ' + memo : (memo || nome)).replace(/\s+/g, ' '), doc: tag(x, 'CHECKNUM') || tag(x, 'REFNUM') };
    }).filter(function (t) { return t.data && t.valor; });
    var lb = (b.split(/<LEDGERBAL>/i)[1] || '');
    return { banco: tag(b, 'BANKID') || tag(txt, 'FID') || '', bancoNome: tag(txt, 'ORG'), agencia: tag(b, 'BRANCHID'), conta: tag(b, 'ACCTID'),
      saldo: lb ? num(tag(lb, 'BALAMT')) : null, dataSaldo: lb ? dt(tag(lb, 'DTASOF')) : '', inicio: dt(tag(b, 'DTSTART')), fim: dt(tag(b, 'DTEND')), trans: trans };
  });
}
function decodificarOfx(buf) {
  var cab = new TextDecoder('ascii').decode(buf.slice(0, 400));
  var cp = /CHARSET:\s*1252|ENCODING:\s*USASCII|ISO-?8859/i.test(cab) && !/UTF-?8/i.test(cab) ? 'windows-1252' : 'utf-8';
  var t = new TextDecoder(cp).decode(buf); if (cp === 'utf-8' && t.indexOf('�') >= 0) t = new TextDecoder('windows-1252').decode(buf);
  return t;
}

// fotos grandes são reduzidas aqui antes de enviar (a leitura fica igual e gasta menos)
function prepararArquivo(f) {
  return new Promise(function (ok, falha) {
    var rd = new FileReader();
    rd.onerror = function () { falha(new Error('Não consegui ler o arquivo.')); };
    if (!/^image\//.test(f.type) || /gif/.test(f.type)) { rd.onload = function () { ok({ nome: f.name, tipo: f.type || 'application/pdf', base64: String(rd.result).split(',')[1] }); }; rd.readAsDataURL(f); return; }
    rd.onload = function () {
      var img = new Image();
      img.onload = function () {
        var k = Math.min(1, 1600 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        ok({ nome: f.name.replace(/\.\w+$/, '') + '.jpg', tipo: 'image/jpeg', base64: cv.toDataURL('image/jpeg', 0.85).split(',')[1] });
      };
      img.onerror = function () { ok({ nome: f.name, tipo: f.type, base64: String(rd.result).split(',')[1] }); };
      img.src = rd.result;
    };
    rd.readAsDataURL(f);
  });
}

        '<td class="w">' + esc(c.recebedor || '') + (c.descricao || c.obs ? '<span class="sub">' + esc(c.obs || c.descricao) + '</span>' : '') + (c.texto ? '<span class="sub">cliente: ' + esc(c.texto) + '</span>' : '') + '</td>' +
        '<td>' + esc(c.cat ? catNome(c.cat) : '—') + (c.origemCat === 'ia' ? '<span class="sub">sugerida pela IA</span>' : '') + '</td>' +
        '<td><span class="pill ' + st[0] + '">' + esc(st[1]) + '</span>' + (c.conciliado ? '<span class="sub">ligado ao extrato ' + esc(dataBR(c.conciliado.data)) + '</span>' : '<span class="sub">aguardando o extrato</span>') + '</td>' +
        '<td><button class="lnk" type="button" data-ver="' + i + '">ver</button>' + (op ? ' <button class="lnk" type="button" data-cor="' + i + '">corrigir</button>' : '') + '</td></tr>';
    }).join('') + '</tbody></table></div>';
    el.querySelectorAll('[data-ver]').forEach(function (b) { b.addEventListener('click', function () {
      var c = L[+b.dataset.ver]; b.textContent = 'abrindo…';
      chamar('portalFinAnexo', TOKEN, FINC.contabilidade, FINC.cliente, c.arquivoId).then(function (a) {
        var bin = atob(a.base64), u8 = new Uint8Array(bin.length); for (var k = 0; k < bin.length; k++) u8[k] = bin.charCodeAt(k);
        window.open(URL.createObjectURL(new Blob([u8], { type: a.tipo })), '_blank'); b.textContent = 'ver';
      }).catch(function (e) { b.textContent = 'ver'; avisoFin(e.message, true); });
    }); });
    el.querySelectorAll('[data-cor]').forEach(function (b) { b.addEventListener('click', function () { dlgComprovante(L[+b.dataset.cor]); }); });
  }).catch(function (e) { if ($('cpLista')) $('cpLista').innerHTML = '<div class="card erro">' + esc(e.message) + '</div>'; });
}
function dlgComprovante(c) {

    '<label>Data do pagamento<input id="ccData" type="date" value="' + esc(c.data || '') + '"></label>' +
    '<label>Recebedor<input id="ccRec" value="' + esc(c.recebedor || '') + '"></label>' +

    '<label>O que foi<input id="ccDesc" value="' + esc(c.descricao || c.texto || '') + '"></label>' +

    '<label class="chave"><input type="checkbox" id="ccRegra" checked>lembrar: próximos pagamentos para este recebedor já entram nesta categoria</label>' +
    '<div class="ferr"><button class="btn" type="button" id="ccSalvar">Salvar</button><button class="btn sec" type="button" id="ccFechar">Cancelar</button></div>';

      { valor: $('ccVal').value, data: $('ccData').value, recebedor: $('ccRec').value, forma: $('ccForma').value, descricao: $('ccDesc').value, cat: $('ccCat').value }, $('ccRegra').checked)
      .then(function () { d.close(); avisoFin('Comprovante salvo.', false); carregarComprovantes(); })
      .catch(function (e) { $('ccSalvar').disabled = false; avisoFin(e.message, true); d.close(); });

}

function finRegras() {
  var R = FINC.regras || [];
  $('fcAba').innerHTML = '<section class="card"><div class="ch"><h2>Regras aprendidas desta empresa</h2><span>' + R.length + ' regra(s)</span></div><p class="nota">Toda vez que você confirma uma categoria com "lembrar" marcado, o texto do extrato vira regra e os próximos lançamentos iguais já entram categorizados. As regras gerais (tarifas, IOF, maquininhas, impostos, energia…) valem para todas as empresas.</p>' +
    (R.length ? '<div class="tbl sem"><table><thead><tr><th>Texto do extrato</th><th>Entrada/saída</th><th>Categoria</th><th></th></tr></thead><tbody>' + R.map(function (r, i) {
      return '<tr><td class="m">' + esc(r.chave) + '</td><td>' + (r.sinal === 'D' ? 'saída' : 'entrada') + '</td><td>' + esc(catNome(r.cat)) + '</td><td><button class="lnk" type="button" data-x="' + i + '">remover</button></td></tr>';
    }).join('') + '</tbody></table></div>' : '<p class="nota">Nenhuma regra ainda.</p>') + '</section>';
  $('fcAba').querySelectorAll('[data-x]').forEach(function (b) { b.addEventListener('click', function () {
    var r = R[+b.dataset.x]; chamar('portalFinRemoverRegra', TOKEN, FINC.contabilidade, FINC.cliente, r.chave, r.sinal).then(recarregarFin).catch(function (e) { avisoFin(e.message, true); });
  }); });
}

<script>
/* ---------------- guia do portal (passo a passo para quem entra pela primeira vez; botão "Ajuda" reabre) ---------------- */
var GUIA_VERSAO = 'v1', GUIA = null;
function guiaPassos(d) {
  var P = [], empresa = !!d.empresa, admin = !!d.admin;
  var pill = function (cls, t) { return '<span class="pill ' + cls + '">' + t + '</span>'; };
  if (empresa) {
    P.push({ t: 'Bem-vindo ao financeiro da sua empresa', h: '<p>Aqui você acompanha o <b>financeiro da ' + esc(d.empresa.cliente) + '</b> organizado pela equipe do BPO: o que entrou, o que saiu e o resultado do mês.</p><p>Você vê só a sua empresa. Quando a equipe precisar de alguma informação, ela aparece em <b>Pendências</b> para você responder por aqui mesmo.</p>' });
    P.push({ t: 'As abas do financeiro', h: '<ul><li><b>Resumo</b>: saldo nos bancos, entradas e saídas do mês e para onde foi o dinheiro (por categoria).</li><li><b>Extrato</b>: cada lançamento dos bancos, já categorizado (aluguel, fornecedor, impostos…).</li><li><b>Comprovantes</b>: os comprovantes de pagamento recebidos e a qual lançamento cada um foi ligado.</li><li><b>Pendências</b>: lançamentos que a equipe não conseguiu identificar sozinha.</li><li><b>DRE e fluxo de caixa</b>: o resultado do mês (receitas, custos, despesas e lucro) e a evolução do caixa.</li></ul>' });
    P.push({ t: 'Como responder uma pendência', h: '<ol><li>Abra a aba <b>Pendências</b>.</li><li>Em cada lançamento, escreva do que se trata (ex.: "conta de luz da loja") e clique em <b>Enviar justificativa</b>.</li><li>Se tiver o comprovante, use <b>Enviar comprovante</b> (foto ou PDF). Se o comprovante já tiver uma observação escrita, melhor ainda.</li></ol><p>As baixas são feitas só aqui no portal; nada é alterado no sistema da loja.</p>', ir: 'financeiro' });
  } else {
    P.push({ t: 'Bem-vindo ao ' + esc(document.title), h: '<p>Este portal reúne os <b>XML fiscais e os resumos de cada cliente</b>. Um agente instalado no servidor do cliente (LC Sistemas ou Gestores) envia os XML <b>todas as noites</b> para a pasta da contabilidade no Google Drive; o portal lê esses arquivos e monta os números.</p><p>Você não precisa pedir XML ao cliente: o que foi emitido ontem já aparece hoje. Este guia mostra o que significa cada tela. Ele leva 2 minutos e pode ser aberto de novo a qualquer hora no botão <b>Ajuda</b>, no topo.</p>' });
    if (admin) P.push({ t: 'Central (só CPUSIS)', h: '<p>Visão de operação de <b>todos</b> os clientes de todas as contabilidades: quantos estão em dia, parados ou com erro, e quais precisam de atenção agora.</p>', ir: 'central' });
    P.push({ t: 'Painel: o fechamento do mês', h: '<p>Escolha o <b>mês</b> no topo. O painel mostra:</p><ul><li><b>Fechamento do mês</b>: quais clientes estão prontos para fechar e quais têm pendências.</li><li><b>Alertas inteligentes</b>: notas em contingência, rejeitadas, numeração pulada, notas sem XML, com o prazo para resolver.</li><li><b>Limite do Simples Nacional</b>: quanto cada cliente do Simples já faturou no ano.</li><li><b>Receitas a segregar no DAS</b>: vendas com PIS/COFINS monofásico e com ICMS por substituição tributária, para informar separado no PGDAS-D e o cliente não pagar imposto duas vezes.</li><li><b>Prazo para inutilizar</b>: numerações puladas que ainda precisam ser inutilizadas.</li><li><b>Reforma tributária (IBS e CBS)</b>: quais clientes já trazem o IBS e a CBS nas notas e quais ainda não preenchem.</li></ul><p>Quase toda tabela tem <b>Exportar para Excel (CSV)</b>.</p>', ir: 'painel' });
    P.push({ t: 'Clientes: a situação de cada um', h: '<p>Lista dos seus clientes com o último envio e os meses disponíveis. A coluna <b>Situação</b> diz se o agente do cliente está mandando os XML:</p><ul class="guia-leg"><li>' + pill('', 'Em dia') + ' enviou nas últimas 24 horas</li><li>' + pill('warn', 'Atenção') + ' 2 a 6 dias sem enviar</li><li>' + pill('bad', 'Parados') + ' 7 dias ou mais sem enviar</li><li>' + pill('bad', 'Com erro') + ' o último envio deu erro</li><li>' + pill('info', 'Envio manual') + ' os XML foram colocados à mão no Drive</li><li>' + pill('info', 'Sem registro') + ' o agente nunca se comunicou</li></ul><p>Clique no nome para abrir o cliente. Para baixar de vários de uma vez, <b>marque</b> os clientes e use <b>Baixar tudo em um ZIP</b>.</p>', ir: 'clientes' });
    P.push({ t: 'A tela do cliente', h: '<p>No topo ficam os números do mês: NF-e emitidas, NFC-e, compras (XML importados), canceladas e ICMS. O botão <b>Baixar XML do mês (ZIP)</b> traz todos os arquivos organizados em pastas (emitidas, NFC-e, compras, eventos, inutilizações).</p><p>As abas detalham o mês:</p><ul><li><b>Dia a dia</b>: notas por dia, conferidas com o banco do sistema do cliente. Se faltar algum XML, aparece aqui.</li><li><b>Apuração fiscal</b>: estimativa dos impostos do mês. No <b>Simples Nacional</b>: faixa, alíquota efetiva e DAS (já separando monofásicos e ICMS-ST). No <b>Lucro Presumido</b>: PIS e COFINS, ICMS a pagar (débitos menos créditos) e IRPJ e CSLL do trimestre com a parte do mês.</li><li><b>Tributação</b>, <b>NCMs</b>, <b>PIS/COFINS</b>: valores por CST/CSOSN, CFOP, NCM e tributação monofásica.</li><li><b>Produtos</b>: o que foi vendido e comprado, com quantidade e valor.</li><li><b>Devoluções</b>, <b>Cancelamentos e numeração</b>: notas canceladas, inutilizações e falhas na numeração.</li><li><b>Pagamentos</b>: formas de pagamento das vendas (dinheiro, PIX, cartão…).</li><li><b>Reforma (IBS/CBS)</b>: quantas notas já trazem o IBS e a CBS, os CST e cClassTrib usados e a lista das notas sem esses campos.</li></ul>' });
    P.push({ t: 'Buscar XML', h: '<p>Na aba <b>Buscar XML</b> da tela do cliente você acha qualquer nota do mês por <b>número, chave, nome ou CNPJ/CPF, valor e data</b>.</p><ul><li>Clique na nota para ver os dados principais (produtos, impostos, protocolo) ou <b>Ver o XML completo</b>.</li><li>Marque várias e use <b>Baixar marcados (ZIP)</b>, ou exporte a lista para o Excel.</li></ul>' });
    P.push({ t: 'Modo Reunião e Visão da carteira', h: '<p><b>Modo Reunião</b> (botão na tela do cliente): uma tela escura, feita para mostrar ao cliente na <b>TV, tablet ou notebook</b>. Use o botão de <b>tela cheia</b> e <b>Esc</b> para sair. Ela mostra:</p><ul><li>Faturamento, ticket médio e imposto destacado nas vendas do mês.</li><li><b>Vendas e compras dos últimos 12 meses</b> e quanto as vendas estão acima das compras.</li><li><b>Saúde fiscal</b>: nota de 0 a 100 (XML faltando, pendências na SEFAZ, falhas na numeração, Reforma Tributária).</li><li><b>Termômetro fiscal</b>: compara as vendas com as compras de revenda. O esperado é vender pelo menos 20% acima do que se compra; abaixo de 85% desse mínimo aparece <b>Risco de notificação</b>.</li></ul><p><b>Visão da carteira</b> (botão no Painel): todos os seus clientes com a nota e o termômetro, e a lista <b>Precisa de você hoje</b>.</p><p>O termômetro é uma <b>estimativa</b> feita com os XML do portal. Quando faltam notas de compra ou há menos de 6 meses de dados, ele avisa em vez de dar resultado.</p>', ir: 'painel' });
    P.push({ t: 'O que significam as pendências', h: '<p>As pendências vêm do próprio sistema do cliente e mostram o que ainda não está certo na SEFAZ:</p><ul class="guia-leg"><li>' + pill('warn', 'Contingência') + ' nota emitida sem internet: precisa ser transmitida hoje</li><li>' + pill('bad', 'Rejeitada') + ' a SEFAZ recusou: corrigir e reenviar</li><li>' + pill('bad', 'Numeração pulada') + ' faltam números na sequência: inutilizar</li><li>' + pill('info', 'Sem XML') + ' a nota existe no sistema, mas o XML autorizado não está lá: verificar</li><li>' + pill('info', 'Em digitação') + ' nota começada e não transmitida: transmitir ou excluir</li></ul><p>Quando a pendência é resolvida no sistema do cliente, ela some do portal no envio da noite seguinte.</p>' });
    P.push({ t: 'Análise fiscal dos produtos e calculadoras', h: '<p>Na tela do cliente, a aba <b>Análise fiscal dos produtos</b> confere produto a produto o que saiu nas notas — <b>NCM, CST de ICMS / CSOSN, CFOP, CEST, PIS e COFINS, IBS/CBS e cClassTrib</b> — com as mesmas regras das calculadoras da CPUSIS. O que estiver errado aparece em destaque e sai numa <b>planilha com a correção pronta</b> para aprovar e importar no sistema do cliente.</p><p>A aba <b>Calculadora</b> abre a do regime do cliente (Simples ou Presumido), com as notas de compra do mês: <b>abrir na calculadora</b> (custo, ICMS de entrada, códigos de venda e preço) ou imprimir o <b>espelho da nota</b> para lançar no sistema. No menu <b>Calculadoras</b> você usa as duas para qualquer consulta.</p>' });
    P.push({ t: 'Acessos e segurança', h: '<p>Cada login vê só o que o perfil permite: <b>gestor</b> e <b>contador</b> da contabilidade, e <b>cliente</b> (só a própria empresa). O gestor cria os logins dos contadores e clientes dele no menu <b>Acessos</b>, escolhe os módulos de cada um e vê o histórico de entradas.</p><p>Use <b>Minha senha</b> para trocar a sua. Depois de 1 hora parado o portal sai sozinho.</p>' });
    P.push({ t: 'Financeiro (BPO)', h: '<p>Para os clientes que contratam o <b>BPO financeiro</b>, a aba <b>Financeiro</b> mostra a carteira e, em cada cliente, o resumo, o extrato dos bancos categorizado, os comprovantes, as pendências e a <b>DRE e o fluxo de caixa</b> do mês.</p><p>Os clientes sem BPO simplesmente não aparecem nessa aba.</p>', ir: 'financeiro' });
    if (admin) P.push({ t: 'Servidores e Configurações (só CPUSIS)', h: '<ul><li><b>Servidores</b>: cada servidor de cliente com a versão do agente, o último backup do banco (feito só de madrugada, guardando no máximo 10 dias) e a situação do banco.</li><li><b>Acessos</b>: todos os logins (CPUSIS, contabilidades e clientes), perfis, módulos, sessões e o registro de acessos.</li><li><b>Configurações</b>: contabilidades e clientes, regimes, aparência do portal e clientes duplicados para juntar.</li></ul>', ir: 'servidores' });
    P.push({ t: 'Pronto!', h: '<ul><li>Os números são atualizados <b>todo dia</b> depois do envio da noite. O mês atual vai se completando dia a dia.</li><li>O mês anterior continua sendo reenviado nos primeiros dias do mês seguinte, para pegar notas transmitidas atrasadas.</li><li>Ao terminar, use <b>Sair</b> no topo, principalmente em computador compartilhado.</li></ul><p>Dúvidas? ' + (APARENCIA_ATUAL && APARENCIA_ATUAL.suporte ? 'Fale com o suporte: <b>' + esc(APARENCIA_ATUAL.suporte) + '</b>.' : 'Fale com a CPUSIS.') + ' Este guia fica sempre no botão <b>Ajuda</b>.</p>' });
  }
  return P;
}
function guiaChave() { return 'farol_guia_' + GUIA_VERSAO + '_' + ((DADOS && (DADOS.login || DADOS.nome)) || ''); }
function guiaAbrir() {
  if (!DADOS) return;
  var dl = $('dlgGuia');
  if (!dl) { dl = document.createElement('dialog'); dl.id = 'dlgGuia'; dl.className = 'guia'; dl.setAttribute('aria-labelledby', 'guiaTit'); document.body.appendChild(dl); }
  GUIA = { passos: guiaPassos(DADOS), i: 0 };
  guiaDesenhar();
  if (!dl.open) { try { dl.showModal(); } catch (e) { dl.setAttribute('open', ''); } }
}
function guiaFechar() {
  try { localStorage.setItem(guiaChave(), '1'); } catch (e) {}
  var dl = $('dlgGuia'); if (dl && dl.open) { try { dl.close(); } catch (e) { dl.removeAttribute('open'); } }
}
function guiaDesenhar() {
  var g = GUIA, p = g.passos[g.i], n = g.passos.length, ult = g.i === n - 1;
  var nomesTela = { central: 'Central', painel: 'Painel', clientes: 'Clientes', financeiro: 'Financeiro', servidores: 'Servidores' };
  $('dlgGuia').innerHTML =
    '<div class="guia-top"><span class="guia-num">Passo ' + (g.i + 1) + ' de ' + n + '</span><button type="button" class="btn sec" id="guiaX" aria-label="Fechar o guia">Fechar</button></div>' +
    '<div class="guia-barra" aria-hidden="true"><i style="width:' + Math.round(100 * (g.i + 1) / n) + '%"></i></div>' +
    '<h2 id="guiaTit">' + p.t + '</h2><div class="guia-txt">' + p.h + '</div>' +
    '<div class="guia-pes">' +
      '<button type="button" class="btn sec" id="guiaAnt"' + (g.i ? '' : ' disabled') + '>Anterior</button>' +
      (p.ir ? '<button type="button" class="btn sec" id="guiaIr">Abrir ' + nomesTela[p.ir] + '</button>' : '') +
      '<button type="button" class="btn" id="guiaProx">' + (ult ? 'Começar a usar' : 'Próximo') + '</button>' +
    '</div>';
  $('guiaX').onclick = guiaFechar;
  $('guiaAnt').onclick = function () { if (g.i) { g.i--; guiaDesenhar(); } };
  $('guiaProx').onclick = function () { if (ult) guiaFechar(); else { g.i++; guiaDesenhar(); } };
  if (p.ir) $('guiaIr').onclick = function () { guiaFechar(); var b = document.querySelector('.nav button[data-t="' + p.ir + '"]'); if (b && !b.classList.contains('hidden')) b.click(); };
}
// primeira vez de cada login neste navegador: abre sozinho
var GUIA_AGENDADO = false;
function guiaAuto() {
  if (GUIA_AGENDADO) return;
  var visto = null; try { visto = localStorage.getItem(guiaChave()); } catch (e) { visto = '1'; }
  if (!visto) { GUIA_AGENDADO = true; setTimeout(guiaAbrir, 600); }
}
(function () {
  var b = document.createElement('button'); b.type = 'button'; b.className = 'btn sec'; b.id = 'bAjuda'; b.textContent = 'Ajuda'; b.title = 'Guia do portal: o que significa cada tela';
  b.addEventListener('click', guiaAbrir);
  var sairB = $('bSair'); sairB.parentNode.insertBefore(b, sairB);
  var st = document.createElement('style');
  st.textContent = 'dialog.guia{width:min(620px,calc(100vw - 32px))}' +
    '.guia-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.guia-num{color:var(--muted);font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}' +
    '.guia-barra{height:4px;background:var(--soft);border-radius:4px;overflow:hidden}.guia-barra i{display:block;height:100%;background:var(--brand);transition:width .2s}' +
    'dialog.guia h2{margin:4px 0 0;font-size:20px}.guia-txt{line-height:1.55}.guia-txt p{margin:0 0 10px}.guia-txt ul,.guia-txt ol{margin:0 0 10px;padding-left:20px;display:grid;gap:6px}' +
    '.guia-txt ul.guia-leg{list-style:none;padding-left:0}.guia-txt .pill{margin-right:6px}' +
    '.guia-pes{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}' +
    '@media (max-width:520px){.guia-pes .btn{flex:1}}';
  document.head.appendChild(st);
})();

#mr select,#mr .mr-b{height:44px;padding:0 16px;border-radius:10px;border:1px solid #22324a;background:#0f182a;color:#dbe5ef;font:500 14px Inter,system-ui,sans-serif;cursor:pointer}
#mr .mr-b:hover,#mr select:hover{border-color:#2dd4bf}
#mr .mr-b:focus-visible,#mr select:focus-visible,#mr .mr-cli:focus-visible{outline:2px solid #2dd4bf;outline-offset:2px}
#mr .mr-g{display:grid;gap:clamp(12px,1.3vw,18px)}
#mr .mr-k4{grid-template-columns:repeat(4,minmax(0,1fr))}
#mr .mr-main{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
#mr .mr-3{grid-template-columns:repeat(3,minmax(0,1fr))}
#mr .mr-4{grid-template-columns:repeat(4,minmax(0,1fr))}
#mr .mr-c{background:#111b2e;border:1px solid #1c2a42;border-radius:18px;padding:clamp(14px,1.4vw,22px);display:flex;flex-direction:column;gap:10px;min-width:0}
#mr .mr-rot{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:#93a4b8;font-weight:600}
#mr .mr-v{font-size:clamp(26px,2.6vw,42px);font-weight:600;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
#mr .mr-d{font-size:14.5px;font-weight:600}
#mr .up{color:#5eead4}#mr .dn{color:#fbbf24}#mr .bad{color:#f87171}#mr .mu{color:#93a4b8}
#mr .mr-n{font-size:14px;color:#93a4b8;line-height:1.45}
#mr .mr-leg{display:flex;gap:16px;font-size:13px;color:#b8c6d6;flex-wrap:wrap}
#mr .mr-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
#mr svg text{font-family:Inter,system-ui,sans-serif}
#mr .mr-ter{position:relative;height:16px;border-radius:999px;background:linear-gradient(90deg,#7f1d1d 0 35%,#78350f 35% 50%,#134e4a 50% 100%);margin:6px 0 4px}
#mr .mr-ter b{position:absolute;top:-6px;width:4px;height:28px;border-radius:2px;background:#fff;box-shadow:0 0 0 3px #0b1220}
#mr .mr-ter-esc{position:relative;height:16px;font-size:12px;color:#7d8ea3}#mr .mr-ter-esc span{position:absolute;transform:translateX(-50%);white-space:nowrap}#mr .mr-ter-esc span:first-child{transform:none}#mr .mr-ter-esc span:last-child{transform:translateX(-100%)}
#mr .mr-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:600;width:max-content;max-width:100%}
#mr .p-ok{background:#0f2a26;color:#5eead4}#mr .p-at{background:#2d2310;color:#fbbf24}#mr .p-ri{background:#2e1418;color:#fca5a5}#mr .p-in{background:#17233a;color:#a5b4c8}
#mr ul.mr-it{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14.5px}
#mr ul.mr-it li{display:flex;gap:10px;align-items:flex-start}
#mr ul.mr-it li:before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:#5eead4}
#mr ul.mr-it li.x:before{background:#fbbf24}
#mr .mr-bar{display:grid;grid-template-columns:minmax(0,8.5em) 1fr 3em;gap:10px;align-items:center;font-size:13.5px}
#mr .mr-bar .t{height:10px;border-radius:999px;background:#1a2740;overflow:hidden}
#mr .mr-bar .t i{display:block;height:100%;border-radius:999px;background:#2dd4bf}
#mr .mr-rod{font-size:12.5px;color:#6b7c92;margin-top:auto;padding-top:6px}
#mr .mr-st{grid-template-columns:repeat(4,minmax(0,1fr))}
#mr .mr-cli{all:unset;box-sizing:border-box;cursor:pointer;background:#111b2e;border:1px solid #1c2a42;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
#mr .mr-cli:hover{border-color:#2dd4bf}
#mr .mr-lista{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
#mr .mr-hoje{display:grid;gap:8px}
#mr .mr-hoje .mr-cli{flex-direction:row;align-items:center;justify-content:space-between;gap:14px}
#mr .mr-nota{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
#mr .mr-filtro{display:flex;gap:6px;flex-wrap:wrap}
#mr .mr-filtro .mr-b[aria-pressed="true"]{border-color:#2dd4bf;background:#0f2a26;color:#e6fff8}
#mr .mr-carr{display:flex;align-items:center;gap:12px;color:#93a4b8;padding:40px 0;justify-content:center}
#mr .mr-carr i{width:18px;height:18px;border-radius:50%;border:2px solid #2dd4bf;border-right-color:transparent;animation:mrg 1s linear infinite}
@keyframes mrg{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#mr .mr-carr i{animation:none}}
@media (max-width:1100px){#mr .mr-main{grid-template-columns:1fr}#mr .mr-k4,#mr .mr-4,#mr .mr-st{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){#mr .mr-3{grid-template-columns:1fr}}
@media (max-width:620px){#mr .mr-4{grid-template-columns:1fr}}
@media (max-width:520px){#mr .mr-k4,#mr .mr-st{grid-template-columns:1fr}}
@media (min-width:1900px){#mr{font-size:18px}#mr .mr-n,#mr ul.mr-it{font-size:16px}}
</style>
<script>
(function () {
  var URL_MR = API_BANCO.replace(/\/farol$/, '/reuniao');
  var MR = null;   // { u, mes, dados } ou { carteira:true, ... }
  var DIAS = ['', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
  var MESC = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  function mc(m) { return MESC[+m.slice(5, 7) - 1]; }
  function din(v) {   // R$ curto para telão
    v = Number(v || 0); var a = Math.abs(v);
    if (a >= 1e6) return 'R$ ' + (v / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + ' mi';
    if (a >= 1e4) return 'R$ ' + (v / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil';
    return 'R$ ' + brl(v);
  }
  function delta(a, b) {
    if (!b) return '';
    var p = 100 * (a - b) / Math.abs(b);
    return '<span class="mr-d ' + (p >= 0 ? 'up' : 'dn') + '">' + (p >= 0 ? '▲ ' : '▼ ') + Math.abs(p).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%</span>';
  }
  function api(corpo) {
    corpo.token = TOKEN;
    return fetch(URL_MR, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(corpo) })
      .then(function (r) { if (!r.ok) throw new Error('Servidor respondeu ' + r.status + '. Tente de novo.'); return r.json(); })
      .catch(function (e) { throw new Error(/Failed to fetch|NetworkError|Load failed/i.test(e.message) ? 'Sem conexão com o servidor. Confira a internet e tente de novo.' : e.message); })
      .then(function (j) { if (j.ok) return j.r; if (/SESSAO_EXPIRADA/.test(j.erro)) { fechar(); sair(true); } throw new Error(j.erro); });
  }
  function casca(html) {
    var el = document.getElementById('mr');
    if (!el) {
      el = document.createElement('div'); el.id = 'mr'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Modo Reunião');
      document.body.appendChild(el); document.documentElement.style.overflow = 'hidden';
      document.addEventListener('keydown', tecla);
    }
    el.innerHTML = '<div class="mr-in">' + html + '</div>';
    return el;
  }
  function tecla(ev) { if (ev.key === 'Escape' && !document.fullscreenElement) fechar(); }
  function fechar() {
    var el = document.getElementById('mr'); if (el) el.remove();
    document.documentElement.style.overflow = ''; document.removeEventListener('keydown', tecla);
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {});
    MR = null;
  }
  function telaCheia() {
    var el = document.getElementById('mr'); if (!el) return;
    if (document.fullscreenElement) document.exitFullscreen(); else if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
  }
  var ICO_CHEIA = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  function topo(titulo, sub, extra) {
    return '<header class="mr-top"><div class="mr-id"><div class="mr-selo">FC</div><div style="min-width:0"><h1>' + titulo + '</h1><div class="mr-sub">' + sub + '</div></div></div>' +
      '<div class="mr-acoes">' + (extra || '') + '<button type="button" class="mr-b" id="mrCheia" aria-label="Tela cheia" title="Tela cheia">' + ICO_CHEIA + '</button>' +
      '<button type="button" class="mr-b" id="mrFechar">Fechar ✕</button></div></header>';
  }
  function ligarTopo() { document.getElementById('mrFechar').onclick = fechar; document.getElementById('mrCheia').onclick = telaCheia; }

  /* ---------- termômetro ---------- */
  var ST_PILL = { ok: 'p-ok', atencao: 'p-at', risco: 'p-ri', poucos: 'p-in', compras: 'p-in' };
  function termoHtml(t, grande) {
    var pill = '<span class="mr-pill ' + ST_PILL[t.st] + '">' + esc(t.txt) + '</span>';
    var margem = Math.round(t.margem * 100);
    if (t.st === 'poucos' || t.st === 'compras') {
      return pill + '<div class="mr-n">' + (t.st === 'compras'
        ? 'As vendas aparecem muito acima das compras porque parte das notas de entrada ainda não chegou ao portal. Importe os XML de compra no sistema para o termômetro ficar confiável.'
        : 'O termômetro compara até 12 meses. Com menos de 6 meses de notas no portal, a conta ainda não é segura.') + '</div>' +
        '<div class="mr-n">Saídas: <b style="color:#e6edf5">' + din(t.saidas) + '</b> · Entradas: <b style="color:#e6edf5">' + din(t.entradas) + '</b></div>';
    }
    var pos = Math.max(0, Math.min(100, (t.pct - 50)));   // escala 50% a 150%
    return '<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap"><div class="mr-v">' + t.pct + '%</div>' + pill + '</div>' +
      '<div class="mr-ter" role="img" aria-label="Vendas em ' + t.pct + '% do mínimo esperado"><b style="left:calc(' + pos + '% - 2px)"></b></div>' +
      '<div class="mr-ter-esc"><span style="left:0">50%</span><span style="left:35%">85%</span><span style="left:50%">100% = mínimo</span><span style="left:100%">150%</span></div>' +
      '<div class="mr-n">Compras de revenda: <b style="color:#e6edf5">' + din(t.entradas) + '</b> · mínimo esperado (+' + margem + '%): <b style="color:#e6edf5">' + din(t.esperado) + '</b> · vendas: <b style="color:#e6edf5">' + din(t.saidas) + '</b>' +
      (t.diferenca < 0 ? ' · <span class="bad">faltam ' + din(-t.diferenca) + '</span>' : '') + '</div>' +
      (grande ? '<div class="mr-n" style="font-size:12.5px">Período: ' + t.meses + ' meses. Transferências entre matriz e filial entram nas duas pontas. Estimativa pelos XML do portal.</div>' : '');
  }

  /* ---------- gráfico 12 meses (barras vendas x compras) ---------- */
  function grafico(serie) {
    if (!serie.length) return '<div class="mr-n">Sem meses para mostrar.</div>';
    var W = 900, H = 300, pe = 60, pb = 30, pt = 14, max = 0;
    serie.forEach(function (s) { max = Math.max(max, s.vendas, s.compras); });
    if (!max) max = 1;
    var passo = Math.pow(10, Math.floor(Math.log10(max))), topoV = Math.ceil(max / passo) * passo;
    var gw = (W - pe) / serie.length, bw = Math.min(26, gw * 0.32), y = function (v) { return pt + (H - pt - pb) * (1 - v / topoV); };
    var o = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Vendas e compras nos últimos ' + serie.length + ' meses">';
    for (var i = 0; i <= 4; i++) { var v = topoV * i / 4, yy = y(v); o += '<line x1="' + pe + '" x2="' + W + '" y1="' + yy + '" y2="' + yy + '" stroke="#1c2a42"/><text x="' + (pe - 8) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="12" fill="#7d8ea3">' + esc(din(v).replace('R$ ', '')) + '</text>'; }
    serie.forEach(function (s, k) {
      var x = pe + gw * k + gw / 2;
      o += '<rect x="' + (x - bw - 2) + '" y="' + y(s.vendas) + '" width="' + bw + '" height="' + Math.max(0, H - pb - y(s.vendas)) + '" rx="4" fill="#2dd4bf"><title>' + mc(s.mes) + ': vendas ' + din(s.vendas) + '</title></rect>';
      o += '<rect x="' + (x + 2) + '" y="' + y(s.compras) + '" width="' + bw + '" height="' + Math.max(0, H - pb - y(s.compras)) + '" rx="4" fill="#64748b"><title>' + mc(s.mes) + ': compras ' + din(s.compras) + '</title></rect>';
      o += '<text x="' + x + '" y="' + (H - 9) + '" text-anchor="middle" font-size="12.5" fill="#93a4b8">' + mc(s.mes) + '</text>';
    });
    return o + '</svg>';
  }
  function anel(nota) {
    var r = 46, c = 2 * Math.PI * r, cor = nota >= 75 ? '#2dd4bf' : nota >= 55 ? '#fbbf24' : '#f87171';
    return '<svg viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Nota ' + nota + ' de 100" style="flex:none"><circle cx="60" cy="60" r="' + r + '" fill="none" stroke="#1a2740" stroke-width="12"/>' +
      '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="' + cor + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (c * nota / 100) + ' ' + c + '" transform="rotate(-90 60 60)"/>' +
      '<text x="60" y="68" text-anchor="middle" font-size="30" font-weight="600" fill="#e6edf5">' + nota + '</text></svg>';
  }
  function barras(obj, rotulos) {
    var ks = Object.keys(obj || {}), tot = 0, max = 0;
    ks.forEach(function (k) { tot += obj[k]; max = Math.max(max, obj[k]); });
    if (!tot) return '<div class="mr-n">Sem dados neste mês.</div>';
    if (rotulos) ks.sort(function (a, b) { return a - b; }); else ks.sort(function (a, b) { return obj[b] - obj[a]; });
    return ks.slice(0, 7).map(function (k) {
      return '<div class="mr-bar"><span>' + esc(rotulos ? rotulos[k] : k) + '</span><span class="t"><i style="width:' + (100 * obj[k] / max) + '%"></i></span><span class="mu" style="text-align:right">' + Math.round(100 * obj[k] / tot) + '%</span></div>';
    }).join('');
  }

  /* ---------- receita bruta acumulada dos últimos 12 meses ---------- */
  function linha(serie, campo, cor) {
    var n = serie.length, max = 0; serie.forEach(function (s) { max = Math.max(max, s.vendas, s.compras); });
    if (n < 2 || !max) return '';
    return '<polyline points="' + serie.map(function (s, i) { return (200 * i / (n - 1)).toFixed(1) + ',' + (33 - 30 * s[campo] / max).toFixed(1); }).join(' ') + '" fill="none" stroke="' + cor + '" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>';
  }
  function rbt12(serie, t) {
    var n = serie.length, ini = n ? serie[0].mes : '', fim = n ? serie[n - 1].mes : '';
    var per = n ? mc(ini) + '/' + ini.slice(2, 4) + ' a ' + mc(fim) + '/' + fim.slice(2, 4) : '';
    var ven = t.saidas, com = t.entradas, sv = 0; serie.forEach(function (s) { sv += s.vendas; });
    var sp = n > 1 ? '<svg viewBox="0 0 200 36" width="100%" height="26" preserveAspectRatio="none" aria-hidden="true">' + linha(serie, 'compras', '#64748b') + linha(serie, 'vendas', '#2dd4bf') + '</svg>' : '';
    var vl = function (rot, v, cor) { return '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><span class="mr-n"><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:' + cor + ';margin-right:7px"></i>' + rot + '</span><b style="font-size:clamp(20px,1.8vw,28px);font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums">' + din(v) + '</b></div>'; };
    var margem = Math.round(t.margem * 100), rel = '';
    if (com > 0) {
      var acima = 100 * (ven - com) / com, cls = { ok: 'up', atencao: 'dn', risco: 'bad' }[t.st] || 'mu';
      var ab = Math.floor(Math.abs(acima) * 10) / 10;
      rel = '<div class="mr-d ' + cls + '">Vendas ' + ab.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '% ' + (acima >= 0 ? 'acima' : 'abaixo') + ' das compras <span class="mu" style="font-weight:500">(mínimo ' + margem + '%)</span></div>' +
        (t.st === 'compras' ? '<div class="mr-n" style="font-size:12.5px">Notas de compra ainda incompletas no portal.</div>' : t.st === 'poucos' ? '<div class="mr-n" style="font-size:12.5px">Ainda há poucos meses para concluir.</div>' : '');
    } else rel = '<div class="mr-n">Sem notas de compra no portal neste período.</div>';
    return '<div class="mr-c"><div class="mr-rot">Vendas e compras · 12 meses</div>' + vl('Vendas', ven, '#2dd4bf') + vl('Compras', com, '#64748b') + sp + rel +
      '<div class="mr-n" style="font-size:12.5px">' + (per ? per : '') + (Math.abs(ven - sv) > 1 ? ' · com transferências' : '') +
      (n && n < 12 ? ' · <span style="color:#fbbf24">só ' + n + ' ' + (n === 1 ? 'mês' : 'meses') + ' no portal</span>' : '') + '</div></div>';
  }

  /* ---------- Modo Reunião (um cliente) ---------- */
  function abrirReuniao(u, mes) {
    MR = { u: u, mes: mes || u.meses[0] };
    casca(topo(esc(rotuloUnid(u)), esc(nomeMes(MR.mes)) + ' · ' + esc(u.contabilidade)) + '<div class="mr-carr"><i></i>Montando a apresentação…</div>'); ligarTopo();
    api({ acao: 'reuniao', contabilidade: u.contabilidade, cliente: u.cliente, subpasta: u.subpasta, mes: MR.mes })
      .then(function (d) { if (MR && MR.u === u) { MR.dados = d; desenharReuniao(); } })
      .catch(function (e) { casca(topo(esc(rotuloUnid(u)), '') + '<div class="mr-c"><b>Não deu para abrir o Modo Reunião.</b><span class="mr-n">' + esc(e.message) + '</span></div>'); ligarTopo(); });
  }
  function desenharReuniao() {
    var d = MR.dados, u = MR.u, a = d.atual || { vendas: 0, compras: 0, impostos: 0, qtd: 0, ticket: 0 }, an = d.anterior;
    var reg = { SN: 'Simples Nacional', MEI: 'MEI', NORMAL: 'Regime normal', REAL: 'Lucro Real', PRESUMIDO: 'Lucro Presumido' }[d.regime] || d.regime || '';
    var sel = '<label class="mr-sub" style="display:flex;align-items:center;gap:8px">Mês <select id="mrMes">' + u.meses.map(function (m) { return '<option value="' + m + '"' + (m === MR.mes ? ' selected' : '') + '>' + nomeMes(m) + '</option>'; }).join('') + '</select></label>';
    var cargaImp = a.vendas ? 100 * a.impostos / a.vendas : 0, cargaAnt = an && an.vendas ? 100 * an.impostos / an.vendas : null;
    var s = d.saude, t = d.termometro;
    var html = topo(esc(rotuloUnid(u)), esc(nomeMes(MR.mes)) + ' · ' + esc(u.contabilidade) + (reg ? ' · ' + esc(reg) : ''), sel) +
      '<section class="mr-g mr-k4" aria-label="Números do mês">' +
        '<div class="mr-c"><div class="mr-rot">Faturamento</div><div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap"><div class="mr-v">' + din(a.vendas) + '</div>' + (an ? delta(a.vendas, an.vendas) : '') + '</div><div class="mr-n">Vendas menos devoluções' + (an ? ' · mês anterior ' + din(an.vendas) : '') + '</div></div>' +
        '<div class="mr-c"><div class="mr-rot">Ticket médio</div><div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap"><div class="mr-v">' + din(a.ticket) + '</div></div><div class="mr-n">' + int(a.qtd) + ' notas e cupons no mês</div></div>' +
        '<div class="mr-c"><div class="mr-rot">Imposto destacado nas vendas</div><div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap"><div class="mr-v">' + cargaImp.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%</div>' +
          (cargaAnt != null ? '<span class="mr-d ' + (cargaImp <= cargaAnt ? 'up' : 'dn') + '">' + (cargaImp <= cargaAnt ? '▼ ' : '▲ ') + Math.abs(cargaImp - cargaAnt).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' p.p.</span>' : '') + '</div><div class="mr-n">' + din(a.impostos) + ' de ICMS, ST, PIS, COFINS e IPI nas notas</div></div>' +
        rbt12(d.serie, d.termometro) +
      '</section>' +
      '<section class="mr-g mr-main">' +
        '<div class="mr-c"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div class="mr-rot">Vendas x compras · ' + d.serie.length + ' meses</div><div class="mr-leg"><span><i style="background:#2dd4bf"></i>Vendas</span><span><i style="background:#64748b"></i>Compras</span></div></div>' + grafico(d.serie) + '</div>' +
        '<div class="mr-g" style="grid-template-rows:auto 1fr">' +
          '<div class="mr-c"><div class="mr-rot">Saúde fiscal</div><div style="display:flex;gap:18px;align-items:center">' + anel(s.nota) + '<div style="display:grid;gap:8px;min-width:0"><b style="font-size:18px">' + esc(s.rotulo) + '</b><ul class="mr-it">' + s.itens.map(function (i) { return '<li' + (i.ok ? '' : ' class="x"') + '>' + esc(i.txt) + '</li>'; }).join('') + '</ul></div></div></div>' +
          '<div class="mr-c"><div class="mr-rot">Termômetro fiscal · vendas x compras</div>' + termoHtml(t, true) + '</div>' +

  function grupo(c) { var st = c.termometro.st; return st === 'risco' || c.saude.nota < 55 ? 'risco' : st === 'atencao' || c.saude.nota < 75 ? 'atencao' : (st === 'poucos' || st === 'compras') ? 'sem' : 'ok'; }
  function abrirCarteira(mes, contab) {
    MR = { carteira: true, mes: mes, contab: contab || '', filtro: 'todos' };

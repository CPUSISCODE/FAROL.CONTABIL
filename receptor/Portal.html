<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Farol Contábil</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Layout: barra superior fixa com navegação; Painel geral (todas as empresas: envio, regimes, totais); Clientes (lista + download em lote); cliente/mês com indicadores, abas de análise, busca de XML e download do ZIP */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --ink:#15211c; --muted:#5a6a62; --line:#dbe2de; --soft:#eef3f0;
  --brand:#0f6b55; --brand-ink:#ffffff; --brand-soft:#e1efe9; --warn:#8a5a00; --warn-soft:#fff2d4; --bad:#b3261e; --bad-soft:#fbe8e6; --info:#1f4f86; --info-soft:#e5eef9;
  --sn:#0f6b55; --sn-soft:#e1efe9; --pre:#1f4f86; --pre-soft:#e5eef9; --real:#6a3fa0; --real-soft:#efe8f8; --mei:#8a5a00; --mei-soft:#fff2d4;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif; --mono:Consolas,"Cascadia Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1513; --panel:#171f1c; --ink:#e3ebe7; --muted:#97a69f; --line:#2a3530; --soft:#1d2723;
  --brand:#4cc29c; --brand-ink:#0b1512; --brand-soft:#1b3129; --warn:#f2c35a; --warn-soft:#382d12; --bad:#ff8a80; --bad-soft:#3a1f1c; --info:#8db8ee; --info-soft:#1c2a3b;
  --sn:#4cc29c; --sn-soft:#1b3129; --pre:#8db8ee; --pre-soft:#1c2a3b; --real:#c4a6f0; --real-soft:#2a2238; --mei:#f2c35a; --mei-soft:#382d12; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans)}
button,input,select{font:inherit;color:inherit}
.btn{border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);border-radius:7px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--brand)}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,.tab:focus-visible,th:focus-visible,.cli:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
input[type=text],input[type=password],input[type=search],input[type=date],select{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-width:0}
.hidden{display:none!important}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.caixa{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 24px;display:grid;gap:14px}
.marca{display:flex;align-items:center;gap:10px}
.selo{width:38px;height:38px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;letter-spacing:.02em;overflow:hidden;flex:none}
.selo.img{background:transparent}.selo img{width:100%;height:100%;object-fit:contain}
.rodape{max-width:1320px;margin:0 auto;padding:0 16px 28px;color:var(--muted);font-size:12.5px}
.marca b{display:block;font-size:17px}.marca span{color:var(--muted);font-size:12.5px}
.caixa label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.erro{color:var(--bad);font-size:13px}
.erro:empty,.caixa .nota:empty{display:none}
.caixa p{margin:0}

/* app */
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.topo{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topo .marca{margin-right:auto}
.quem{color:var(--muted);font-size:13px}
main{max-width:1320px;margin:0 auto;padding:18px 16px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
main>*{min-width:0}
.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.filtros label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
h1{font-size:20px;margin:0;text-wrap:balance}
h2{font-size:15px;margin:0}
.sub{color:var(--muted);margin:2px 0 0;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.vazio{color:var(--muted);padding:20px;text-align:center}

/* lista de clientes */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-weight:600;font-size:12px;cursor:pointer;user-select:none}
thead th.ord::after{content:" ▾";font-size:10px}
thead th.ord.asc::after{content:" ▴"}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.m{font-family:var(--mono);font-size:12px}
td.w{white-space:normal;min-width:220px}
tfoot td{font-weight:700;background:var(--soft)}
tbody tr:hover td{background:var(--soft)}
.cli{cursor:pointer}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--brand-soft);color:var(--brand)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--info-soft);color:var(--info)}

/* detalhe */
.cab{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:start}
.acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.kpi .r{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.abas{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{white-space:nowrap}
.sub{overflow-wrap:anywhere}
.tab{border:0;background:transparent;padding:9px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;cursor:pointer}
.tab[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand)}
.ferr{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 11px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink)}
.nota{color:var(--muted);font-size:12.5px;max-width:95ch}
.lote{display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:64px;z-index:4;border-color:var(--brand)}
.lote-l{display:flex;gap:8px;align-items:baseline;margin-right:auto}
.lnk{border:0;background:none;color:var(--brand);cursor:pointer;text-decoration:underline;padding:0}
th.ck,td.ck{width:34px;text-align:center}
td.ck input,th.ck input{width:16px;height:16px;cursor:pointer;accent-color:var(--brand)}
#conteudo{display:grid;gap:12px;min-width:0}
#conteudo>*{min-width:0}
.barra{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;width:160px}
.barra i{display:block;height:100%;background:var(--brand);width:0}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.grade2{grid-template-columns:1fr}}
.carregando{display:flex;gap:10px;align-items:center;color:var(--muted)}
.giro{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:g 0.8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
/* navegação */
.nav{display:flex;gap:2px;flex-wrap:wrap;min-width:0;max-width:100%}
.nav button{border:0;background:transparent;padding:8px 12px;border-radius:7px;font-weight:600;color:var(--muted);cursor:pointer}
.nav button[aria-current=page]{background:var(--brand-soft);color:var(--brand)}
.nav button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
/* painel geral */
h3{font-size:13.5px;margin:14px 0 6px}
section.card{display:grid;gap:10px}
section.card>*,#pMesSec>*,section>.kpis{min-width:0}
#pMesSec{display:grid;gap:16px;min-width:0}
.kpis.k6{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g-ok{border-left:4px solid var(--brand)}.g-atencao{border-left:4px solid var(--warn)}.g-parado,.g-erro{border-left:4px solid var(--bad)}.g-manual,.g-nunca{border-left:4px solid var(--info)}
.nota.ok{color:var(--brand);font-weight:600}
.regs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.reg{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:3px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);border-top:4px solid var(--c,var(--muted));background:var(--panel)}
.reg:hover{background:var(--soft)}.reg:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.reg[aria-pressed=true]{background:var(--cs,var(--soft));box-shadow:inset 0 0 0 1px var(--c,var(--muted))}
.reg .r{font-weight:700;color:var(--c,var(--muted))}.reg .v{font-size:20px;font-weight:700}.reg .v small{font-size:12.5px;font-weight:600;color:var(--muted)}.reg .d{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.r-SN{--c:var(--sn);--cs:var(--sn-soft)}.r-PRESUMIDO{--c:var(--pre);--cs:var(--pre-soft)}.r-REAL{--c:var(--real);--cs:var(--real-soft)}.r-MEI{--c:var(--mei);--cs:var(--mei-soft)}.r-NORMAL,.r-X{--c:var(--muted);--cs:var(--soft)}
.pill.r-SN,.pill.r-PRESUMIDO,.pill.r-REAL,.pill.r-MEI,.pill.r-NORMAL,.pill.r-X{background:var(--cs);color:var(--c)}
.pilha{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--soft);gap:2px}
.pilha i{display:block;background:var(--c)}
.alertas{margin:0;padding-left:18px;display:grid;gap:6px}
tr.cli td{cursor:pointer}
/* busca de XML */
#xFiltros input[type=search]{min-width:0}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);width:min(1100px,calc(100vw - 32px));max-height:calc(100vh - 48px);padding:18px;display:none}
dialog[open]{display:grid;gap:12px;align-content:start;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 18px;overflow-wrap:anywhere}
.kpis.mini{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}.kpis.mini .v{font-size:15px}
pre.xml{white-space:pre-wrap;word-break:break-all;font:12px/1.4 var(--mono);background:var(--soft);padding:10px;border-radius:8px;max-height:360px;overflow:auto}
.sub.m{font-family:var(--mono);font-size:11.5px}
/* configurações */
.form{display:grid;gap:10px;align-content:start}
.form label{display:grid;gap:3px;font-size:12.5px;color:var(--muted)}
.form label.ck,.cks label.ck{display:flex;gap:7px;align-items:center;font-size:13.5px;color:var(--ink)}
.cks{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:end}
.cks label{display:grid;gap:3px;font-size:12.5px;color:var(--muted)}
fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:8px;margin:0}
legend{font-size:12.5px;color:var(--muted);padding:0 4px}
#uLista{max-height:220px;overflow:auto}
input[type=checkbox]{accent-color:var(--brand);width:16px;height:16px}
.aviso{margin:0;font-size:13px;font-weight:600;color:var(--brand)}.aviso:empty{display:none}.aviso.bad{color:var(--bad)}
.btn.perigo{border-color:var(--bad);color:var(--bad);margin-left:auto}
details{border-bottom:1px solid var(--line);padding:8px 0}details summary{cursor:pointer;padding:4px 0}details .tbl{margin-top:8px}
#dlgUsu{width:min(560px,calc(100vw - 32px))}
/* dia a dia */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .sem{font-size:11.5px;color:var(--muted);text-align:center;font-weight:600}
.dia{border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:6px 8px;min-height:64px;display:grid;align-content:start;gap:1px;font-size:11.5px;color:var(--muted);overflow:hidden}
.dia b{font-size:14px;color:var(--ink)}
.dia.ok{border-left-color:var(--brand);background:var(--brand-soft)}.dia.ok span:first-of-type{color:var(--ink)}
.dia.vazio{border-left-color:var(--warn);background:var(--warn-soft)}
.dia.falta{border-left-color:var(--bad);background:var(--bad-soft)}.dia .f{color:var(--bad);font-weight:700}
.dia.dom{opacity:.7}.dia.fut{opacity:.4}
.dia .c{font-size:11px}
.legenda{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin:0}
.legenda i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:-6px;vertical-align:-1px}
.legenda i.l-ok{background:var(--brand)}.legenda i.l-vazio{background:var(--warn)}.legenda i.l-falta{background:var(--bad)}.legenda i.l-dom{background:var(--line)}
.legenda i.b1,.grafico .b1{background:var(--brand);fill:var(--brand)}.legenda i.b2,.grafico .b2{background:var(--info);fill:var(--info)}
.grafico{width:100%;height:auto;max-height:220px}.grafico text{fill:var(--muted);font-size:10px}
@media (max-width:640px){.dia{min-height:48px;padding:4px;font-size:10px}.dia span{display:none}.dia .f{display:block}}
#cfgCorpo{display:grid;gap:16px;min-width:0}#cfgCorpo>*{min-width:0}
/* central de operação e painel do contador */
:root{--ok:#1a7f5a;--ok-soft:#e3f4ec}
@media (prefers-color-scheme:dark){:root{--ok:#4cc29c;--ok-soft:#1b3129}}
#tela>.cab h1{font-size:22px;letter-spacing:-.01em}
.kpis4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi2{position:relative;padding:16px 18px;border-radius:12px;gap:4px}
.kpi2 .v{font-size:27px;letter-spacing:-.02em}.kpi2 .r{font-weight:600;padding-right:70px}
.kpi2 .tag{position:absolute;top:14px;right:14px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px}
.tag.up{background:var(--ok-soft);color:var(--ok)}.tag.dn{background:var(--bad-soft);color:var(--bad)}.tag.wn{background:var(--warn-soft);color:var(--warn)}
.g2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:grid;gap:16px;min-width:0}
section.card,.col>.card{border-radius:12px;padding:18px 20px;gap:14px}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}.ch>span{color:var(--muted);font-size:12.5px}
.leg{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}.d-ok{background:var(--ok)}.d-wn{background:#e3a008}.d-bad{background:var(--bad)}
.sema{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;max-height:430px;overflow:auto;padding:2px}
.scli{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:9px;padding:9px 11px;display:grid;gap:2px;background:var(--panel);min-width:0}
.scli b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scli span{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scli.n1{border-left-color:#e3a008;background:var(--warn-soft)}.scli.n1 b{color:var(--warn)}
.scli.n2{border-left-color:var(--bad);background:var(--bad-soft)}.scli.n2 b{color:var(--bad)}
.scli:hover{box-shadow:0 1px 4px rgba(0,0,0,.08)}.scli:focus-visible{outline:2px solid var(--brand)}
.tbl.sem{border:0;border-radius:0}.tbl.sem th{background:transparent;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.prazo{font-weight:700;font-size:12px;white-space:normal;min-width:110px}
td.b{font-weight:700;white-space:normal}
#pCorpo{display:grid;gap:16px;min-width:0}#pCorpo>*{min-width:0}
.vers{display:grid;gap:10px}.vers .l{display:grid;grid-template-columns:60px 1fr 30px;gap:10px;align-items:center}
.barra2{height:9px;border-radius:5px;background:var(--soft);overflow:hidden;position:relative}.barra2 i{display:block;height:100%;border-radius:5px}
.barra2.lin{overflow:visible;height:11px}.barra2.lin::after{content:"";position:absolute;left:75%;top:-3px;bottom:-3px;border-left:2px dashed var(--muted);opacity:.6}
.uso{list-style:none;margin:0;padding:0}.uso li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.uso li:last-child{border:0}
.lim{display:grid;gap:6px}
.lim .l{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,190px) 1fr auto;gap:14px;align-items:center;font-size:13px;padding:5px 6px;border-radius:7px}
.lim .l:hover{background:var(--soft)}.lim .l b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lim .v{white-space:nowrap}
.eco{display:grid;gap:2px}.eco .v{font-size:28px;font-weight:700;color:var(--ok);letter-spacing:-.02em}.eco .v::before{content:"R$ "}
.alertas{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.alertas li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.alertas li:hover{background:var(--soft)}.alertas b{display:block;font-size:13px}.alertas li>div>span{color:var(--muted);font-size:12.5px}
.ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800}
.ic.bad{background:var(--bad-soft);color:var(--bad)}.ic.warn{background:var(--warn-soft);color:var(--warn)}.ic.info{background:var(--info-soft);color:var(--info)}
.fech{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.fech div{border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;display:grid}.fech .v{font-size:24px;font-weight:700}
.fl{list-style:none;margin:0;padding:0;max-height:230px;overflow:auto}.fl li{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}.fl li:hover{background:var(--soft)}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:10px}.minis div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px}.minis .r{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.minis b{font-size:17px}
@media (max-width:1000px){.kpis4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.kpis4{grid-template-columns:minmax(0,1fr)}.lim .l{grid-template-columns:1fr;gap:4px}.fech{gap:6px}}
@media (prefers-reduced-motion:reduce){.giro{animation:none}}
#sCorpo{display:grid;gap:16px;min-width:0}#sCorpo>*{min-width:0}
.srvt td{vertical-align:top}.srvt .sub{display:block;font-size:11.5px}
.chave{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chave input{width:16px;height:16px;accent-color:var(--brand)}
.evl{list-style:none;margin:0;padding:0}.evl li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.evl li:last-child{border:0}
.evl .q{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}.evl .x{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
@media (max-width:700px){.evl li{grid-template-columns:1fr}}
</style>
</head>
<body>

<section id="login">
  <form class="caixa" id="fLogin" autocomplete="on">
    <div class="marca"><div class="selo">CP</div><div><b>Portal Contábil</b><span>XML e resumos fiscais dos clientes · CPUSIS</span></div></div>
    <label for="lg">Login<input id="lg" type="text" autocomplete="username" required></label>
    <label for="sn">Senha<input id="sn" type="password" autocomplete="current-password" required></label>

<script>
/* ---------------- endereço do receptor (usado quando o portal abre pelo GitHub) ---------------- */
var API_URL = 'https://script.google.com/macros/s/AKfycbwySsHymDOemTCxV-Oe-j4B0xHK1OIOtBDF-KjIdhHA0cf9YmLoUcP3AnRVpgW1AZLU/exec';

var APARENCIA_ATUAL = null;
if (typeof APARENCIA === 'undefined') { try { APARENCIA = JSON.parse(localStorage.getItem('farol_aparencia') || 'null'); } catch (e) { APARENCIA = null; } }
/* ---------------- aparência (aba "Aparência" da planilha) ---------------- */
function aplicarAparencia(A) {
  A = A || {}; APARENCIA_ATUAL = A;
  var rgb = function (h) { var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  var tinta = function (h) { var c = rgb(h).map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) > 0.45 ? '#0b1512' : '#ffffff'; };
  var css = '';
  if (A.cor) { var c = rgb(A.cor); css += ':root{--brand:' + A.cor + ';--brand-ink:' + tinta(A.cor) + ';--brand-soft:rgba(' + c.join(',') + ',.12)' + (A.fundo ? ';--bg:' + A.fundo : '') + '}'; }
  if (A.corEscura) { var d = rgb(A.corEscura); css += '@media (prefers-color-scheme:dark){:root{--brand:' + A.corEscura + ';--brand-ink:' + tinta(A.corEscura) + ';--brand-soft:rgba(' + d.join(',') + ',.18);--bg:#0f1513}}'; }
  if (css) { var s = document.createElement('style'); s.textContent = css; document.head.appendChild(s); }
  var nome = A.nome || 'Portal Contábil';
  document.title = nome;
  document.querySelectorAll('.marca b').forEach(function (b) { b.textContent = nome; });
  document.querySelectorAll('.marca span').forEach(function (s) { if (A.subtitulo) s.textContent = A.subtitulo; });
  document.querySelectorAll('.selo').forEach(function (s) {
    if (A.logo) { s.classList.add('img'); s.textContent = ''; var i = document.createElement('img'); i.src = A.logo; i.alt = nome; s.appendChild(i); }
    else if (A.sigla) { s.textContent = A.sigla; }
  });
  if (A.login) document.getElementById('msgLogin').textContent = A.login;
  if (A.suporte) { document.getElementById('suporteLogin').textContent = 'Suporte: ' + A.suporte; document.getElementById('rodape').textContent = 'Suporte: ' + A.suporte; }
}
aplicarAparencia((typeof APARENCIA !== 'undefined' && APARENCIA) || { nome: 'Farol Contábil' });
</script>
<script>
/* ---------------- infraestrutura ---------------- */
var TOKEN = null, DADOS = null, ATUAL = null, RESUMO = null;
var NAV_CONTA = 0;   // muda quando a pessoa clica em algo (não redesenha a tela por cima dela)
document.addEventListener('click', function () { NAV_CONTA++; }, true);
try { TOKEN = sessionStorage.getItem('portal_token'); } catch (e) {}
function guardarToken(t) { TOKEN = t; try { if (t) sessionStorage.setItem('portal_token', t); else sessionStorage.removeItem('portal_token'); } catch (e) {} }

function chamar(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (MODO_WEB) {   // aberto pelo GitHub: conversa com o receptor por POST
    return fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ acao: 'portal', fn: fn, args: args }) })
      .then(function (r) { if (!r.ok) throw new Error('Servidor respondeu ' + r.status + '. Tente de novo.'); return r.json(); })
      .catch(function (e) { throw new Error(/Failed to fetch|NetworkError|Load failed/i.test(e.message) ? 'Sem conexão com o servidor. Confira a internet e tente de novo.' : e.message); })
      .then(function (j) {
        if (j && j.ok) return j.r;
        var msg = (j && j.erro) || 'Erro desconhecido';
        if (/SESSAO_EXPIRADA/.test(msg)) sair(true);
        throw new Error(msg.replace(/^Exception:\s*/, ''));
      });
  }
  return new Promise(function (ok, falha) {
    google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) {
      var msg = (e && e.message) || String(e);
      if (/SESSAO_EXPIRADA/.test(msg)) { sair(true); }
      falha(new Error(msg.replace(/^Exception:\s*/, '')));
    })[fn].apply(null, args);
  });
}
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function brl(v) { return Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function int(v) { return Number(v || 0).toLocaleString('pt-BR'); }
function qtd(v) { return Number(v || 0).toLocaleString('pt-BR', { maximumFractionDigits: 3 }); }
function pct(v) { return Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%'; }
function aliq(v) { return Number(v || 0) ? Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + '%' : '—'; }
var MES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function nomeMes(m) { return MES[Number(m.slice(5, 7)) - 1] + ' de ' + m.slice(0, 4); }
function dataBR(s) { return s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : ''; }
function carregando(txt) { return '<div class="card carregando"><div class="giro"></div>' + esc(txt) + '</div>'; }
function rotuloUnid(u) { return u.cliente + (u.subpasta ? ' · ' + u.subpasta : ''); }

/* ---------------- login ---------------- */
$('fLogin').addEventListener('submit', function (ev) {
  ev.preventDefault();
  $('bEntrar').disabled = true; $('eLogin').textContent = '';
  chamar('portalLogin', $('lg').value, $('sn').value).then(function (r) {
    $('bEntrar').disabled = false;
    if (!r.ok) { $('eLogin').textContent = r.erro; return; }

});
$('bSair').addEventListener('click', function () { sair(false); });
// apaga tudo o que foi carregado na sessão (nada de um login pode aparecer para o próximo)
function limparSessao() {
  DADOS = null; ATUAL = null; RESUMO = null; SEL = {}; IND = {}; BUSCA = null; CFG = null; CFG_ABA = 'logins';
  PST = { mes: null, contab: '', regime: null };
  if ($('tela')) $('tela').innerHTML = '';
  if ($('quem')) $('quem').textContent = '';
  if ($('navCfg')) $('navCfg').classList.add('hidden');
  if ($('navCentral')) $('navCentral').classList.add('hidden');
  if ($('navSrv')) $('navSrv').classList.add('hidden');
  SRV = null;
}
function sair(expirou) {
  if (TOKEN && !expirou) { try { chamar('portalSair', TOKEN).catch(function () {}); } catch (e) {} }
  try { sessionStorage.removeItem('portal_dados'); } catch (e) {}
  guardarToken(null); limparSessao();
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  if (expirou) $('eLogin').textContent = 'Sua sessão expirou. Entre de novo.';
}

function iniciar() {
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  var mostrar = function (d) { DADOS = d; $('quem').textContent = d.nome; $('navCfg').classList.toggle('hidden', !d.admin); $('navCentral').classList.toggle('hidden', !d.admin); $('navSrv').classList.toggle('hidden', !d.admin); if (d.admin) telaCentral(); else telaPainel(); };
  // abre na hora com o que já foi carregado nesta sessão e atualiza por baixo
  var guardado = null; try { var g = JSON.parse(sessionStorage.getItem('portal_dados') || 'null'); if (g && g.token === TOKEN) guardado = g.d; } catch (e) {}
  if (guardado) mostrar(guardado); else $('tela').innerHTML = carregando('Carregando seus clientes…');
  var navAntes = NAV_CONTA;
  chamar('portalDados', TOKEN).then(function (d) {
    try { sessionStorage.setItem('portal_dados', JSON.stringify({ token: TOKEN, d: d })); } catch (e) {}
    if (!guardado) mostrar(d);
    else { DADOS = d; if (NAV_CONTA === navAntes && JSON.stringify(d) !== JSON.stringify(guardado)) mostrar(d); }
  }).catch(function (e) { if (!guardado) $('tela').innerHTML = '<div class="card erro">' + esc(e.message) + '</div>'; });
}
if (TOKEN) setTimeout(iniciar, 0);   // depois de todo o script carregar
// aberto pelo GitHub: busca a aparência atual da planilha e guarda para abrir já pronto da próxima vez
if (MODO_WEB) chamar('portalAparencia').then(function (ap) {
  try { localStorage.setItem('farol_aparencia', JSON.stringify(ap)); } catch (e) {}
  if (JSON.stringify(ap) !== JSON.stringify(APARENCIA_ATUAL)) aplicarAparencia(ap);
}).catch(function () {});
document.querySelector('.nav').addEventListener('click', function (ev) { var b = ev.target.closest('button'); if (!b || !DADOS) return; if (b.dataset.t === 'central') telaCentral(); else if (b.dataset.t === 'painel') telaPainel(); else if (b.dataset.t === 'config') telaConfig(); else if (b.dataset.t === 'servidores') telaServidores(); else telaLista(); });
function marcarNav(t) { document.querySelectorAll('.nav button').forEach(function (b) { if (b.dataset.t === t) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); }); }

/* ---------------- tela 1: clientes ---------------- */
var SEL = {};   // clientes marcados para baixar (índice em DADOS.unidades)
function telaLista() {
  marcarNav('clientes'); ATUAL = null; RESUMO = null;
  var contabs = []; DADOS.unidades.forEach(function (u) { if (contabs.indexOf(u.contabilidade) < 0) contabs.push(u.contabilidade); });
  var html = '<div class="cab"><div><h1>Clientes</h1><p class="sub">Clique no cliente para ver o resumo fiscal. Marque vários para baixar os XML de uma vez.</p></div></div>' +
    '<div class="filtros">' +
    (contabs.length > 1 ? '<label for="fContab">Contabilidade<select id="fContab"><option value="">Todas</option>' + contabs.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('') + '</select></label>' : '') +
    '<label for="fBusca">Buscar cliente<input id="fBusca" type="search" placeholder="Nome do cliente"></label></div>' +
    '<div id="barraLote" class="card lote hidden"></div>' +
    '<div id="listaCli"></div><div id="progLote"></div>';

    var fc = $('fContab') ? $('fContab').value : '', fb = ($('fBusca').value || '').toUpperCase();
    visiveis = DADOS.unidades.filter(function (u) { return (!fc || u.contabilidade === fc) && (!fb || rotuloUnid(u).toUpperCase().indexOf(fb) >= 0); });
    if (!visiveis.length) { $('listaCli').innerHTML = '<div class="card vazio">Nenhum cliente com resumo disponível ainda.</div>'; barraLote(); return; }
    var todos = visiveis.every(function (u) { return SEL[DADOS.unidades.indexOf(u)]; });
    $('listaCli').innerHTML = '<div class="tbl"><table><thead><tr><th class="ck"><input type="checkbox" id="ckTodos" aria-label="Marcar todos"' + (todos ? ' checked' : '') + '></th><th>Contabilidade</th><th>Cliente</th><th>Último mês</th><th>Meses disponíveis</th><th>Último envio</th><th>Situação</th></tr></thead><tbody>' +
      visiveis.map(function (u) {
        var i = DADOS.unidades.indexOf(u), ult = u.meses[0];
        var p = DADOS.painel[norm(u.contabilidade) + '|' + norm(u.cliente + (u.subpasta ? ' / ' + u.subpasta : '')) + '|' + ult] || DADOS.painel[norm(u.contabilidade) + '|' + norm(u.cliente) + '|' + ult] || {};
        return '<tr class="cli" tabindex="0" data-i="' + i + '"><td class="ck"><input type="checkbox" class="ckCli" data-i="' + i + '" aria-label="Marcar ' + esc(rotuloUnid(u)) + '"' + (SEL[i] ? ' checked' : '') + '></td><td>' + esc(u.contabilidade) + '</td><td><b>' + esc(rotuloUnid(u)) + '</b></td><td>' + esc(nomeMes(ult)) + '</td><td class="n">' + u.meses.length +
          '</td><td>' + (p.ultimoContato ? new Date(p.ultimoContato).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '—') + '</td><td>' + pillSituacao(p.situacao) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    barraLote();
  };
  if ($('fContab')) $('fContab').addEventListener('change', desenhar);
  $('fBusca').addEventListener('input', desenhar);
  $('listaCli').addEventListener('click', function (ev) {
    if (ev.target.id === 'ckTodos') { var v = ev.target.checked; visiveis.forEach(function (u) { var i = DADOS.unidades.indexOf(u); if (v) SEL[i] = true; else delete SEL[i]; }); desenhar(); return; }
    if (ev.target.classList.contains('ckCli')) { var k = +ev.target.dataset.i; if (ev.target.checked) SEL[k] = true; else delete SEL[k]; barraLote(); return; }

  $('listaCli').addEventListener('keydown', function (ev) { var tr = ev.target.closest('tr.cli'); if (tr && ev.key === 'Enter' && !ev.target.classList.contains('ckCli')) abrir(DADOS.unidades[+tr.dataset.i], null); });
  desenhar();

/* ---------- download em lote ---------- */
function marcados() { return Object.keys(SEL).map(Number).sort(function (a, b) { return rotuloUnid(DADOS.unidades[a]).localeCompare(rotuloUnid(DADOS.unidades[b]), 'pt-BR'); }).map(function (i) { return DADOS.unidades[i]; }); }
function barraLote() {
  var b = $('barraLote'); if (!b) return;

  if (!us.length) { b.classList.add('hidden'); b.innerHTML = ''; return; }
  var meses = []; us.forEach(function (u) { u.meses.forEach(function (m) { if (meses.indexOf(m) < 0) meses.push(m); }); });
  meses.sort().reverse();

  b.classList.remove('hidden');
  b.innerHTML = '<div class="lote-l"><b>' + us.length + ' cliente(s) marcado(s)</b><button class="lnk" type="button" id="bLimpar">limpar</button></div>' +
    '<label for="fMesLote" class="sub">Mês&nbsp;<select id="fMesLote">' + meses.map(function (m) { return '<option value="' + m + '"' + (m === anterior ? ' selected' : '') + '>' + nomeMes(m) + '</option>'; }).join('') + '</select></label>' +
    (podePasta ? '<button class="btn" type="button" id="bLotePasta">Baixar para uma pasta…</button>' : '') +
    '<button class="btn' + (podePasta ? ' sec' : '') + '" type="button" id="bLoteUm">Baixar um por um</button>' +
    '<button class="btn sec" type="button" id="bLoteZip">Baixar tudo em um ZIP</button>';
  $('bLimpar').onclick = function () { SEL = {}; telaLista(); };
  if (podePasta) $('bLotePasta').onclick = function () { baixarLote('pasta'); };
  $('bLoteUm').onclick = function () { baixarLote('um'); };
  $('bLoteZip').onclick = function () { baixarLote('zip'); };
}

function baixarPartes(f, aoAvancar) {
  var partes = [], i = 0;
  var proxima = function () {
    aoAvancar(i / f.partes);
    if (i >= f.partes) return Promise.resolve(partes);
    return chamar('portalParte', TOKEN, f.id, i).then(function (b64) {
      var bin = atob(b64), arr = new Uint8Array(bin.length);
      for (var k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
      partes.push(arr); i++; return proxima();
    });
  };
  return proxima();
}
function nomeArquivoLote(u, mes) { return (rotuloUnid(u).replace(/ · /g, ' - ') + ' - XML ' + mes.slice(5, 7) + '.' + mes.slice(0, 4) + '.zip').replace(/[\\/:*?"<>|]/g, '-'); }

function baixarLote(modo) {
  var us = marcados(), mes = $('fMesLote').value, pasta = null, zipSaida = null, semPasta = false;
  var botoes = ['bLotePasta', 'bLoteUm', 'bLoteZip'].map($).filter(Boolean);
  var travar = function (v) { botoes.forEach(function (b) { b.disabled = v; }); };
  var prog = $('progLote');
  prog.innerHTML = '<div class="card"><h2>Baixando ' + nomeMes(mes) + '</h2><div class="tbl"><table><thead><tr><th>Cliente</th><th>Arquivo</th><th class="n">Tamanho</th><th>Situação</th></tr></thead><tbody>' +
    us.map(function (u, k) { return '<tr><td>' + esc(rotuloUnid(u)) + '</td><td class="m" id="lnome' + k + '">—</td><td class="n" id="ltam' + k + '"></td><td id="lst' + k + '"><span class="pill info">na fila</span></td></tr>'; }).join('') +
    '</tbody></table></div><p class="nota" id="lresumo"></p></div>';
  prog.scrollIntoView({ behavior: 'smooth', block: 'start' });
  var st = function (k, html) { $('lst' + k).innerHTML = html; };
  var ok = 0, falhas = 0, totalBytes = 0;
  var inicio = Promise.resolve();
  if (modo === 'pasta') {
    inicio = window.showDirectoryPicker({ mode: 'readwrite' }).then(function (h) { pasta = h; }).catch(function (e) {
      if (e && e.name === 'AbortError') throw e;
      $('lresumo').textContent = 'O navegador não permitiu escolher a pasta aqui; os arquivos vão para a pasta de Downloads.';
      modo = 'um'; semPasta = true;
    });
  }
  if (modo === 'zip') zipSaida = novoZip();
  travar(true);
  var k = 0;
  var proximo = function () {
    if (k >= us.length) return Promise.resolve();
    var idx = k++, u = us[idx];
    if (u.meses.indexOf(mes) < 0) { st(idx, '<span class="pill warn">sem XML neste mês</span>'); falhas++; return proximo(); }
    st(idx, '<span class="pill info">localizando…</span>');
    return chamar('portalArquivo', TOKEN, u.contabilidade, u.cliente, u.subpasta, mes).then(function (f) {
      var nome = nomeArquivoLote(u, mes);
      $('lnome' + idx).textContent = nome; $('ltam' + idx).textContent = Math.round(f.tamanho / 1024).toLocaleString('pt-BR') + ' KB';
      return baixarPartes(f, function (p) { st(idx, '<span class="pill info">baixando ' + Math.round(100 * p) + '%</span>'); }).then(function (partes) {
        var blob = new Blob(partes, { type: 'application/zip' });
        totalBytes += blob.size;
        if (modo === 'zip') { return blob.arrayBuffer().then(function (ab) { zipSaida.add(nome, new Uint8Array(ab)); }); }
        if (modo === 'pasta') { return pasta.getFileHandle(nome, { create: true }).then(function (fh) { return fh.createWritable(); }).then(function (w) { return w.write(blob).then(function () { return w.close(); }); }); }
        baixarBlob(blob, nome); return new Promise(function (r) { setTimeout(r, 700); });
      }).then(function () { ok++; st(idx, '<span class="pill">concluído</span>'); });
    }).catch(function (e) { falhas++; st(idx, '<span class="pill bad">' + esc(e.message) + '</span>'); }).then(proximo);
  };
  inicio.then(proximo).then(function () {
    if (modo === 'zip' && ok) baixarBlob(zipSaida.gerar(), ('XML ' + mes.slice(5, 7) + '.' + mes.slice(0, 4) + ' - ' + ok + ' clientes.zip'));
    $('lresumo').textContent = ok + ' de ' + us.length + ' cliente(s) baixado(s)' + (falhas ? ' · ' + falhas + ' sem arquivo ou com erro' : '') +
      ' · ' + Math.round(totalBytes / 1048576).toLocaleString('pt-BR') + ' MB' + (modo === 'pasta' ? ' · salvos na pasta escolhida.' : (modo === 'zip' ? ' · um único ZIP com o arquivo de cada cliente dentro.' : ' · salvos na pasta de downloads do navegador' + (semPasta ? ' (este navegador não deixou escolher outra pasta).' : '.')));
    travar(false);
  }).catch(function (e) { travar(false); if (!(e && e.name === 'AbortError')) $('lresumo').textContent = e.message; else prog.innerHTML = ''; });
}

/* ZIP simples (sem compressão: os arquivos já são ZIP) montado no navegador */
var CRC_T = (function () { var t = new Uint32Array(256); for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { var c = 0xFFFFFFFF; for (var i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function novoZip() {
  var itens = [];
  return {
    add: function (nome, dados) { itens.push({ nome: new TextEncoder().encode(nome), dados: dados, crc: crc32(dados) }); },
    gerar: function () {
      var partes = [], central = [], pos = 0;
      var dt = new Date(), dosT = (dt.getHours() << 11) | (dt.getMinutes() << 5) | (dt.getSeconds() >> 1), dosD = ((dt.getFullYear() - 1980) << 9) | ((dt.getMonth() + 1) << 5) | dt.getDate();
      itens.forEach(function (it) {
        var h = new DataView(new ArrayBuffer(30));

/* ---------------- dia a dia (calendário do mês) ---------------- */
var SEMANA = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
function diasDoResumo() {
  var mes = ATUAL.mes, l = (RESUMO.porDia || []).filter(function (d) { return d.dia.slice(0, 7) === mes; });
  return { dias: l, fora: (RESUMO.porDia || []).filter(function (d) { return d.dia.slice(0, 7) !== mes; }), sistema: !!RESUMO.comSistema, fonte: 'resumo' };
}
function diasDosXml() {   // monta a partir dos XML do mês já carregados na busca
  var m = {}, fora = 0;
  BUSCA.docs.forEach(function (d) {
    if (d.mes !== ATUAL.mes || ['nfe', 'nfce', 'compra'].indexOf(d.tipo) < 0 || !d.data) return;
    if (d.data.slice(0, 7) !== ATUAL.mes) { fora++; return; }
    var x = m[d.data] = m[d.data] || { dia: d.data, nfe: 0, nfce: 0, compras: 0, canc: 0, vNfe: 0, vNfce: 0, vCompras: 0 };
    if (d.sit === 'Cancelada') x.canc++;
    if (d.tipo === 'nfce') { x.nfce++; x.vNfce += d.valor; } else if (d.tipo === 'compra') { x.compras++; x.vCompras += d.valor; } else { x.nfe++; x.vNfe += d.valor; }
  });
  return { dias: Object.keys(m).sort().map(function (k) { return m[k]; }), fora: fora ? [{ compras: fora }] : [], sistema: false, fonte: 'xml' };
}

function telaDias(c) {
  if (RESUMO.porDia) { desenharDias(c, diasDoResumo()); return; }
  var u = ATUAL.u, ck = chaveUnid(u.contabilidade, rotuloPainel(u));
  if (BUSCA && BUSCA.ck === ck && BUSCA.meses[ATUAL.mes] && BUSCA.meses[ATUAL.mes].carregado) { desenharDias(c, diasDosXml()); return; }
  c.innerHTML = '<div class="card"><h2>Dia a dia</h2><p class="nota">Este resumo foi gerado por uma versão anterior do programa, que ainda não guardava a contagem por dia. ' +
    'Ela passa a vir pronta depois da próxima sincronização. Enquanto isso, dá para montar agora a partir dos XML do mês.</p>' +
    '<div class="ferr"><button class="btn" type="button" id="dMontar">Montar pelos XML do mês</button><div class="barra hidden" id="dBarra"><i></i></div><span class="sub" id="dInfo"></span></div></div>';
  $('dMontar').addEventListener('click', function () {
    if (!BUSCA || BUSCA.ck !== ck) BUSCA = { ck: ck, meses: {}, docs: [], porChave: {}, sel: {}, ord: 'data', asc: false, cnpj: RESUMO && RESUMO.cnpj };
    $('dMontar').disabled = true;
    var info = function (t, p) { if (!$('dInfo')) return; $('dInfo').textContent = t; var b = $('dBarra'); if (p == null) b.classList.add('hidden'); else { b.classList.remove('hidden'); b.firstChild.style.width = (100 * p) + '%'; } };
    carregarMesBusca(u, ATUAL.mes, info).then(function () { if (ATUAL && ATUAL.aba === 'dias' && $('conteudo')) desenharDias($('conteudo'), diasDosXml()); })
      .catch(function (e) { info(e.message, null); if ($('dMontar')) $('dMontar').disabled = false; });
  });
}

function desenharDias(c, D) {
  var mes = ATUAL.mes, ano = +mes.slice(0, 4), m = +mes.slice(5, 7), nDias = new Date(ano, m, 0).getDate();
  var hoje = new Date(), hojeTxt = hoje.getFullYear() + '-' + ('0' + (hoje.getMonth() + 1)).slice(-2) + '-' + ('0' + hoje.getDate()).slice(-2);
  var por = {}; D.dias.forEach(function (d) { por[d.dia] = d; });
  var cel = [], diasCom = 0, diasSem = [], faltamTot = 0, diasFalta = [], maxDocs = 1, serie = [];
  for (var i = 1; i <= nDias; i++) {
    var dia = mes + '-' + ('0' + i).slice(-2), d = por[dia] || { nfe: 0, nfce: 0, compras: 0, canc: 0 };
    var emit = d.nfe + d.nfce, futuro = dia > hojeTxt, dow = new Date(ano, m - 1, i).getDay();
    var falta = Math.max(0, (d.sisNfe || 0) - (d.sisNfeXml || 0)) + Math.max(0, (d.sisNfce || 0) - (d.sisNfceXml || 0));
    if (emit) diasCom++; else if (!futuro) diasSem.push(i);
    if (falta) { faltamTot += falta; diasFalta.push(i); }
    maxDocs = Math.max(maxDocs, emit);
    serie.push({ i: i, nfe: d.nfe, nfce: d.nfce, futuro: futuro });
    var cls = futuro ? 'fut' : (falta ? 'falta' : (emit ? 'ok' : (dow === 0 ? 'dom' : 'vazio')));
    var tip = dataBR(dia) + ' · NF-e ' + d.nfe + (d.vNfe ? ' (R$ ' + brl(d.vNfe) + ')' : '') + ' · NFC-e ' + d.nfce + (d.vNfce ? ' (R$ ' + brl(d.vNfce) + ')' : '') + ' · compras ' + d.compras +
      (D.sistema ? ' · no sistema: ' + (d.sisNfe || 0) + ' NF-e / ' + (d.sisNfce || 0) + ' NFC-e' : '');
    cel.push('<div class="dia ' + cls + '" title="' + esc(tip) + '"' + (i === 1 ? ' style="grid-column-start:' + (dow + 1) + '"' : '') + '><b>' + i + '</b>' +
      (futuro ? '' : '<span>' + (d.nfe ? d.nfe + ' NF-e' : '') + (d.nfe && d.nfce ? ' · ' : '') + (d.nfce ? d.nfce + ' NFC-e' : '') + (!emit ? 'nenhum XML' : '') + '</span>' +
        (d.compras ? '<span class="c">' + d.compras + ' compra' + (d.compras > 1 ? 's' : '') + '</span>' : '') +
        (falta ? '<span class="f">faltam ' + falta + ' XML</span>' : '') + (d.canc ? '<span class="c">' + d.canc + ' cancelada' + (d.canc > 1 ? 's' : '') + '</span>' : '')) + '</div>');
  }
  var foraCompras = D.fora.reduce(function (a, x) { return a + (x.compras || 0); }, 0);
  var resumoTxt = '<b>' + diasCom + '</b> dia(s) com notas emitidas' + (diasSem.length ? ' · <b>' + diasSem.length + '</b> dia(s) sem nenhum XML emitido: ' + diasSem.join(', ') : ' · nenhum dia sem XML até hoje') + '.';
  var alerta = '';
  if (D.sistema) alerta = faltamTot ? '<p class="aviso bad">O sistema (LC) tem ' + faltamTot + ' documento(s) sem XML ' + (diasFalta.length > 1 ? 'nos dias ' : 'no dia ') + diasFalta.join(', ') + '. Podem ser notas em digitação, rejeitadas ou ainda não transmitidas: confira no sistema.</p>'
    : '<p class="aviso">Conferido com o banco do LC: todos os documentos do sistema estão com XML.</p>';
  else alerta = '<p class="nota">' + (D.fonte === 'xml' ? 'Montado agora pelos XML do mês. ' : '') + 'Este cliente não é conferido com o banco do sistema (envio manual ou versão antiga do programa): o calendário mostra o que chegou de XML, dia por dia.</p>';
  // gráfico de barras (SVG)
  var W = 760, H = 150, bw = W / nDias, esc2 = function (v) { return (H - 22) * v / maxDocs; };
  var barras = serie.map(function (s) {
    var x = (s.i - 1) * bw + 2, h1 = esc2(s.nfe), h2 = esc2(s.nfce), y0 = H - 18;
    return (s.futuro ? '' : '<rect class="b2" x="' + x + '" y="' + (y0 - h2) + '" width="' + (bw - 4) + '" height="' + h2 + '"><title>dia ' + s.i + ': ' + s.nfce + ' NFC-e</title></rect>' +
      '<rect class="b1" x="' + x + '" y="' + (y0 - h2 - h1) + '" width="' + (bw - 4) + '" height="' + h1 + '"><title>dia ' + s.i + ': ' + s.nfe + ' NF-e</title></rect>') +
      ((s.i === 1 || s.i % 5 === 0) ? '<text x="' + (x + (bw - 4) / 2) + '" y="' + (H - 4) + '" text-anchor="middle">' + s.i + '</text>' : '');
  }).join('');
  c.innerHTML = '<div class="card"><div class="cab"><h2>Dia a dia · ' + esc(nomeMes(mes)) + '</h2><span class="legenda"><i class="l-ok"></i>com XML <i class="l-vazio"></i>sem XML <i class="l-falta"></i>faltando XML <i class="l-dom"></i>domingo sem movimento</span></div>' +
      '<p>' + resumoTxt + '</p>' + alerta +
      '<div class="cal">' + SEMANA.map(function (s) { return '<div class="sem">' + s + '</div>'; }).join('') + cel.join('') + '</div>' +
      (foraCompras ? '<p class="nota">' + foraCompras + ' nota(s) de compra lançadas neste mês foram emitidas pelo fornecedor em outro mês (não aparecem no calendário).</p>' : '') + '</div>' +
    '<div class="card"><h2>Documentos emitidos por dia</h2><svg class="grafico" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Notas emitidas por dia">' + barras + '</svg>' +
      '<p class="legenda"><i class="b1"></i>NF-e <i class="b2"></i>NFC-e</p></div>' +
    '<div class="ferr"><button class="btn sec" type="button" id="bCsvDias">Exportar dia a dia (CSV)</button></div><div id="tDias"></div>';
  var linhas = D.dias.filter(function (d) { return d.dia.slice(0, 7) === mes; }).map(function (d) {
    var y = {}; for (var k in d) y[k] = d[k];
    y.semXml = D.sistema ? Math.max(0, (d.sisNfe || 0) - (d.sisNfeXml || 0)) + Math.max(0, (d.sisNfce || 0) - (d.sisNfceXml || 0)) : null;
    y.semana = SEMANA[new Date(+d.dia.slice(0, 4), +d.dia.slice(5, 7) - 1, +d.dia.slice(8, 10)).getDay()];
    return y;
  });
  var cols = COL.dias.filter(function (x) { return D.sistema || ['sisNfe', 'sisNfce', 'semXml'].indexOf(x[0]) < 0; });
  var t = tabela($('tDias'), cols, linhas, 'dia', true);
  $('bCsvDias').addEventListener('click', function () { csv(cols, t.linhas(), (rotuloUnid(ATUAL.u) + ' ' + mes + ' dia a dia').replace(/[\\/:*?"<>|]/g, '-') + '.csv'); });
}

  $('fMes').addEventListener('change', function () { abrir(u, this.value); });
  $('bZip').addEventListener('click', baixarZip);
  document.querySelector('.abas').addEventListener('click', function (ev) { var b = ev.target.closest('.tab'); if (!b) return; ATUAL.aba = b.dataset.a; document.querySelectorAll('.tab').forEach(function (x) { x.setAttribute('aria-selected', x === b); }); desenharAba(); });
  desenharAba();
}
function regimeCliente(u) {
  var r = IND[ATUAL.mes]; if (!r) return '';
  var x = r.itens.filter(function (i) { return i.contabilidade === u.contabilidade && i.cliente === u.cliente && (i.subpasta || '') === (u.subpasta || ''); })[0];
  if (!x || x.erro) return '';
  var inf = DADOS.regimes && DADOS.regimes[chaveUnid(u.contabilidade, rotuloPainel(u))];
  return pillReg(inf || x.regime, inf ? 'informado na planilha' : x.regimeFonte);
}
function somaSaidas(k) { return (RESUMO.tributacao || []).filter(function (x) { return x.es === 'S' && x.origem !== 'Compras'; }).reduce(function (a, x) { return a + (x[k] || 0); }, 0); }
function kpi(r, v, d) { return '<div class="kpi"><span class="r">' + esc(r) + '</span><span class="v">' + esc(v) + '</span><span class="d">' + esc(d) + '</span></div>'; }

var COL = {
  trib: [['origem','Origem'],['es','E/S'],['cfop','CFOP','m'],['cst','CST/CSOSN','m'],['aliq','Alíq. ICMS','aliq'],['itens','Itens','int',1],['valor','Valor contábil','brl',1],['vBC','BC ICMS','brl',1],['vICMS','ICMS','brl',1],['vBCST','BC ST','brl',1],['vST','ICMS ST','brl',1],['vIPI','IPI','brl',1],['vPIS','PIS','brl',1],['vCOFINS','COFINS','brl',1],['vIBS','IBS','brl',1],['vCBS','CBS','brl',1]],
  ncm: [['origem','Origem'],['ncm','NCM','m'],['cest','CEST','m'],['cst','CST/CSOSN','m'],['cstPis','CST PIS','m'],['cfops','CFOPs','m'],['produtos','Produtos','int',1],['itens','Itens','int',1],['valor','Valor','brl',1],['vICMS','ICMS','brl',1],['vST','ICMS ST','brl',1],['vPIS','PIS','brl',1],['vCOFINS','COFINS','brl',1]],
  pis: [['origem','Origem'],['cstPis','CST PIS','m'],['cstCofins','CST COFINS','m'],['itens','Itens','int',1],['valor','Valor','brl',1],['vPIS','PIS','brl',1],['vCOFINS','COFINS','brl',1]],
  prod: [['origem','Origem'],['codigo','Código','m'],['descricao','Descrição','w'],['ncm','NCM','m'],['cst','CST/CSOSN','m'],['un','Un'],['qtd','Quantidade','qtd',1],['valor','Valor','brl',1],['itens','Itens','int',1]],
  dev: [['tipo','Tipo','w'],['numero','Número','int'],['serie','Série'],['data','Data','data'],['cfop','CFOP','m'],['participante','Participante','w'],['documento','CNPJ/CPF','m'],['valor','Valor','brl',1],['chave','Chave','m'],['referencia','NF referenciada','m']],
  canc: [['origem','Origem'],['modelo','Modelo'],['serie','Série'],['numero','Número','int'],['data','Data','data'],['valor','Valor','brl',1],['chave','Chave','m']],
  inut: [['modelo','Modelo'],['serie','Série'],['inicio','De','int'],['fim','Até','int'],['justificativa','Justificativa','w'],['protocolo','Protocolo','m']],
  falha: [['modelo','Modelo'],['serie','Série'],['de','De','int'],['ate','Até','int'],['quantidade','Qtd. números','int',1]],
  pag: [['origem','Origem'],['forma','Forma de pagamento'],['tPag','Código','m'],['qtd','Ocorrências','int',1],['valor','Valor','brl',1],['part','% do total','pct']],
  dash: [['rotulo','Cliente','w'],['contabilidade','Contabilidade'],['regimeNome','Regime','reg'],['vendas','Vendas','brl',1],['devVenda','Devol. de venda','brl',1],['compras','Compras','brl',1],['icms','ICMS próprio','brl',1],['st','ICMS ST','brl',1],['pisCofins','PIS+COFINS','brl',1],['nfeQtd','NF-e','int',1],['nfceQtd','NFC-e','int',1],['cancQtd','Cancelados','int',1],['falhas','Falhas numeração','int',1],['dias','Dias sem enviar','int']],
  dias: [['dia','Dia','data'],['semana','Semana'],['nfe','NF-e','int',1],['nfce','NFC-e','int',1],['compras','Compras','int',1],['canc','Canceladas','int',1],['vNfe','Valor NF-e','brl',1],['vNfce','Valor NFC-e','brl',1],['vCompras','Valor compras','brl',1],['sisNfe','NF-e no sistema','int',1],['sisNfce','NFC-e no sistema','int',1],['semXml','Sem XML no sistema','int',1]],
  xml: [['tipoNome','Tipo'],['num','Número','m'],['serie','Série'],['data','Data','data'],['mes','Mês'],['emitNome','Emitente'],['emitDoc','CNPJ/CPF emitente','m'],['destNome','Destinatário'],['destDoc','CNPJ/CPF destinatário','m'],['valor','Valor','brl'],['sit','Situação'],['chave','Chave de acesso','m'],['nProt','Protocolo','m'],['arquivo','Arquivo']]
};
var ABAS = [
  { id: 'dias', nome: 'Dia a dia' }, { id: 'trib', nome: 'Tributação' }, { id: 'ncm', nome: 'NCMs' }, { id: 'pis', nome: 'PIS/COFINS' }, { id: 'prod', nome: 'Produtos' },
  { id: 'dev', nome: 'Devoluções' }, { id: 'canc', nome: 'Cancelamentos e numeração' }, { id: 'pag', nome: 'Pagamentos' }, { id: 'xml', nome: 'Buscar XML' }
];
var ORIGENS = ['Todas', 'NFe', 'NFCe', 'Compras'];
var NOME_ORIGEM = { NFe: 'NF-e emitida', NFCe: 'NFC-e', Compras: 'Compra' };

function desenharAba() {
  var r = RESUMO, a = ATUAL.aba, c = $('conteudo'), html = '';
  if (a === 'xml') { telaBusca(c); return; }
  if (a === 'dias') { telaDias(c); return; }
  var ferr = function (comOrigem, nota) {
    return '<div class="ferr">' + (comOrigem ? '<div class="seg" role="group" aria-label="Origem">' + ORIGENS.map(function (o) { return '<button type="button" data-o="' + o + '" aria-pressed="' + (o === ATUAL.origem) + '">' + (o === 'Todas' ? 'Todas' : NOME_ORIGEM[o]) + '</button>'; }).join('') + '</div>' : '') +
      '<input type="search" id="fTab" placeholder="Filtrar…" aria-label="Filtrar tabela"><button class="btn sec" type="button" id="bCsv">Exportar para Excel (CSV)</button></div>' + (nota ? '<p class="nota">' + nota + '</p>' : '');
  };
  if (a === 'trib') { html = ferr(true, 'Valor contábil = produtos − descontos + frete + seguro + outras despesas + IPI + ICMS ST − ICMS desonerado. Documentos cancelados não entram. E/S: entrada ou saída.') + '<div id="t1"></div>'; }
  else if (a === 'ncm') { html = ferr(true, 'Agrupado por NCM, CST de ICMS e CST de PIS.') + '<div id="t1"></div>'; }
  else if (a === 'pis') { html = ferr(true, 'Útil para conferir produtos monofásicos (CST 04) e de alíquota zero (CST 06/07).') + '<div id="t1"></div>'; }
  else if (a === 'prod') { html = ferr(true, 'Os 300 produtos de maior valor em cada origem. Produtos distintos no mês: ' + int(r.produtosDistintos) + '.') + '<div id="t1"></div>'; }
  else if (a === 'dev') { html = ferr(false, 'Notas com finalidade de devolução ou CFOP de devolução: emitidas pela empresa (entrada de devolução de venda ou saída de devolução de compra) e recebidas de clientes.') + '<div id="t1"></div>'; }
  else if (a === 'canc') {
    html = '<div class="grade2"><div class="card"><h2>Documentos cancelados</h2><div id="t1"></div></div><div class="card"><h2>Inutilizações</h2><div id="t2"></div></div></div>' +
      '<div class="card"><h2>Falhas na numeração</h2><p class="nota">Números entre o primeiro e o último documento emitido no mês que não têm XML autorizado nem inutilização. Podem ser notas rejeitadas ou em digitação: confira no sistema e inutilize se for o caso.</p><div id="t3"></div></div>' +
      '<div class="ferr"><button class="btn sec" type="button" id="bCsv">Exportar cancelados (CSV)</button></div>';
  }
  else if (a === 'pag') { html = ferr(false, 'Formas de pagamento informadas nas NF-e e NFC-e autorizadas (troco já descontado do dinheiro). Use para conferir com os extratos das maquininhas e do PIX.') + '<div id="t1"></div>'; }
  c.innerHTML = html;
  c.querySelectorAll('.seg button').forEach(function (b) { b.addEventListener('click', function () { ATUAL.origem = b.dataset.o; desenharAba(); }); });
  var dadosAba = function () {
    var lista = { trib: r.tributacao, ncm: r.ncm, pis: r.pisCofins, prod: r.produtos, dev: r.devolucoes, canc: r.canceladas, pag: r.pagamentos }[a] || [];
    lista = lista.map(function (x) { var y = {}; for (var k in x) y[k] = x[k]; if (y.origem) y.origem = NOME_ORIGEM[y.origem] || y.origem; return y; });
    if (ATUAL.origem !== 'Todas' && ['trib','ncm','pis','prod'].indexOf(a) >= 0) lista = lista.filter(function (x) { return x.origem === NOME_ORIGEM[ATUAL.origem]; });
    if (a === 'pag') { ['NF-e emitida', 'NFC-e'].forEach(function (o) { var tot = lista.filter(function (x) { return x.origem === o; }).reduce(function (s, x) { return s + x.valor; }, 0); lista.forEach(function (x) { if (x.origem === o) x.part = tot ? 100 * x.valor / tot : 0; }); }); }
    return lista;
  };
  var colA = a === 'canc' ? 'canc' : a;
  var ordem = { trib: 'valor', ncm: 'valor', pis: 'valor', prod: 'valor', dev: 'data', canc: 'numero', pag: 'valor' }[a];
  var t1 = tabela($('t1'), COL[colA], dadosAba(), ordem, a !== 'dev' && a !== 'canc');
  if (a === 'canc') { tabela($('t2'), COL.inut, r.inutilizacoes || [], 'inicio', false); tabela($('t3'), COL.falha, r.falhasNumeracao || [], 'de', true); }
  if ($('fTab')) $('fTab').addEventListener('input', function () { t1.filtrar(this.value); });
  if ($('bCsv')) $('bCsv').addEventListener('click', function () { csv(COL[colA], t1.linhas(), (rotuloUnid(ATUAL.u) + ' ' + ATUAL.mes + ' ' + (ABAS.filter(function (x) { return x.id === a; })[0].nome)).replace(/[\\/:*?"<>|]/g, '-') + '.csv'); });
}

function fmt(tipo, v, x) {
  if (tipo === 'reg') return pillReg(x.regime, x.regimeFonte);
  if (tipo === 'int' && v == null) return '—';
  if (tipo === 'brl') return brl(v); if (tipo === 'int') return int(v); if (tipo === 'qtd') return qtd(v);
  if (tipo === 'pct') return pct(v); if (tipo === 'aliq') return aliq(v); if (tipo === 'data') return dataBR(v);
  return esc(v);
}
function tabela(alvo, cols, dados, ordemInicial, comTotal, opc) {
  opc = opc || {};
  var st = { k: ordemInicial, asc: false, filtro: '' };
  if (ordemInicial === 'data' || ordemInicial === 'dia' || ordemInicial === 'numero' || ordemInicial === 'inicio' || ordemInicial === 'de') st.asc = true;
  var visiveis = function () {
    var f = st.filtro.toUpperCase();
    var l = dados.filter(function (x) { return !f || cols.some(function (c) { return String(x[c[0]] == null ? '' : x[c[0]]).toUpperCase().indexOf(f) >= 0; }); });
    l.sort(function (a, b) { var va = a[st.k], vb = b[st.k]; var r = (typeof va === 'number' && typeof vb === 'number') ? va - vb : String(va).localeCompare(String(vb), 'pt-BR', { numeric: true }); return st.asc ? r : -r; });
    return l;
  };
  var desenhar = function () {
    if (!dados.length) { alvo.innerHTML = '<div class="vazio">Nada neste mês.</div>'; return; }
    var l = visiveis();
    var num = function (c) { return ['brl','int','qtd','pct','aliq'].indexOf(c[2]) >= 0; };
    var h = '<div class="tbl"><table><thead><tr>' + cols.map(function (c) { return '<th tabindex="0" data-k="' + c[0] + '" class="' + (num(c) ? 'n ' : '') + (st.k === c[0] ? 'ord' + (st.asc ? ' asc' : '') : '') + '">' + c[1] + '</th>'; }).join('') + '</tr></thead><tbody>' +
      l.map(function (x, i) { return '<tr' + (opc.clicar ? ' class="cli" tabindex="0" data-r="' + i + '"' : '') + '>' + cols.map(function (c) { var cls = num(c) ? 'n' : (c[2] === 'm' ? 'm' : (c[2] === 'w' ? 'w' : '')); return '<td class="' + cls + '">' + fmt(c[2], x[c[0]], x) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody>';
    if (comTotal && l.length > 1) {
      h += '<tfoot><tr>' + cols.map(function (c, i) { if (i === 0) return '<td>Total (' + int(l.length) + ' linhas)</td>'; if (!c[3]) return '<td></td>'; var s = l.reduce(function (a, x) { return a + (Number(x[c[0]]) || 0); }, 0); return '<td class="n">' + fmt(c[2], s) + '</td>'; }).join('') + '</tr></tfoot>';
    }
    alvo.innerHTML = h + '</table></div>';
    if (opc.clicar) {
      var tb = alvo.querySelector('tbody');
      tb.addEventListener('click', function (ev) { var tr = ev.target.closest('tr[data-r]'); if (tr) opc.clicar(l[+tr.dataset.r]); });
      tb.addEventListener('keydown', function (ev) { var tr = ev.target.closest('tr[data-r]'); if (tr && ev.key === 'Enter') opc.clicar(l[+tr.dataset.r]); });
    }
    alvo.querySelectorAll('th').forEach(function (th) {
      var ir = function () { if (st.k === th.dataset.k) st.asc = !st.asc; else { st.k = th.dataset.k; st.asc = false; } desenhar(); };
      th.addEventListener('click', ir); th.addEventListener('keydown', function (e) { if (e.key === 'Enter') ir(); });
    });
  };
  desenhar();
  return { filtrar: function (f) { st.filtro = f; desenhar(); }, linhas: visiveis };
}

function csv(cols, linhas, nome) {
  var cel = function (c, v) {
    if (v == null) return '';
    if (typeof v === 'number') return (c[2] === 'int' || c[2] === 'm') ? String(v) : String(Math.round(v * 1000) / 1000).replace('.', ',');
    var s = String(v); if (c[2] === 'm' && /^\d{8,}$/.test(s)) s = '="' + s + '"';
    return /[;"\n]/.test(s) && s.indexOf('="') !== 0 ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  var txt = '﻿' + cols.map(function (c) { return c[1]; }).join(';') + '\r\n' + linhas.map(function (x) { return cols.map(function (c) { return cel(c, x[c[0]]); }).join(';'); }).join('\r\n');
  baixarBlob(new Blob([txt], { type: 'text/csv;charset=utf-8' }), nome);
}
function baixarBlob(blob, nome) {
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

/* ---------------- download do ZIP em partes ---------------- */
function baixarZip() {
  var b = $('bZip'), info = $('zipInfo'), barra = $('barra'), u = ATUAL.u;
  b.disabled = true; info.textContent = 'Localizando o arquivo…';
  chamar('portalArquivo', TOKEN, u.contabilidade, u.cliente, u.subpasta, ATUAL.mes).then(function (f) {
    barra.classList.remove('hidden');
    var partes = [], i = 0;
    var proxima = function () {
      info.textContent = 'Baixando ' + Math.round(f.tamanho / 1024).toLocaleString('pt-BR') + ' KB… ' + Math.round(100 * i / f.partes) + '%';
      barra.firstChild.style.width = (100 * i / f.partes) + '%';
      if (i >= f.partes) {
        baixarBlob(new Blob(partes, { type: 'application/zip' }), f.nome);
        info.textContent = f.nome + ' · atualizado em ' + new Date(f.atualizado).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
        barra.classList.add('hidden'); b.disabled = false; return;
      }
      return chamar('portalParte', TOKEN, f.id, i).then(function (b64) {
        var bin = atob(b64), arr = new Uint8Array(bin.length);
        for (var k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
        partes.push(arr); i++; return proxima();
      });
    };
    return proxima();
  }).catch(function (e) { info.textContent = e.message; barra.classList.add('hidden'); b.disabled = false; });
}
